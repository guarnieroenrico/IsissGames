<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Piano Inclinato</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: scena a tutto schermo con la sfera sempre al centro, il piano scivola sotto di lei.
   HUD in alto, livella di inclinazione in basso al centro. Look unico e scuro per scelta. */
:root{
  --void:#120e1f; --board:#3b3552; --board2:#453e60; --wall:#8d86b8;
  --ice:#8fe7ff; --fan:#ffb02e; --hole:#ff4d6d; --goal:#b6ff4a;
  --fg:#efeaff; --dim:#9a93bd;
  --display:'Unbounded',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--fg);font-family:var(--body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.a-enter-vr,.a-enter-ar{display:none!important}
button{font-family:inherit}
button:focus-visible{outline:3px solid var(--goal);outline-offset:3px}

#stage{position:relative;width:100%;height:100%;overflow:hidden;background:var(--void);touch-action:none}
#stage a-scene{position:absolute!important;inset:0;width:100%!important;height:100%!important}
#zone{position:absolute;inset:0;z-index:2;touch-action:none;cursor:grab}

.hud{position:absolute;inset:0;z-index:3;padding:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.stats{display:grid;gap:7px;min-width:0;font:700 13px/1.2 var(--mono);letter-spacing:.05em;text-shadow:0 1px 10px rgba(0,0,0,.8)}
.stats .lv{font:800 20px/1 var(--display);letter-spacing:-.02em}
.stats .sub{color:var(--dim);font-weight:500}
.lives{display:flex;gap:7px;padding-top:2px}
.life{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#b9b2d8 60%,#6e6890)}
.life.off{background:transparent;box-shadow:inset 0 0 0 2px #4a4468}
.side{display:grid;gap:8px;justify-items:end}
#snd{pointer-events:auto;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);background:rgba(18,14,31,.7);border:1px solid rgba(154,147,189,.35);border-radius:6px;padding:6px 9px;cursor:pointer}
#lev{position:absolute;z-index:3;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:72px;height:72px;margin-left:-36px;border-radius:50%;background:rgba(18,14,31,.6);box-shadow:inset 0 0 0 2px rgba(239,234,255,.25);pointer-events:none}
#lev::before,#lev::after{content:"";position:absolute;background:rgba(239,234,255,.18)}
#lev::before{left:50%;top:8px;bottom:8px;width:1px}
#lev::after{top:50%;left:8px;right:8px;height:1px}
#lev i{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--goal);box-shadow:0 0 12px var(--goal)}

.joy{position:absolute;z-index:4;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;pointer-events:none;box-shadow:inset 0 0 0 2px rgba(239,234,255,.3);background:radial-gradient(circle,rgba(182,255,74,.12),transparent 70%)}
.joy.ghost{left:calc(24px + 66px);top:auto;bottom:calc(30px + env(safe-area-inset-bottom,0px));margin:0 0 0 -66px;transform:translateY(0);opacity:.45;box-shadow:inset 0 0 0 2px rgba(239,234,255,.25)}
.joy.ghost i{background:rgba(182,255,74,.5);box-shadow:none}
.joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;border-radius:50%;background:var(--goal);box-shadow:0 4px 18px rgba(182,255,74,.4);transform:translate(-50%,-50%)}

#flash{position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(circle,transparent 35%,rgba(255,77,109,.55));opacity:0;transition:opacity .4s}
#toast{position:absolute;z-index:5;left:50%;top:22%;transform:translateX(-50%);font:800 clamp(1.3rem,6vw,2.2rem)/1 var(--display);letter-spacing:-.02em;text-shadow:0 2px 20px #000;opacity:0;pointer-events:none;transition:opacity .4s;white-space:nowrap}
#toast.show{opacity:1}

#overlay{position:absolute;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:rgba(14,10,26,.78);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);overflow:auto}
.panel{width:min(30rem,100%);display:grid;gap:18px;min-width:0}
.kicker{margin:0;font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--goal)}
h1{margin:0;font:800 clamp(2.5rem,11.5vw,4.6rem)/.95 var(--display);letter-spacing:-.045em}
h1 span{color:var(--goal)}
h2{margin:0;font:800 clamp(1.6rem,7vw,2.4rem)/1.05 var(--display);letter-spacing:-.03em;text-wrap:balance}
.lead{margin:0;font-size:1.05rem;line-height:1.55;color:#cfc8ec;max-width:40ch}
.legend{margin:0;padding:0;list-style:none;display:grid;gap:10px;font-size:.92rem;line-height:1.35;color:var(--dim)}
.legend li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:center}
.sw{width:30px;height:30px;border-radius:7px;display:block}
.sw.hole{background:#000;box-shadow:inset 0 0 0 4px var(--hole);border-radius:50%}
.sw.ice{background:linear-gradient(135deg,#d6f6ff,var(--ice))}
.sw.fan{background:var(--fan);clip-path:polygon(0 25%,55% 25%,55% 0,100% 50%,55% 100%,55% 75%,0 75%)}
.sw.mud{background:#6b4a2e;box-shadow:inset 0 0 0 5px #4a3320}
.sw.bump{background:#ff5a7a;border-radius:50%;box-shadow:inset 0 0 0 4px #fff}
.sw.tele{background:transparent;border-radius:50%;box-shadow:inset 0 0 0 4px #b68bff}
.sw.bar{background:#ff7a3d;height:12px;margin:9px 0}
.legend b{color:var(--fg);font-weight:500}
.legend{max-height:none}
.cta{justify-self:start;font:800 1rem/1 var(--display);letter-spacing:-.01em;color:#16210a;background:var(--goal);border:0;border-radius:10px;padding:16px 24px;cursor:pointer;box-shadow:0 6px 0 #6f9e22}
.cta:active{transform:translateY(3px);box-shadow:0 3px 0 #6f9e22}
.keys{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:.92rem;line-height:1.4;color:var(--dim)}
.keys b{display:inline-block;min-width:4.6em;font:700 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--fg)}
.stat-grid{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px}
.stat-grid dt{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.stat-grid dd{margin:3px 0 0;font:800 1.5rem/1 var(--display);font-variant-numeric:tabular-nums}
.note{margin:0;font:500 12px var(--mono);letter-spacing:.06em;color:var(--dim)}
</style>
<script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-v1.5.0.min.js"></script>

<div id="stage">
  <a-scene embedded vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false" loading-screen="enabled:false"
           renderer="antialias:true;maxCanvasWidth:1920;maxCanvasHeight:1920"
           background="color:#120e1f" fog="type:linear;color:#120e1f;near:14;far:46">
    <a-entity light="type:hemisphere;color:#e6e0ff;groundColor:#2a2144;intensity:1.0"></a-entity>
    <a-entity light="type:directional;color:#fff4e0;intensity:0.9" position="-6 14 7"></a-entity>
    <a-entity id="cam" camera="fov:50;near:0.1;far:160" position="0 11 8.5"></a-entity>
  </a-scene>

  <div id="zone"></div>

  <div id="hud" class="hud" hidden>
    <div class="stats">
      <div class="lv" id="lv">Livello 1</div>
      <div id="tm">0:00</div>
      <div id="sc">0 punti</div>
      <div class="lives" id="lives" aria-label="Vite"><i class="life"></i><i class="life"></i><i class="life"></i></div>
      <div class="sub" id="sd">seme</div>
    </div>
    <div class="side">
      <button id="snd" type="button">Audio on</button>
    </div>
  </div>
  <div id="lev" hidden><i id="levdot"></i></div>

  <div class="joy" id="joy" hidden><i id="knob"></i></div>
  <div class="joy ghost" id="ghost" hidden><i></i></div>
  <div id="flash"></div>
  <div id="toast"></div>
  <div id="overlay"></div>
</div>

(function(){
'use strict';
var THREE=AFRAME.THREE;
var CS=2.6,T=0.22,WALL_H=0.55,BR=0.3,HOLE_R=0.46,G=15,MAXT=0.32,FAN_A=6.5,VMAX=10;

/* ---------- utilità ---------- */
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,r){for(var i=arr.length-1;i>0;i--){var j=(r()*(i+1))|0;var t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;}
function fmt(t){var s=Math.floor(t);return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2);}
var ac=null;
function beep(f,d,type,vol){
  if(muted)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
    o.type=type||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(vol||0.06,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}
function toast(txt){
  toastEl.textContent=txt;toastEl.classList.add('show');
  clearTimeout(toastTO);toastTO=setTimeout(function(){toastEl.classList.remove('show');},1400);
}

/* ---------- generazione del livello ---------- */
function genMaze(cw,ch,rand){
  var n=cw*ch,open=new Uint8Array(n),vis=new Uint8Array(n);
  function link(a,b,d){open[a]|=1<<d;open[b]|=1<<((d+2)%4);}
  vis[0]=1;
  var st=[0];
  while(st.length){
    var cur=st[st.length-1],x=cur%cw,z=(cur/cw)|0,nb=[];
    for(var d=0;d<4;d++){
      var nx=x+DIRS[d][0],nz=z+DIRS[d][1];
      if(nx>=0&&nz>=0&&nx<cw&&nz<ch&&!vis[nz*cw+nx])nb.push([nz*cw+nx,d]);
    }
    if(!nb.length){st.pop();continue;}
    var c=nb[(rand()*nb.length)|0];
    vis[c[0]]=1;link(cur,c[0],c[1]);st.push(c[0]);
  }
  /* passaggi in più: più vie per arrivare all'uscita */
  var extra=Math.floor(n*0.16);
  for(var i=0;i<extra;i++){
    var a=(rand()*n)|0,dd=(rand()*4)|0,ax=a%cw+DIRS[dd][0],az=((a/cw)|0)+DIRS[dd][1];
    if(ax>=0&&az>=0&&ax<cw&&az<ch&&!(open[a]&(1<<dd)))link(a,az*cw+ax,dd);
  }
  /* distanze dalla partenza, uscita nella cella più lontana */
  var dist=new Int32Array(n).fill(-1),q=[0],qi=0;dist[0]=0;
  while(qi<q.length){
    var ci=q[qi++],cx=ci%cw,cz=(ci/cw)|0;
    for(var k=0;k<4;k++){
      if(!(open[ci]&(1<<k)))continue;
      var j=(cz+DIRS[k][1])*cw+cx+DIRS[k][0];
      if(dist[j]<0){dist[j]=dist[ci]+1;q.push(j);}
    }
  }
  var ex=0,maxD=0;
  for(var m=0;m<n;m++)if(dist[m]>maxD){maxD=dist[m];ex=m;}
  /* rettangoli dei muri */
  var walls=[],h=T/2,x2,z2;
  for(z2=0;z2<ch;z2++)for(x2=0;x2<cw;x2++){
    var o=open[z2*cw+x2];
    if(!(o&1)){var ccx=(x2+1)*CS;walls.push({x0:ccx-h,x1:ccx+h,z0:z2*CS-h,z1:(z2+1)*CS+h});}
    if(!(o&2)){var ccz=(z2+1)*CS;walls.push({x0:x2*CS-h,x1:(x2+1)*CS+h,z0:ccz-h,z1:ccz+h});}
    if(x2===0)walls.push({x0:-h,x1:h,z0:z2*CS-h,z1:(z2+1)*CS+h});
    if(z2===0)walls.push({x0:x2*CS-h,x1:(x2+1)*CS+h,z0:-h,z1:h});
  }
  return {cw:cw,ch:ch,open:open,dist:dist,exit:ex,maxD:maxD,walls:walls};

function ballTexture(){
  var c=document.createElement('canvas');c.width=1024;c.height=512;
  var x=c.getContext('2d');
  x.fillStyle='#ffffff';x.fillRect(0,0,1024,512);
  var t=new THREE.CanvasTexture(c);
  if(THREE.SRGBColorSpace)t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=4;
  var img=new Image();
  img.onload=function(){
    x.fillStyle='#ffffff';x.fillRect(0,0,1024,512);
    for(var i=0;i<4;i++)for(var j=0;j<2;j++)x.drawImage(img,i*256,j*256,256,256);
    t.needsUpdate=true;
  };
  img.src=LOGO;
  return t;
}
function disposeRoot(){
  if(!root)return;
  scene.object3D.remove(root);
  root.traverse(function(o){
    if(o.geometry)o.geometry.dispose();
    if(o.material){
      var ms=Array.isArray(o.material)?o.material:[o.material];
      ms.forEach(function(m){m.dispose();});
    }
  });
}
function cellCenter(i){return [(i%M.cw+0.5)*CS,(((i/M.cw)|0)+0.5)*CS];}

function buildLevel(level){
  disposeRoot();
  root=new THREE.Group();scene.object3D.add(root);
  seed=(Math.random()*1e6)|0;
  var rand=rng(seed);
  var cw=Math.min(3+level,13),ch=Math.min(3+level,10);
  M=genMaze(cw,ch,rand);
  var n=cw*ch,i,x,z;

  /* tipi di cella */
  var type=new Uint8Array(n),fdir=new Uint8Array(n);
  var cand=[];
  for(i=1;i<n;i++)if(i!==M.exit)cand.push(i);
  shuffle(cand,rand);
  var nHole=Math.min(Math.floor(n*0.09)+level,Math.floor(n*0.28));
  var nFan=level>=3?Math.min(level-2,6):0;
  var nBump=level>=4?Math.min(level-3,6):0;
  var nTele=level>=5?(level>=9?4:2):0;
  var nSweep=level>=6?Math.min(level-5,4):0;
  var nMud=level>=4?Math.min(Math.floor(n*0.07)+1,Math.floor(n*0.15)):0;
  var nIce=level>=2?Math.min(Math.floor(n*0.12)+1,Math.floor(n*0.25)):0;
  var taken=[];
  function take(count,tp,minD,setup){
    var got=0;
    for(var q=0;q<cand.length&&got<count;q++){
      var c=cand[q];
      if(type[c]||M.dist[c]<minD)continue;
      type[c]=tp;taken.push(c);if(setup)setup(c);got++;
    }
    return got;
  }
  var h=take(nHole,HOLE,2,null);
  var f=take(nFan,FAN,1,function(c){fdir[c]=(rand()*4)|0;});
  M.sweepCells=[];M.teleCells=[];
  take(nBump,BUMP,1,null);
  take(nTele,TELE,2,function(c){M.teleCells.push(c);});
  take(nSweep,SWEEP,2,function(c){M.sweepCells.push(c);});
  take(nMud,MUD,1,null);
  var ic=take(nIce,ICE,1,null);
  M.type=type;M.fdir=fdir;M.nHole=h;M.nFan=f;M.nIce=ic;
  var tp2={};
  for(var tq=0;tq+1<M.teleCells.length;tq+=2){tp2[M.teleCells[tq]]=M.teleCells[tq+1];tp2[M.teleCells[tq+1]]=M.teleCells[tq];}

    var base=new THREE.Mesh(baseG,baseM);base.position.y=0.04;fg.add(base);
    var blades=new THREE.Group();blades.position.y=0.11;
    for(var b=0;b<3;b++){var bl=new THREE.Mesh(bladeG,bladeM);bl.rotation.y=b*Math.PI/3;blades.add(bl);}
    fg.add(blades);
    var d=fdir[i],arrows=[];
    for(var a=0;a<3;a++){
      var ar=new THREE.Mesh(arrG,arrM.clone());
      if(d===0)ar.rotation.z=-Math.PI/2;else if(d===2)ar.rotation.z=Math.PI/2;else if(d===1)ar.rotation.x=Math.PI/2;else ar.rotation.x=-Math.PI/2;
      ar.position.y=0.2;fg.add(ar);arrows.push(ar);
    }
    root.add(fg);
    fans.push({cx:c5[0],cz:c5[1],d:d,blades:blades,arrows:arrows});
  }

  /* paraurti */
  bumps=[];
  var bG=new THREE.CylinderGeometry(0.42,0.47,0.5,24),bM=new THREE.MeshStandardMaterial({color:0xff5a7a,emissive:0x5a1226,roughness:0.35});
  var bRG=new THREE.TorusGeometry(0.42,0.04,8,28),bRM=new THREE.MeshBasicMaterial({color:0xffffff});
  for(i=0;i<n;i++){
    if(type[i]!==BUMP)continue;
    var c8=cellCenter(i),bgp=new THREE.Group();bgp.position.set(c8[0],0,c8[1]);
    var bmesh=new THREE.Mesh(bG,bM);bmesh.position.y=0.25;bgp.add(bmesh);
    var brg=new THREE.Mesh(bRG,bRM);brg.rotation.x=Math.PI/2;brg.position.y=0.5;bgp.add(brg);
    root.add(bgp);bumps.push({cx:c8[0],cz:c8[1],g:bgp,t:0});
  }
  /* teletrasporti, a coppie */
  teles=[];
  var tcols=[0xb68bff,0x58e1ff,0xff9bd0,0xffd45e];
  for(i=0;i<M.teleCells.length;i++){
    var tc=M.teleCells[i],c9=cellCenter(tc),colr=tcols[(i>>1)%4];
    var tg=new THREE.Group();tg.position.set(c9[0],0,c9[1]);
    var tr=new THREE.Mesh(new THREE.TorusGeometry(0.6,0.07,10,36),new THREE.MeshBasicMaterial({color:colr}));
    tr.rotation.x=Math.PI/2;tr.position.y=0.07;tg.add(tr);
    var td=new THREE.Mesh(new THREE.CircleGeometry(0.56,28),new THREE.MeshBasicMaterial({color:colr,transparent:true,opacity:0.35,side:THREE.DoubleSide}));
    td.rotation.x=-Math.PI/2;td.position.y=0.03;tg.add(td);
    var ti=new THREE.Mesh(new THREE.TorusGeometry(0.3,0.04,8,24),new THREE.MeshBasicMaterial({color:0xffffff}));
    ti.rotation.x=Math.PI/2;ti.position.y=0.09;tg.add(ti);
    root.add(tg);teles.push({ring:ti,g:tg});
  }
  /* barre mobili */
  sweeps=[];M.dyn=[];
  var swG=new THREE.BoxGeometry(1.6,0.5,0.34),swM=new THREE.MeshStandardMaterial({color:0xff7a3d,emissive:0x4a1a08,roughness:0.5});
  for(i=0;i<M.sweepCells.length;i++){
    var sc=M.sweepCells[i],c10=cellCenter(sc);
    var rect={x0:0,x1:0,z0:0,z1:0};M.dyn.push(rect);
    var sm2=new THREE.Mesh(swG,swM);sm2.position.y=0.25;
    var axis=(rand()<0.5)?0:1;
    if(axis===1)sm2.rotation.y=Math.PI/2;
    root.add(sm2);
    sweeps.push({cx:c10[0],cz:c10[1],axis:axis,ph:rand()*6.28,m:sm2,r:rect});
  }
  M.all=M.walls.concat(M.dyn);
  updateSweepers(0);

  /* partenza e uscita */
  var padM=new THREE.Mesh(new THREE.RingGeometry(0.55,0.75,32),new THREE.MeshBasicMaterial({color:0xb6ff4a,transparent:true,opacity:0.4,side:THREE.DoubleSide}));
  padM.rotation.x=-Math.PI/2;padM.position.set(CS/2,0.015,CS/2);root.add(padM);
  var ec=cellCenter(M.exit),eg=new THREE.Group();eg.position.set(ec[0],0,ec[1]);
  var ring=new THREE.Mesh(new THREE.TorusGeometry(0.7,0.07,10,40),new THREE.MeshBasicMaterial({color:0xb6ff4a,fog:false}));
  ring.rotation.x=Math.PI/2;ring.position.y=0.08;
  var disc=new THREE.Mesh(new THREE.CircleGeometry(0.66,32),new THREE.MeshBasicMaterial({color:0xb6ff4a,transparent:true,opacity:0.4,side:THREE.DoubleSide,fog:false}));
  disc.rotation.x=-Math.PI/2;disc.position.y=0.03;
  var beam=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,3,24,1,true),new THREE.MeshBasicMaterial({color:0xb6ff4a,transparent:true,opacity:0.2,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,fog:false}));
  beam.position.y=1.5;
  eg.add(ring);eg.add(disc);eg.add(beam);root.add(eg);
  exitG={ring:ring,beam:beam,x:ec[0],z:ec[1]};

  /* polvere sospesa sotto il piano, per dare profondità */
  var np=260,pos=new Float32Array(np*3),BW=cw*CS,BH=ch*CS;
  for(i=0;i<np;i++){
    pos[i*3]=-14+rand()*(BW+28);pos[i*3+1]=-3-rand()*20;pos[i*3+2]=-14+rand()*(BH+28);
  }
  var pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
  root.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0x9a86ff,size:0.16,sizeAttenuation:true,transparent:true,opacity:0.8})));

  /* sfera */
  if(!ballMesh){
    ballTex=ballTexture();
    ballMesh=new THREE.Mesh(new THREE.SphereGeometry(BR,32,24),new THREE.MeshStandardMaterial({map:ballTex,roughness:0.28,metalness:0.2}));
    scene.object3D.add(ballMesh);
  }
  resetBall();
  px=bx;pz=bz;snapCam=true;
  $('sd').textContent='seme '+seed;
}
function resetBall(){
  bx=CS/2;bz=CS/2;vx=vz=0;fallY=0;fallHole=null;fallT=0;
  if(ballMesh)ballMesh.quaternion.copy(ballStart());
}
/* orienta la sfera in modo che un logo guardi verso l'alto, dritto rispetto alla camera */
function ballStart(){
  var UP=new THREE.Vector3(0,1,0);
  var d=new THREE.Vector3(-0.5,0.7071,0.5).normalize();
  var q1=new THREE.Quaternion().setFromUnitVectors(d,UP);
  var t=new THREE.Vector3(0.5,0.7071,-0.5).normalize().applyQuaternion(q1);
  var a=Math.atan2(t.x,-t.z);
  return new THREE.Quaternion().setFromAxisAngle(UP,a).multiply(q1);
}

/* ---------- fisica ---------- */
function cellOf(x,z){
  var cx=Math.max(0,Math.min(M.cw-1,Math.floor(x/CS))),cz=Math.max(0,Math.min(M.ch-1,Math.floor(z/CS)));
  return cz*M.cw+cx;
}
function updateSweepers(t){
  for(var i=0;i<sweeps.length;i++){
    var w=sweeps[i],off=Math.sin(t*1.5+w.ph)*0.95,hx,hz,cx=w.cx,cz=w.cz;
    if(w.axis===0){cz+=off;hx=0.8;hz=0.17;}else{cx+=off;hx=0.17;hz=0.8;}
    w.r.x0=cx-hx;w.r.x1=cx+hx;w.r.z0=cz-hz;w.r.z1=cz+hz;
    w.m.position.x=cx;w.m.position.z=cz;
  }
}
function step(h){
  var ax=-G*Math.sin(rz),az=G*Math.sin(rx);
  var ci=cellOf(bx,bz),t=M.type[ci];
  if(t===FAN){
    var c=cellCenter(ci);
    if(Math.abs(bx-c[0])<CS/2&&Math.abs(bz-c[1])<CS/2){ax+=DIRS[M.fdir[ci]][0]*FAN_A;az+=DIRS[M.fdir[ci]][1]*FAN_A;}
  }
  vx+=ax*h;vz+=az*h;
  var damp=Math.exp(-(t===ICE?0.07:(t===MUD?4.2:1.15))*h);
  vx*=damp;vz*=damp;
  var sp=Math.hypot(vx,vz);
  if(sp>VMAX){vx*=VMAX/sp;vz*=VMAX/sp;}
  bx+=vx*h;bz+=vz*h;
  /* collisioni con i muri */
  var W=M.all;
  for(var i=0;i<W.length;i++){
    var w=W[i];
    if(bx<w.x0-BR||bx>w.x1+BR||bz<w.z0-BR||bz>w.z1+BR)continue;
    var nx=Math.max(w.x0,Math.min(bx,w.x1)),nz=Math.max(w.z0,Math.min(bz,w.z1));
    var dx=bx-nx,dz=bz-nz,d2=dx*dx+dz*dz;
    if(d2>=BR*BR)continue;
    var d,ux,uz;
    if(d2>1e-9){d=Math.sqrt(d2);ux=dx/d;uz=dz/d;}
    else{
      /* centro dentro il muro: espelli lungo l'asse più corto */
      var l=bx-w.x0,r=w.x1-bx,tp=bz-w.z0,bt=w.z1-bz,m=Math.min(l,r,tp,bt);
      if(m===l){ux=-1;uz=0;d=-l;}else if(m===r){ux=1;uz=0;d=-r;}else if(m===tp){ux=0;uz=-1;d=-tp;}else{ux=0;uz=1;d=-bt;}
    }
    bx+=ux*(BR-d);bz+=uz*(BR-d);
    var vn=vx*ux+vz*uz;
    if(vn<0){
      vx-=1.35*vn*ux;vz-=1.35*vn*uz;
      if(-vn>cd)cd=-vn;
    }
  }
  /* paraurti */
  ci=cellOf(bx,bz);
  if(M.type[ci]===BUMP){
    var bc=cellCenter(ci),ddx=bx-bc[0],ddz=bz-bc[1],dd=Math.hypot(ddx,ddz);
    if(dd<BR+0.42&&dd>1e-6){
      var nx2=ddx/dd,nz2=ddz/dd;
      bx=bc[0]+nx2*(BR+0.42);bz=bc[1]+nz2*(BR+0.42);
      var vn2=vx*nx2+vz*nz2;
      if(vn2<0){vx-=2.6*vn2*nx2;vz-=2.6*vn2*nz2;}
      var vn3=vx*nx2+vz*nz2;
      if(vn3<3.5){vx+=(3.5-vn3)*nx2;vz+=(3.5-vn3)*nz2;}
      for(var bi=0;bi<bumps.length;bi++)if(bumps[bi].cx===bc[0]&&bumps[bi].cz===bc[1])bumps[bi].t=0.25;
      if(cooldownOK())beep(520+Math.random()*120,0.08,'square',0.04);
    }
  }
  /* buco */
  if(M.type[ci]===HOLE){
    var hc=cellCenter(ci);
    if(Math.hypot(bx-hc[0],bz-hc[1])<HOLE_R-0.06){
      S.state='falling';fallT=0;fallHole=hc;
      beep(300,0.5,'sawtooth',0.07);
      return;
    }
  }
  /* teletrasporto */
  if(M.type[ci]===TELE){
    var tcn=cellCenter(ci),td2=Math.hypot(bx-tcn[0],bz-tcn[1]);
    if(!teleLock&&td2<0.4&&M.partner[ci]!==undefined){
      var dest=cellCenter(M.partner[ci]);
      bx=dest[0];bz=dest[1];vx*=0.5;vz*=0.5;teleLock=true;
      beep(900,0.08,'sine',0.06);setTimeout(function(){beep(1300,0.12,'sine',0.06);},70);
      px=bx;pz=bz;
      return;
    }
    if(teleLock&&td2>0.75)teleLock=false;
  }else teleLock=false;
  /* uscita */
  if(Math.hypot(bx-exitG.x,bz-exitG.z)<0.55){levelDone();}
}
function updatePlay(dt){
  S.time+=dt;
  var tx=ix,tz=iz;
  var k=1-Math.exp(-dt*9);
  rz+=(-tx*MAXT-rz)*k;rx+=(tz*MAXT-rx)*k;
  cd=0;
  var sub=3,h=dt/sub;
  for(var i=0;i<sub&&S.state==='play';i++)step(h);
  if(cd>2.5&&cooldownOK()){beep(110+cd*14,0.06,'triangle',0.05);}
  var ct0=M.type[cellOf(bx,bz)];
  if(ct0!==lastType){if(ct0===ICE)toast('Ghiaccio');else if(ct0===MUD)toast('Fango');lastType=ct0;}
}
var lastHit=0;
function cooldownOK(){var n=performance.now();if(n-lastHit>120){lastHit=n;return true;}return false;}

function updateFall(dt){
  fallT+=dt;
  var k=Math.min(1,dt*6);
  bx+=(fallHole[0]-bx)*k;bz+=(fallHole[1]-bz)*k;
  vx*=0.9;vz*=0.9;
  fallY=0.5*22*fallT*fallT;
  rz+=(0-rz)*Math.min(1,dt*3);rx+=(0-rx)*Math.min(1,dt*3);
  if(fallT>0.85){
    S.lives--;
    var fl=$('flash');fl.style.opacity=1;setTimeout(function(){fl.style.opacity=0;},140);
    if(S.lives<=0){gameOver();return;}
    resetBall();px=bx;pz=bz;rx=rz=0;snapCam=true;S.state='play';
    toast('Ci riprovi');
  }
}
function levelDone(){
  S.state='between';
  var par=18+M.maxD*2.4;
  var bonus=100*S.level+Math.round(Math.max(0,par-S.time)*10);
  S.score+=bonus;
  beep(660,0.12,'triangle');setTimeout(function(){beep(880,0.12,'triangle');},120);setTimeout(function(){beep(1320,0.25,'triangle');},240);
  var nl=S.level+1,news=[];
  if(nl===2)news.push('ghiaccio');
  if(nl===3)news.push('ventole');
  if(nl===4)news.push('fango e paraurti');
  if(nl===5)news.push('teletrasporti');
  if(nl===6)news.push('barre mobili');
  panel('<p class="kicker">Uscita raggiunta</p><h2>Livello '+S.level+' superato</h2>'+
    '<dl class="stat-grid"><div><dt>Tempo</dt><dd>'+fmt(S.time)+'</dd></div><div><dt>Bonus</dt><dd>+'+bonus+'</dd></div>'+
    '<div><dt>Punti</dt><dd>'+S.score+'</dd></div><div><dt>Vite</dt><dd>'+S.lives+'</dd></div></dl>'+
    '<p class="note">Prossimo piano: '+Math.min(3+nl,13)+' × '+Math.min(3+nl,10)+' celle'+(news.length?' · novità: '+news.join(', '):'')+'</p>'+
    '<button class="cta" data-act="next" type="button">Livello '+nl+'</button>');
  hudUpdate();
}
function gameOver(){
  S.state='over';
  var isBest=S.score>best;
  if(isBest){best=S.score;try{localStorage.setItem('piano-best',String(best));}catch(e){}}
  beep(220,0.25,'sawtooth');setTimeout(function(){beep(165,0.4,'sawtooth');},200);
  hud.hidden=true;$('lev').hidden=true;
  panel('<p class="kicker">Vite finite</p><h2>Sei arrivato al livello '+S.level+'</h2>'+
    '<dl class="stat-grid"><div><dt>Punti</dt><dd>'+S.score+'</dd></div><div><dt>Record</dt><dd>'+best+'</dd></div></dl>'+
    (isBest?'<p class="note">Nuovo record personale.</p>':'')+
    '<button class="cta" data-act="start" type="button">Riprova</button>');
}

/* ---------- fotogramma ---------- */
function frame(dt){
  if(!M||!ballMesh)return;
  dt=Math.min(dt,0.05);
  var t=performance.now()/1000;

  /* input */
  var kx=(keys.has('ArrowRight')||keys.has('KeyD')?1:0)-(keys.has('ArrowLeft')||keys.has('KeyA')?1:0);
  var kz=(keys.has('ArrowDown')||keys.has('KeyS')?1:0)-(keys.has('ArrowUp')||keys.has('KeyW')?1:0);
  ix=Math.max(-1,Math.min(1,kx+drag.x));iz=Math.max(-1,Math.min(1,kz+drag.z));

  var portrait=stage.clientWidth<stage.clientHeight;
  if(S.state==='play')updatePlay(dt);
  else if(S.state==='falling')updateFall(dt);
  else if(S.state==='menu'||S.state==='over'){
    rx=Math.sin(t*0.5)*0.1;rz=Math.cos(t*0.4)*0.1;
  }

  /* centro di rotazione e posizione del piano */
  var inGame=(S.state==='play'||S.state==='falling'||S.state==='between');
  var tpx=inGame?bx:M.cw*CS/2,tpz=inGame?bz:M.ch*CS/2;
  var kk=snapCam?1:1-Math.exp(-dt*(inGame?14:2));
  px+=(tpx-px)*kk;pz+=(tpz-pz)*kk;
  e1.set(rx,0,rz,'XYZ');
  root.rotation.copy(e1);
  tmpV.set(px,BR,pz).applyEuler(e1);
  root.position.set(-tmpV.x,-tmpV.y,-tmpV.z);
  tmpV.set(bx-px,0,bz-pz).applyEuler(e1);
  ballMesh.position.set(tmpV.x,tmpV.y-fallY,tmpV.z);
  ballMesh.visible=true;
  if(S.state==='play'||S.state==='falling'){
    var sp=Math.hypot(vx,vz);
    if(sp>0.01){
      tmpV.set(vz,0,-vx).normalize();
      ballMesh.rotateOnWorldAxis(tmpV,sp*dt/BR);
    }
  }

  /* animazioni */
  for(var i=0;i<fans.length;i++){
    var f=fans[i];
    f.blades.rotation.y+=dt*14;
    for(var a=0;a<f.arrows.length;a++){
      var ph=((t*0.9+a/3)%1),o=(ph-0.5)*1.5;
      f.arrows[a].position.x=DIRS[f.d][0]*o;f.arrows[a].position.z=DIRS[f.d][1]*o;
      f.arrows[a].material.opacity=Math.sin(ph*Math.PI)*0.9;
    }
  }
  sweepT+=dt;updateSweepers(sweepT);
  for(i=0;i<bumps.length;i++){var bu=bumps[i];if(bu.t>0)bu.t-=dt;bu.g.scale.setScalar(1+Math.max(0,bu.t)*1.2);}
  for(i=0;i<teles.length;i++)teles[i].ring.rotation.z+=dt*3;
  if(exitG){exitG.ring.scale.setScalar(1+Math.sin(t*3)*0.07);exitG.beam.material.opacity=0.18+Math.sin(t*3)*0.05;}

  /* camera */
  var target=inGame?(portrait?[0,18,8.5]:[0,13,6.5]):[0,Math.max(M.cw*CS,M.ch*CS)*(portrait?1.35:0.95)+6,Math.max(M.cw*CS,M.ch*CS)*0.55+3];
  var ck=snapCam?1:1-Math.exp(-dt*3);
  camP.x+=(target[0]-camP.x)*ck;camP.y+=(target[1]-camP.y)*ck;camP.z+=(target[2]-camP.z)*ck;
  camObj.position.copy(camP);
  camObj.rotation.set(-Math.atan2(camP.y,camP.z),0,0,'YXZ');
  snapCam=false;

  /* livella */
  var dot=$('levdot');
  dot.style.transform='translate('+(ix*22)+'px,'+(iz*22)+'px)';

  $('ghost').hidden=!(isTouch&&S.state==='play'&&pid===null);
  if(inGame){hudT+=dt;if(hudT>0.1){hudT=0;hudUpdate();}}
}

function startLevel(){

}
function startGame(){

  startLevel();
}
overlay.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');
  if(!b)return;
  var act=b.getAttribute('data-act');
  if(act==='start'){startGame();beep(520,0.1,'triangle');}

$('snd').addEventListener('click',function(){muted=!muted;this.textContent=muted?'Audio off':'Audio on';this.blur();});

/* ---------- controlli ---------- */
window.addEventListener('keydown',function(e){
  if(e.code.indexOf('Arrow')===0||e.code==='Space')e.preventDefault();
  keys.add(e.code);
  if((e.code==='Enter'||e.code==='Space')&&!overlay.hidden&&(!document.activeElement||document.activeElement===document.body)){
    var b=overlay.querySelector('.cta');if(b)b.click();
  }
});
window.addEventListener('keyup',function(e){keys.delete(e.code);});
window.addEventListener('blur',function(){keys.clear();drag.x=drag.z=0;});

var pid=null,ax0=0,ay0=0,JR=56,joyEl=$('joy'),knob=$('knob');
function dragMove(e){
  var dx=e.clientX-ax0,dy=e.clientY-ay0,d=Math.hypot(dx,dy);
  if(d>JR){dx=dx/d*JR;dy=dy/d*JR;}
  knob.style.transform='translate(-50%,-50%) translate('+(dx*0.66)+'px,'+(dy*0.66)+'px)';
  var nx=dx/JR,nz=dy/JR;
  drag.x=Math.abs(nx)<0.08?0:nx;drag.z=Math.abs(nz)<0.08?0:nz;
}
function dragEnd(e){
  if(e.pointerId!==pid)return;
  pid=null;drag.x=drag.z=0;joyEl.hidden=true;
  knob.style.transform='translate(-50%,-50%)';
}
zone.addEventListener('pointerdown',function(e){
  if(e.pointerType==='touch')isTouch=true;
  if(pid!==null)return;
  pid=e.pointerId;zone.setPointerCapture(e.pointerId);
  var r=stage.getBoundingClientRect();
  ax0=e.clientX;ay0=e.clientY;
  joyEl.style.left=(e.clientX-r.left)+'px';joyEl.style.top=(e.clientY-r.top)+'px';
  joyEl.hidden=false;dragMove(e);
});
zone.addEventListener('pointermove',function(e){if(e.pointerId===pid)dragMove(e);});
zone.addEventListener('pointerup',dragEnd);
zone.addEventListener('pointercancel',dragEnd);

/* ---------- avvio ---------- */
AFRAME.registerComponent('marble-game',{
  tick:function(time,delta){frame(delta/1000);}
});
window.__marble={get:function(){return {bx:bx,bz:bz,vx:vx,vz:vz,state:S.state,lives:S.lives,type:M&&Array.from(M.type),cw:M&&M.cw,exit:M&&M.exit};},
  tp:function(x,z){bx=x;bz=z;vx=vz=0;},lvl:function(n){S.level=n;startLevel();},types:function(){return M.type.join('');}};
function init(){
  camObj=$('cam').object3D;
  camObj.rotation.order='YXZ';
  if(scene.renderer)scene.renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,isTouch?1.5:2));
  S.level=4;buildLevel(4);S.level=1;
  menu();
  scene.setAttribute('marble-game','');
}
if(scene.hasLoaded)init();else scene.addEventListener('loaded',init);
})();
