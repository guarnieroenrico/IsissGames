  /* ---------- suoni ---------- */
  var audio = null, muted = false;
  try { muted = localStorage.getItem('isissDinoMute') === '1'; } catch (e) {}
  var muteBtn = document.getElementById('mute');
  muteBtn.textContent = muted ? '🔇' : '🔊';
  muteBtn.addEventListener('click', function () {
    muted = !muted; muteBtn.textContent = muted ? '🔇' : '🔊';
    try { localStorage.setItem('isissDinoMute', muted ? '1' : '0'); } catch (e) {}
    canvas.focus();
  });
  function beep(seq, type, vol) {
    if (muted) return;
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
      var t = audio.currentTime;
      seq.forEach(function (n) {
        var o = audio.createOscillator(), g = audio.createGain();
        o.type = type || 'square';
        o.frequency.setValueAtTime(n[0], t + n[2]);
        if (n[3]) o.frequency.exponentialRampToValueAtTime(n[3], t + n[2] + n[1]);
        g.gain.setValueAtTime(vol || 0.05, t + n[2]);
        g.gain.exponentialRampToValueAtTime(0.0001, t + n[2] + n[1]);
        o.connect(g); g.connect(audio.destination);
        o.start(t + n[2]); o.stop(t + n[2] + n[1] + 0.02);
      });
    } catch (e) {}
  }
  var sJump = function () { beep([[420, 0.12, 0, 760]]); };
  var sPoint = function () { beep([[880, 0.08, 0], [1320, 0.12, 0.09]]); };
  var sHit = function () { beep([[220, 0.35, 0, 55]], 'sawtooth', 0.08); };

  /* ---------- stato ---------- */
  var hi = 0;
  try { hi = parseInt(localStorage.getItem('isissDinoHi'), 10) || 0; } catch (e) {}
  var st, L, obstacles, clouds, bumps, stars;
  var night = 0, nightTarget = 0, lastNightStep = 0;
  var scale = 1;

  function rnd(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }

  function reset() {
    st = {
      started: false, playing: false, crashed: false,
      speed: SPEED0, distance: 0, score: 0, run: 0, crashedAt: 0,
      flash: 0, flashLeft: 0, moonX: W - 90
    };
    L = { x: 25, y: GROUND - SIZE + 1, vy: 0, jumping: false, ducking: false, drop: false, reached: false, angle: 0 };
    obstacles = []; night = 0; nightTarget = 0; lastNightStep = 0;
    applyTheme();
  }
  function initScenery() {
    clouds = []; bumps = []; stars = [];
    for (var i = 0; i < 3; i++) clouds.push({ x: 120 + i * 190 + rnd(0, 60), y: rnd(25, 70) });
    for (i = 0; i < 40; i++) bumps.push({ x: rnd(0, W), y: GROUND + rnd(3, 8), w: rnd(1, 4) });
    for (i = 0; i < 9; i++) stars.push({ x: rnd(10, W - 120), y: rnd(8, 85), p: Math.random() * 6 });
  }

  function start() {
    st.started = true; st.playing = true; st.run = 0;
    hint.style.visibility = 'hidden';
  }
  function restart() {
    var keepHi = hi;
    reset(); initScenery(); hi = keepHi;
    start();
  }

  /* ---------- input ---------- */
  function press() {
    if (st.crashed) {
      if (performance.now() - st.crashedAt > RESTART_DELAY) { restart(); jump(); }
      return;
    }
    if (!st.started) start();
    jump();
  }
  function jump() {
    if (L.jumping || L.ducking) return;
    L.jumping = true; L.reached = false;
    L.vy = JUMP_V - st.speed / 10;
    sJump();
  }
  function release() {
    if (L.jumping && L.reached && L.vy < DROP_V) L.vy = DROP_V;
  }
  function duckOn() {
    if (!st.playing) return;
    if (L.jumping) L.drop = true; else L.ducking = true;
  }
  function duckOff() { L.drop = false; L.ducking = false; }

  var JUMP_KEYS = { 32: 1, 38: 1, 87: 1 }, DUCK_KEYS = { 40: 1, 83: 1 };
  document.addEventListener('keydown', function (e) {
    var k = e.keyCode;
    if (JUMP_KEYS[k]) { e.preventDefault(); if (!e.repeat) press(); }
    else if (DUCK_KEYS[k]) { e.preventDefault(); if (!e.repeat) duckOn(); }
    else if (k === 13 && st.crashed) { press(); }
  });
  document.addEventListener('keyup', function (e) {
    var k = e.keyCode;
    if (JUMP_KEYS[k]) release();
    else if (DUCK_KEYS[k]) duckOff();
  });

  var ptr = null;
  document.addEventListener('pointerdown', function (e) {
    if (e.target.closest && e.target.closest('button')) return;
    ptr = { id: e.pointerId, y: e.clientY, ducked: false };
    press();
  });
  document.addEventListener('pointermove', function (e) {
    if (!ptr || e.pointerId !== ptr.id) return;
    if (e.clientY - ptr.y > 28 && !ptr.ducked) { ptr.ducked = true; duckOn(); }
  });
  function pend(e) {
    if (!ptr || e.pointerId !== ptr.id) return;
    release(); if (ptr.ducked) duckOff(); ptr = null;
  }
  document.addEventListener('pointerup', pend);
  document.addEventListener('pointercancel', pend);

  document.getElementById('reload').addEventListener('click', function () { location.reload(); });

  /* Quando torna la rete, ricarica la pagina che l'utente voleva aprire. */
  window.addEventListener('online', function () {
    setTimeout(function () {
      if (/offline\.html$/.test(location.pathname)) location.replace(location.pathname.replace(/offline\.html$/, ''));
      else location.reload();
    }, 600);
  });

  /* ---------- ostacoli ---------- */
  var TYPES = {
    small: { w: 17, h: 35, y: 105, minGap: 120, maxCount: 3, minSpeed: 0 },
    large: { w: 25, h: 50, y: 90, minGap: 120, maxCount: 3, minSpeed: 0 },
    ptero: { w: 46, h: 40, ys: [100, 75, 50], minGap: 150, maxCount: 1, minSpeed: 8.5 }
  };
  function addObstacle() {
    var names = ['small', 'large', 'ptero'].filter(function (n) { return st.speed >= TYPES[n].minSpeed; });
    var last = obstacles[obstacles.length - 1];
    var name = names[rnd(0, names.length - 1)];
    if (last && last.name === name && last.same >= 2 && names.length > 1)
      name = names[(names.indexOf(name) + 1) % names.length];
    var t = TYPES[name];
    var count = (name === 'ptero') ? 1 : (st.speed < 4 ? 1 : rnd(1, t.maxCount));
    var w = t.w * count;
    var o = {
      name: name, count: count, w: w, h: t.h, x: W,
      y: name === 'ptero' ? t.ys[rnd(0, 2)] : t.y,
      off: name === 'ptero' ? (Math.random() < .5 ? .8 : -.8) : 0,
      frame: 0, ft: 0,
      same: (last && last.name === name) ? last.same + 1 : 1
    };
    var minGap = Math.round(w * st.speed + t.minGap * GAP_COEFF);
    o.gap = rnd(minGap, Math.round(minGap * 1.5));
    obstacles.push(o);
  }

  function box(o) {
    if (o.name === 'ptero') return { x: o.x + 8, y: o.y + 9, w: o.w - 16, h: 17 };
    return { x: o.x + 2, y: o.y + 3, w: o.w - 4, h: o.h - 3 };
  }
  function logoBox() {
    if (L.ducking && !L.jumping) return { x: L.x + 4, y: GROUND - 25 + 3, w: 48, h: 19 };
    return { x: L.x + 8, y: L.y + 8, w: SIZE - 16, h: SIZE - 10 };
  }
  function hit(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  /* ---------- aggiornamento ---------- */
  function update(dt) {
    var f = Math.min(dt / MS_FRAME, 3);

    // notte/giorno (transizione morbida)
    if (night !== nightTarget) {
      night += (nightTarget - night) * Math.min(1, 0.05 * f);
      if (Math.abs(night - nightTarget) < 0.01) night = nightTarget;
      applyTheme();
    }
    if (st.flashLeft > 0) st.flash += dt, st.flashLeft -= dt;

    if (!st.playing) return;

    st.run += dt;
    st.speed = Math.min(st.speed + ACCEL * f, SPEED_MAX);
    st.distance += st.speed * f;
    var sc = Math.ceil(st.distance * SCORE_COEFF);
    if (sc !== st.score) {
      if (sc > 0 && sc % 100 === 0 && Math.floor(sc / 100) !== Math.floor(st.score / 100)) {
        sPoint(); st.flash = 0; st.flashLeft = 750;
      }
      st.score = sc;
      var step = Math.floor(sc / NIGHT_EVERY);
      if (step !== lastNightStep) { lastNightStep = step; nightTarget = step % 2; }
    }

    // logo: salto e rotolamento
    if (L.jumping) {
      var v = L.vy * (L.drop ? DROP_COEFF : 1) * f;
      L.y += v;
      L.vy += GRAVITY * f;
      if (L.y < GROUND - SIZE + 1 - MIN_JUMP) L.reached = true;
      if (L.y >= GROUND - SIZE + 1) { L.y = GROUND - SIZE + 1; L.jumping = false; L.vy = 0; L.drop = false; }
    }
    L.angle += (st.speed * f) / (SIZE / 2) * (L.jumping ? .55 : 1);

    // scenario
    var i;
    st.moonX -= 0.25 * f; if (st.moonX < -20) st.moonX = W + 40;
    for (i = 0; i < clouds.length; i++) {
      clouds[i].x -= 0.15 * st.speed * f;
      if (clouds[i].x < -60) { clouds[i].x = W + rnd(0, 120); clouds[i].y = rnd(25, 70); }
    }
    for (i = 0; i < bumps.length; i++) {
      bumps[i].x -= st.speed * f;
      if (bumps[i].x < -8) { bumps[i].x = W + rnd(0, 60); bumps[i].y = GROUND + rnd(3, 8); bumps[i].w = rnd(1, 4); }
    }

    // ostacoli
    for (i = obstacles.length - 1; i >= 0; i--) {
      var o = obstacles[i];
      o.x -= (st.speed + o.off) * f;
      if (o.name === 'ptero') { o.ft += dt; if (o.ft > 140) { o.ft = 0; o.frame ^= 1; } }
      if (o.x + o.w < 0) obstacles.splice(i, 1);
    }
    if (st.run > CLEAR_TIME) {
      var last = obstacles[obstacles.length - 1];
      if (!last || (last.x + last.w + last.gap < W)) addObstacle();
    }

    // collisioni
    var lb = logoBox();
    for (i = 0; i < obstacles.length; i++) {
      if (obstacles[i].x > L.x + SIZE + 10) break;
      if (hit(lb, box(obstacles[i]))) { crash(); break; }
    }
  }

  function crash() {
    st.playing = false; st.crashed = true; st.crashedAt = performance.now();
    L.drop = false;
    if (L.jumping) { /* resta dov'è, poi cade */ L.y = Math.min(L.y, GROUND - SIZE + 1); }
    if (st.score > hi) {
      hi = st.score;
      try { localStorage.setItem('isissDinoHi', String(hi)); } catch (e) {}
    }
    sHit();
  }

  /* ---------- disegno ---------- */
  function lerp(a, b, t) { return Math.round(a + (b - a) * t); }
  function fgColor(alpha) {
    var v = lerp(83, 172, night);
    return 'rgba(' + v + ',' + v + ',' + v + ',' + (alpha == null ? 1 : alpha) + ')';
  }
  function applyTheme() {
    var bg = lerp(255, 32, night), tx = lerp(32, 232, night), mu = lerp(95, 154, night);
    root.style.setProperty('--bg', 'rgb(' + bg + ',' + bg + ',' + bg + ')');
    root.style.setProperty('--text', 'rgb(' + tx + ',' + tx + ',' + tx + ')');
    root.style.setProperty('--muted', 'rgb(' + mu + ',' + mu + ',' + mu + ')');
    var m = document.querySelector('meta[name=theme-color]');
    if (m) m.setAttribute('content', 'rgb(' + bg + ',' + bg + ',' + bg + ')');
  }

  function drawCloud(x, y) {
    ctx.fillStyle = fgColor(.55);
    ctx.fillRect(x + 8, y, 22, 4);
    ctx.fillRect(x + 4, y + 4, 34, 4);
    ctx.fillRect(x, y + 8, 46, 4);
    ctx.fillRect(x + 12, y - 4, 12, 4);
  }

  function drawCactus(o) {
    ctx.fillStyle = fgColor();
    var u = o.w / o.count, big = o.name === 'large';
    var sx = u / 17, sy = o.h / 35;
    for (var i = 0; i < o.count; i++) {
      var x0 = o.x + i * u, y0 = o.y;
      var R = function (a, b, c, d) { ctx.fillRect(x0 + a * sx, y0 + b * sy, c * sx, d * sy); };
      R(5, 2, 7, 33);           // tronco
      R(6, 0, 5, 2);            // cima arrotondata
      R(0, 14, 5, 5);           // braccio sx (orizzontale)
      R(0, 8, 3, 7);            // braccio sx (verticale)
      R(1, 6, 1, 2);
      R(12, 11, 5, 5);          // braccio dx (orizzontale)
      R(14, 5, 3, 7);           // braccio dx (verticale)
      R(15, 3, 1, 2);
      if (big) { ctx.fillRect(x0 + 8 * sx, y0 + 6 * sy, 1, 24 * sy); }
    }
  }

  function drawPtero(o) {
    ctx.fillStyle = fgColor();
    var x = o.x, y = o.y;
    ctx.fillRect(x + 14, y + 18, 26, 8);   // corpo
    ctx.fillRect(x + 40, y + 20, 6, 3);    // coda
    ctx.fillRect(x + 6, y + 14, 10, 7);    // testa
    ctx.fillRect(x, y + 16, 8, 3);         // becco
    ctx.fillRect(x + 12, y + 26, 14, 2);
    ctx.beginPath();
    if (o.frame) { // ala in basso
      ctx.moveTo(x + 18, y + 26); ctx.lineTo(x + 34, y + 26); ctx.lineTo(x + 30, y + 38); ctx.lineTo(x + 22, y + 34);
    } else {       // ala in alto
      ctx.moveTo(x + 18, y + 18); ctx.lineTo(x + 34, y + 18); ctx.lineTo(x + 30, y + 4); ctx.lineTo(x + 20, y + 8);
    }
    ctx.closePath(); ctx.fill();
  }

  function drawLogo() {
    if (!logoReady) return;
    var duck = L.ducking && !L.jumping;
    var w = duck ? 56 : SIZE, h = duck ? 26 : SIZE;
    var cx = L.x + 22 + (duck ? 4 : 0), cy = duck ? GROUND + 1 - h / 2 : L.y + SIZE / 2;
    ctx.save();
    if (st.crashed) { try { ctx.filter = 'grayscale(1)'; } catch (e) {} ctx.globalAlpha = .75; }
    ctx.translate(cx, cy);
    ctx.scale(w / SIZE, h / SIZE);
    ctx.rotate(L.angle);
    ctx.drawImage(logoC, -SIZE / 2, -SIZE / 2, SIZE, SIZE);
    ctx.restore();
    if (st.crashed) { // occhi a X sopra il logo
      ctx.strokeStyle = 'rgba(30,30,30,.85)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      [[-8, -3], [8, -3]].forEach(function (p) {
        var ex = L.x + 22 + p[0], ey = L.y + 22 + p[1];
        ctx.beginPath(); ctx.moveTo(ex - 3, ey - 3); ctx.lineTo(ex + 3, ey + 3);
        ctx.moveTo(ex + 3, ey - 3); ctx.lineTo(ex - 3, ey + 3); ctx.stroke();
      });
    }
  }

  function pad(n, len) { var s = String(n); while (s.length < len) s = '0' + s; return s; }

  function draw() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';

    // notte: luna e stelle
    if (night > 0.02) {
      var i, t = performance.now() / 700;
      ctx.save(); ctx.globalAlpha = night;
      for (i = 0; i < stars.length; i++) {
        var s = stars[i], a = .5 + .5 * Math.sin(t + s.p);
        ctx.fillStyle = fgColor(.4 + .5 * a);
        ctx.fillRect(s.x, s.y, 2, 2); ctx.fillRect(s.x - 2, s.y, 6, 1); ctx.fillRect(s.x, s.y - 2, 1, 6);
      }
      ctx.fillStyle = fgColor();
      ctx.beginPath(); ctx.arc(st.moonX, 30, 11, 0, Math.PI * 2); ctx.fill();
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath(); ctx.arc(st.moonX + 7, 28, 10, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    for (var c = 0; c < clouds.length; c++) drawCloud(clouds[c].x, clouds[c].y);

    // terreno
    ctx.fillStyle = fgColor();
    ctx.fillRect(0, GROUND, W, 1.2);
    for (var b = 0; b < bumps.length; b++) ctx.fillRect(bumps[b].x, bumps[b].y, bumps[b].w * 2, 1);

    for (var k = 0; k < obstacles.length; k++) {
      if (obstacles[k].name === 'ptero') drawPtero(obstacles[k]); else drawCactus(obstacles[k]);
    }
    drawLogo();

    // punteggio
    ctx.font = 'bold 13px "Courier New", Courier, monospace';
    ctx.textBaseline = 'top'; ctx.textAlign = 'right';
    var blinkOff = st.flashLeft > 0 && Math.floor(st.flash / 125) % 2 === 1;
    var txt = pad(st.flashLeft > 0 ? Math.floor(st.score / 100) * 100 : st.score, 5);
    if (!blinkOff) { ctx.fillStyle = fgColor(); ctx.fillText(txt, W - 8, 8); }
    if (hi > 0) { ctx.fillStyle = fgColor(.65); ctx.fillText('HI ' + pad(hi, 5), W - 8 - 13 * .6 * 5 - 18, 8); }

    if (st.crashed) {
      ctx.textAlign = 'center'; ctx.fillStyle = fgColor();
      ctx.font = 'bold 15px "Courier New", Courier, monospace';
      ctx.fillText('G A M E   O V E R', W / 2, 38);
      // icona "riprova"
      var rx = W / 2, ry = 82, r = 14;
      ctx.strokeStyle = fgColor(); ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(rx, ry, r, -Math.PI * .35, Math.PI * 1.55); ctx.stroke();
      ctx.fillStyle = fgColor();
      var ax = rx + r * Math.cos(-Math.PI * .35), ay = ry + r * Math.sin(-Math.PI * .35);
      ctx.beginPath(); ctx.moveTo(ax + 7, ay - 5); ctx.lineTo(ax + 3, ay + 8); ctx.lineTo(ax - 8, ay - 2); ctx.closePath(); ctx.fill();
    }
  }

  /* ---------- dimensioni e ciclo ---------- */
  function fit() {
    var cssW = canvas.getBoundingClientRect().width || W;
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssW * dpr * H / W);
    scale = canvas.width / W;
  }
  window.addEventListener('resize', fit);

  var last = 0;
  function frame(now) {
    var dt = last ? now - last : MS_FRAME;
    last = now;
    if (dt > 100) dt = MS_FRAME;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', function () { last = 0; });

  reset(); initScenery(); fit();
  canvas.focus();
  requestAnimationFrame(frame);

  /* aggancio per i test automatici */
  window.__dino = { state: function () { return { st: st, L: L, obstacles: obstacles }; }, press: press };
})();
</script>
</body>
</html>
