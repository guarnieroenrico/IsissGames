<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ISISS Matese — Logo Blaster MR</title>
<link rel="icon" type="image/png" href="../../assets/img/isiss-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="../../assets/js/ar-common.js"></script>
<script>
AFRAME.registerComponent('blaster-game', {
  init(){
    const T=AFRAME.THREE;
    this.T=T; this.root=new T.Group(); this.el.setObject3D('game',this.root);
    this.target=null; this.ring=null; this.running=false; this.countdown=false; this.ended=false;
    this.score=0; this.combo=0; this.shots=0; this.hits=0; this.timeLeft=60; this.startAt=0; this.lastShot=0;
    this.nextMove=0; this.vel=new T.Vector3(); this.goal=new T.Vector3(); this.tmp=new T.Vector3(); this.tmp2=new T.Vector3();
    this.beams=[]; this.fx=[]; this.blaster={left:null,right:null}; this.flash={left:0,right:0};
    this.msg=document.getElementById('msg'); this.hud=document.getElementById('hud'); this.timer=document.getElementById('timer');
    this.comboEl=document.getElementById('combo'); this.scoreEl=document.getElementById('score'); this.reticle=document.getElementById('reticle');
    this.overlay=document.getElementById('end'); this.endTitle=document.getElementById('endTitle'); this.endStats=document.getElementById('endStats');
    this.makeTarget(); this.makeBlasters();
    Arc.onStart(()=>this.begin()); Arc.onTrigger((ray,hand)=>this.shoot(ray,hand));
    ['left','right'].forEach(h=>document.getElementById(h==='left'?'lc':'rc').addEventListener('gripdown',()=>this.recenter()));
  },
  makeTarget(){
    const T=this.T, tex=new T.TextureLoader().load('../../assets/img/isiss-logo.png'); tex.colorSpace=T.SRGBColorSpace;
    this.target=new T.Mesh(new T.PlaneGeometry(.72,.72),new T.MeshBasicMaterial({map:tex,transparent:true,alphaTest:.04,side:T.DoubleSide}));
    this.target.visible=false; this.root.add(this.target);
    this.ring=new T.Mesh(new T.RingGeometry(.43,.455,64),new T.MeshBasicMaterial({color:0x22e7ff,transparent:true,opacity:.9,side:T.DoubleSide}));
    this.target.add(this.ring);
    const glow=new T.Mesh(new T.RingGeometry(.47,.49,64),new T.MeshBasicMaterial({color:0xff2bd6,transparent:true,opacity:.3,side:T.DoubleSide}));
    this.target.add(glow); this.glow=glow;
  },
  makeBlasters(){
    ['left','right'].forEach(hand=>{
      const el=document.getElementById(hand==='left'?'lc':'rc'), g=new this.T.Group();
      const body=new this.T.Mesh(new this.T.BoxGeometry(.075,.12,.28),new this.T.MeshStandardMaterial({color:0x17233d,metalness:.75,roughness:.24}));
      body.position.z=-.10; g.add(body);
      const top=new this.T.Mesh(new this.T.BoxGeometry(.10,.035,.17),new this.T.MeshStandardMaterial({color:0x39dfff,emissive:0x063d4c,emissiveIntensity:1.8,metalness:.4,roughness:.2}));
      top.position.set(0,.065,-.12); g.add(top);
      const grip=new this.T.Mesh(new this.T.BoxGeometry(.06,.14,.075),new this.T.MeshStandardMaterial({color:0x303b59,metalness:.5,roughness:.35}));
      grip.position.set(0,-.08,.0); grip.rotation.x=-.22; g.add(grip);
      const muzzle=new this.T.Mesh(new this.T.CylinderGeometry(.028,.035,.018,20),new this.T.MeshBasicMaterial({color:0x7fffff}));
      muzzle.rotation.x=Math.PI/2; muzzle.position.z=-.255; g.add(muzzle);
      const light=new this.T.PointLight(0x35eaff,0,1.2); light.position.z=-.25; g.add(light);
      const dot=new this.T.Mesh(new this.T.SphereGeometry(.012,12,12),new this.T.MeshBasicMaterial({color:0xffffff})); dot.position.z=-.27; g.add(dot);
      el.object3D.add(g); this.blaster[hand]={g,light};
    });
  },
  head(){return Arc.inXR?Arc.headLocal():new this.T.Vector3(0,1.6,0)},
  recenter(){if(Arc.inXR)Arc.recenter(); this.placeTarget(true)},
  begin(){
    if(this.countdown)return; this.countdown=true; this.ended=false; this.overlay.style.display='none';
    this.score=0;this.combo=0;this.shots=0;this.hits=0;this.timeLeft=60;this.running=false;
    this.hud.style.display='block';this.reticle.style.display='block';this.updateHUD();
    this.countdownFX();
  },
  async countdownFX(){
    const seq=['3','2','1','VIA!'];
    for(const s of seq){this.popup(s, s==='VIA!'?'#57ff9b':'#ffffff',s==='VIA!'?1.35:1.0); this.sound(s==='VIA!'?'go':'count'); await new Promise(r=>setTimeout(r,s==='VIA!'?650:700));}
    this.countdown=false;this.running=true;this.startAt=performance.now();this.placeTarget(true);this.say('COLPISCI IL LOGO!',900);this.sound('start');
  },
  placeTarget(first=false){
    const h=this.head(), a=Math.random()*Math.PI*2, r=first?1.55:(1.2+Math.random()*1.45);
    const y=.95+Math.random()*1.0;
    this.target.position.set(h.x+Math.sin(a)*r,y,h.z+Math.cos(a)*r);
    this.goal.copy(this.target.position); this.goal.y=.9+Math.random()*1.05;
    this.vel.set(0,0,0); this.nextMove=performance.now()+700+Math.random()*900;
    this.target.visible=true; this.target.scale.setScalar(.01); this.popScale=0;
  },
  chooseGoal(){
    const h=this.head(), a=Math.random()*Math.PI*2, r=1.0+Math.random()*2.0;
    this.goal.set(h.x+Math.sin(a)*r,.8+Math.random()*1.2,h.z+Math.cos(a)*r);
    this.nextMove=performance.now()+850+Math.random()*1200;
  },
  say(t,ms=700){this.msg.setAttribute('value',t);this.msg.setAttribute('animation__in','property:scale;from:0.4 0.4 0.4;to:1 1 1;dur:160;easing:easeOutBack');clearTimeout(this.sayTimer);this.sayTimer=setTimeout(()=>this.msg.setAttribute('value',''),ms)},
  popup(text,color='#fff',scale=1){
    this.msg.setAttribute('value',text);this.msg.setAttribute('color',color);this.msg.setAttribute('scale',`${scale} ${scale} ${scale}`);
    this.msg.setAttribute('animation__pop','property:scale;from:0.15 0.15 0.15;to:'+scale+' '+scale+' '+scale+';dur:180;easing:easeOutBack');
    clearTimeout(this.sayTimer);this.sayTimer=setTimeout(()=>this.msg.setAttribute('value',''),600);
  },
  updateHUD(){
    const acc=this.shots?Math.round(this.hits/this.shots*100):100;
    this.scoreEl.setAttribute('value',String(this.score).padStart(5,'0'));
    this.timer.setAttribute('value',Math.max(0,Math.ceil(this.timeLeft)).toString());
    this.comboEl.setAttribute('value',this.combo>1?`COMBO x${Math.min(this.combo,5)}`:'');
    this.hud.setAttribute('value',`PUNTI  ${this.score}    •    PRECISIONE ${acc}%`);
  },
  shoot(ray,hand){
    if(!this.running||!this.target.visible)return;
    const now=performance.now();if(now-this.lastShot<105)return;this.lastShot=now;this.shots++;
    const o=ray.origin.clone(),d=ray.dir.clone().normalize(),center=this.target.getWorldPosition(this.tmp),to=center.clone().sub(o),t=to.dot(d),closest=o.clone().addScaledVector(d,Math.max(0,t)),dist=closest.distanceTo(center),hit=t>0&&t<15&&dist<.43;
    const end=o.clone().addScaledVector(d,hit?t:8);this.beam(o,end,hand,hit);this.recoil(hand);
    if(hit){
      this.hits++;this.combo++;const pts=100*Math.min(this.combo,5);this.score+=pts;
      this.say(`+${pts}  CENTRO!`,this.combo>=3?'#57ff9b':'#fff',.95+Math.min(this.combo,5)*.06);this.sound('hit');Arc.haptic(hand,.9,65);
      this.explode(center); this.flash[hand]=1; this.target.scale.setScalar(1.35); this.vel.multiplyScalar(.25);
      this.chooseGoal(); // il logo scappa automaticamente dopo ogni centro
    }else{this.combo=0;this.say('MISS!', '#ff6b7d',.75);this.sound('miss');}
    this.updateHUD();
  },
  recoil(hand){const b=this.blaster[hand];if(!b)return;b.g.position.z=.045;b.light.intensity=3;clearTimeout(b.t);b.t=setTimeout(()=>{b.g.position.z=0;b.light.intensity=0},85)},
  beam(a,b,hand,hit){const T=this.T,len=a.distanceTo(b),m=new T.Mesh(new T.CylinderGeometry(hit?.018:.009,hit?.018:.009,len,10),new T.MeshBasicMaterial({color:hit?0x7dffea:0xff365e,transparent:true,opacity:.95}));m.position.copy(a).lerp(b,.5);m.lookAt(b);this.root.add(m);this.beams.push({m,life:.12});
    if(hit){const s=new T.Mesh(new T.SphereGeometry(.035,12,12),new T.MeshBasicMaterial({color:0xffffff}));s.position.copy(b);this.root.add(s);this.beams.push({m:s,life:.16,scale:true})}
  },
  explode(p){for(let i=0;i<18;i++){const T=this.T,s=new T.Mesh(new T.SphereGeometry(.018+Math.random()*.025,8,8),new T.MeshBasicMaterial({color:i%2?0x25e7ff:0xff3ed1,transparent:true}));s.position.copy(p);const v=new T.Vector3(Math.random()-.5,Math.random()-.2,Math.random()-.5).normalize().multiplyScalar(.7+Math.random()*1.2);this.root.add(s);this.fx.push({m:s,v,life:.45})}},
  sound(type){try{if(!Arc.beep)return;if(type==='hit'){Arc.beep(480,.06,'square',.08,1100);setTimeout(()=>Arc.beep(1250,.12,'sine',.06,1700),35)}else if(type==='miss')Arc.beep(120,.09,'sawtooth',.035,70);else if(type==='count')Arc.beep(500,.09,'sine',.05,700);else if(type==='go'){Arc.beep(700,.1,'square',.06,1100);setTimeout(()=>Arc.beep(1100,.14,'square',.06,1600),80)}else if(type==='start')Arc.beep(330,.18,'sine',.05,880)}catch(e){}},
  finish(){if(this.ended)return;this.ended=true;this.running=false;const acc=this.shots?Math.round(this.hits/this.shots*100):0;this.endTitle.setAttribute('value','TEMPO SCADUTO!');this.endStats.setAttribute('value',`PUNTI  ${this.score}\nCENTRI  ${this.hits}/${this.shots}   •   PRECISIONE ${acc}%\nCOMBO MAX  x${Math.min(this.combo,5)}`);this.overlay.style.display='flex';this.say('FINE!', '#ffcf4a',1.2);this.sound('go')},
  tick(time,dtms){
    const dt=Math.min(dtms/1000,.05); if(this.running){this.timeLeft=Math.max(0,60-(performance.now()-this.startAt)/1000);this.updateHUD();if(this.timeLeft<=0){this.finish();return}}
    if(!this.target)return;
    if(this.running){const now=performance.now(),h=this.head();if(now>this.nextMove)this.chooseGoal();
      this.tmp.copy(this.goal).sub(this.target.position);const dist=this.tmp.length();if(dist>.02){this.tmp.normalize();this.vel.lerp(this.tmp.multiplyScalar(.8),1-Math.exp(-dt*3.2));this.target.position.addScaledVector(this.vel,dt)}
      if(this.target.position.distanceTo(h)>3.8)this.chooseGoal();
      this.target.lookAt(h.x,this.target.position.y,h.z);this.ring.rotation.z+=dt*2.8;this.glow.rotation.z-=dt*1.5;
      const pulse=1+Math.sin(time/90)*.035;this.target.scale.lerp(this.tmp2.set(pulse,pulse,pulse),Math.min(1,dt*10));
    }
    ['left','right'].forEach(h=>{if(this.flash[h]>0)this.flash[h]-=dt;if(this.flash[h]<=0){const b=this.blaster[h];if(b)b.light.intensity=0}});
    this.beams=this.beams.filter(x=>{x.life-=dt;x.m.material.opacity=Math.max(0,x.life/.16);if(x.life<=0){this.root.remove(x.m);x.m.geometry.dispose();x.m.material.dispose();return false}return true});
    this.fx=this.fx.filter(x=>{x.life-=dt;x.m.position.addScaledVector(x.v,dt);x.v.y-=1.5*dt;x.m.scale.setScalar(Math.max(.01,x.life/.45));x.m.material.opacity=Math.max(0,x.life/.45);if(x.life<=0){this.root.remove(x.m);x.m.geometry.dispose();x.m.material.dispose();return false}return true});
  }
});
</script>
</head>
<body>
<a-scene webxr="referenceSpaceType: local-floor; optionalFeatures: hit-test, bounded-floor, plane-detection" xr-mode-ui="enabled:false" background="transparent:true" renderer="alpha:true;antialias:true" loading-screen="enabled:false">
  <a-entity id="rig">
    <a-entity id="cam" camera look-controls="touchEnabled:false" position="0 1.6 0">
      <a-text id="hud" value="" align="center" width="1.5" color="#d8fbff" position="0 0.34 -1.05"></a-text>
      <a-text id="score" value="00000" align="center" width="1.0" color="#ffffff" position="-.62 .48 -1.02"></a-text>
      <a-text id="timer" value="60" align="center" width=".55" color="#57ff9b" position=".62 .48 -1.02"></a-text>
      <a-text id="combo" value="" align="center" width="1.0" color="#ffcf4a" position="0 .58 -1.02"></a-text>
      <a-ring id="reticle" radius-inner=".008" radius-outer=".014" color="#57ffea" position="0 0 -1.0" visible="false"></a-ring>
    </a-entity>
    <a-entity id="lc" laser-controls="hand:left" raycaster="far:15;objects:.clickable"></a-entity>
    <a-entity id="rc" laser-controls="hand:right" raycaster="far:15;objects:.clickable"></a-entity>
  </a-entity>
  <a-entity arc-world id="world">
    <a-entity light="type:ambient;intensity:.85;color:#ffffff"></a-entity>
    <a-text id="msg" value="" align="center" width="3.2" color="#ffffff" position="0 1.75 -1.8"></a-text>
    <a-entity blaster-game></a-entity>
  </a-entity>
  </a-scene>
<div id="end" style="display:none;position:fixed;inset:0;z-index:30;align-items:center;justify-content:center;pointer-events:none;font-family:Manrope,sans-serif;color:white;text-align:center">
  <div style="padding:28px 36px;border:1px solid rgba(87,255,234,.45);border-radius:26px;background:rgba(5,13,30,.82);box-shadow:0 0 50px rgba(0,220,255,.2);backdrop-filter:blur(12px);min-width:300px">
    <div style="font-size:12px;letter-spacing:.25em;color:#57ffea;font-weight:800">ISISS MATESE • BLASTER</div>
    <div id="endTitle" style="font-size:34px;font-weight:800;margin:10px 0">TEMPO SCADUTO!</div>
    <div id="endStats" style="font-size:18px;line-height:1.7;color:#d7e9ff;white-space:pre-line"></div>
    <div style="margin-top:18px;font-size:13px;color:#8ba7c9">Premi il pulsante per rientrare nell'esperienza.</div>
  </div>
</div>
<script>
// collega il pannello finale senza interferire con la scena WebXR
window.addEventListener('load',()=>{
  const original=document.getElementById('end');
  // A-Frame non deve usare un secondo elemento con lo stesso id: il pannello DOM è quello effettivo.
});
</script>
</body>
</html>
