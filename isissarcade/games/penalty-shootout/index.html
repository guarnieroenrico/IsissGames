<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D Penalty Shootout - ISISS MATESE Edition</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#050914;font-family:'Inter',system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;color:#fff}
canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}
#vignette{position:absolute;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse at center,transparent 60%,rgba(60,25,0,.35) 100%)}
#ui{position:absolute;inset:0;z-index:10;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:14px}
.glass{background:linear-gradient(135deg,rgba(15,23,42,.8),rgba(2,6,23,.9));backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);box-shadow:0 10px 30px rgba(0,0,0,.5);border-radius:16px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#hud{padding:10px 18px;pointer-events:auto}
#hud h1{margin:0 0 4px;font-size:clamp(13px,2.4vw,20px);font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#4ade80;text-shadow:0 0 10px rgba(74,222,128,.6)}
.sc{display:flex;gap:16px;font-weight:700;font-size:clamp(11px,1.8vw,15px);color:#cbd5e1}
.sc b{font-size:1.25em;color:#fff}.sc .m{color:#f87171}.sc .s{color:#facc15}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:auto}
button{font-family:inherit;cursor:pointer;font-weight:900;transition:transform .15s}
button:active{transform:scale(.95)}
#restart{background:#dc2626;color:#fff;border:1px solid rgba(248,113,113,.6);border-radius:12px;padding:9px 16px;font-size:13px;box-shadow:0 0 15px rgba(220,38,38,.45)}
.hint{padding:8px 12px;font-size:11px;color:#cbd5e1;text-align:right;line-height:1.5}
@media(max-width:640px){.hint{display:none}}
#msg{position:absolute;top:44%;left:0;width:100%;text-align:center;padding:0 16px;display:none}
#msgt{margin:0;font-weight:900;font-style:italic;text-transform:uppercase;font-size:clamp(46px,12vw,110px);text-shadow:0 10px 25px #000;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
#msgt.long{font-size:clamp(26px,6.5vw,64px)}
#msgt.ok{background:linear-gradient(135deg,#4ade80,#059669);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 14px #000)}
#msgt.bad{color:#ef4444}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.bot{display:flex;flex-direction:column;align-items:center;gap:10px;padding-bottom:6px}
#cuc{pointer-events:auto;background:linear-gradient(#facc15,#ca8a04);color:#000;border:2px solid #fde68a;border-radius:99px;padding:10px 24px;font-size:13px;display:flex;gap:8px;align-items:center;box-shadow:0 0 20px rgba(250,204,21,.6)}
#cuc.on{outline:4px solid #fde047}
#cs{background:rgba(0,0,0,.8);color:#fde047;font-size:11px;padding:2px 10px;border-radius:99px}
#cuc.on #cs{background:#facc15;color:#000}
#ins{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(11px,1.6vw,14px);text-shadow:0 2px 4px #000}
#pb{width:min(320px,70vw);height:22px;background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.85);border-radius:12px;overflow:hidden;box-shadow:0 4px 20px #000}
#pf{width:0;height:100%;background:linear-gradient(90deg,#10b981,#facc15,#ef4444);box-shadow:0 0 15px rgba(250,204,21,.5)}
#crosshair{position:absolute;width:40px;height:40px;border:2px solid rgba(255,255,255,.85);border-radius:50%;transform:translate(-50%,-50%);top:50%;left:50%;pointer-events:none;display:flex;align-items:center;justify-content:center;box-shadow:0 0 15px rgba(0,255,128,.45);z-index:20}
#crosshair::before{content:'';width:6px;height:6px;background:#22c55e;border-radius:50%;box-shadow:0 0 10px #22c55e}
</style>
</head>
<body>
<div id="vignette"></div>
<div id="ui">
  <div class="top">
    <div id="hud" class="glass"><h1>ISISS MATESE Shootout</h1>
      <div class="sc"><div>Goals: <b id="g">0</b></div><div>Misses: <b class="m" id="m">0</b></div><div>Streak: <b class="s" id="s">0</b></div></div></div>
    <div class="right"><button id="restart" type="button">🔄 RESTART</button>
      <div class="glass hint"><div>🎯 Drag / Mouse to Aim</div><div>⚡ Hold to Power Up</div><div>🥄 SHIFT for Cucchiaio</div></div></div>
  </div>
  <div id="msg"><h2 id="msgt">GOAL!</h2></div>
  <div class="bot">
    <button id="cuc" type="button"><span>CUCCHIAIO 🥄</span><span id="cs">OFF</span></button>
    <div id="ins">Hold to power up shot</div>
    <div id="pb"><div id="pf"></div></div>
  </div>
</div>
<div id="crosshair"></div>
<script>
/* ---------- AUDIO ---------- */
const sfx={ctx:null,
 init(){if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume();},
 tone(f,d,type,vol,f2){this.init();const c=this.ctx,t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d);},
 kick(chip){this.tone(chip?140:100,chip?.15:.25,chip?'sine':'triangle',1,20);},
 post(){this.tone(720,.8,'sine',.5);this.tone(1350,.8,'sine',.4);},
 goal(){this.init();const c=this.ctx,t=c.currentTime,n=c.sampleRate*1.8,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(1100,t+1.4);const g=c.createGain();g.gain.setValueAtTime(.05,t);g.gain.linearRampToValueAtTime(.7,t+.35);g.gain.exponentialRampToValueAtTime(.01,t+1.8);s.connect(f);f.connect(g);g.connect(c.destination);s.start(t);},
 save(){this.tone(220,.3,'square',.25,110);}};

/* ---------- COSTANTI & STATO ---------- */
const R=.43,GW=15.6,GH=5.8,GD=4,GZ=-16,PR=.22,GRAV=14,K=1.8,BS=new THREE.Vector3(0,R,8);
const V3=(x,y,z)=>new THREE.Vector3(x,y,z),$=id=>document.getElementById(id),cross=$('crosshair');
const st={goals:0,miss:0,streak:0,aiming:true,charging:false,power:0,dir:1,shot:false,vel:V3(0,0,0),spin:V3(0,0,0),target:V3(0,GH/2,GZ),chip:false,toggle:false,shift:false,done:false,inNet:false};
let scene,camera,renderer,clock,ball,gk,led,flashes=[],confetti=[],shake=0;
const camBase=V3(0,3.8,18.5),mouse=new THREE.Vector2(),ray=new THREE.Raycaster();
const posts=[[V3(-GW/2,0,GZ),V3(-GW/2,GH,GZ)],[V3(GW/2,0,GZ),V3(GW/2,GH,GZ)],[V3(-GW/2,GH,GZ),V3(GW/2,GH,GZ)]];
const std=(c,r=.7,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
function tex(w,h,fn,rep){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}return t;}
const add=(m,x,y,z)=>{m.position.set(x,y,z);scene.add(m);return m;};

/* ---------- INIT ---------- */
function init(){
 clock=new THREE.Clock();scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0xe8c9a0,.0045);
 camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,.1,1000);camera.position.copy(camBase);camera.lookAt(0,2.5,GZ);
 renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
 renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
 document.body.appendChild(renderer.domElement);
 lights();stadium();goal();makeBall();gk=makeGoalie();events();animate();
}

function lights(){
 scene.add(new THREE.HemisphereLight(0xbcd8ff,0x4a6a2a,.8));
 const sun=new THREE.DirectionalLight(0xffd9a0,1.7);sun.position.set(28,26,22);sun.castShadow=true;
 sun.shadow.mapSize.set(2048,2048);const c=sun.shadow.camera;c.left=-30;c.right=30;c.top=30;c.bottom=-30;c.near=5;c.far=120;sun.shadow.bias=-.0003;scene.add(sun);
 const fill=new THREE.DirectionalLight(0xaecbff,.35);fill.position.set(-30,20,25);scene.add(fill);
}

/* ---------- AMBIENTAZIONE: CAMPO DI PAESE TRA LE MONTAGNE DEL MATESE AL TRAMONTO ---------- */
let crowd=[];
const rnd=(a,b)=>a+Math.random()*(b-a);
function stadium(){
 // cielo dorato con sole e nuvole
 const sky=tex(1024,512,(x,w,h)=>{
  const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#2f6fb8');g.addColorStop(.3,'#6fa8dc');g.addColorStop(.5,'#ffd9a8');g.addColorStop(1,'#ffb877');x.fillStyle=g;x.fillRect(0,0,w,h);
  const sg=x.createRadialGradient(790,205,0,790,205,170);sg.addColorStop(0,'rgba(255,252,225,1)');sg.addColorStop(.1,'rgba(255,240,190,.95)');sg.addColorStop(.3,'rgba(255,200,120,.35)');sg.addColorStop(1,'rgba(255,200,120,0)');x.fillStyle=sg;x.fillRect(0,0,w,h);
  for(let i=0;i<26;i++){const cx=rnd(0,w),cy=rnd(70,200);for(let k=0;k<9;k++){x.fillStyle='rgba(255,236,215,'+rnd(.08,.22)+')';x.beginPath();x.ellipse(cx+rnd(-60,60),cy+rnd(-8,8),rnd(30,80),rnd(8,18),0,0,6.3);x.fill();}}});
 scene.add(new THREE.Mesh(new THREE.SphereGeometry(300,32,16),new THREE.MeshBasicMaterial({map:sky,side:THREE.BackSide,fog:false})));
 // montagne a strati con foschia
 const ridge=(z,col,hMax,sd)=>{const sh=new THREE.Shape();sh.moveTo(-420,-5);for(let i=0;i<=84;i++){const x=-420+i*10;sh.lineTo(x,hMax*(.45+.3*Math.sin(x*.011+sd)+.2*Math.sin(x*.027+sd*2)+.08*Math.sin(x*.07+sd*3)));}sh.lineTo(420,-5);sh.closePath();add(new THREE.Mesh(new THREE.ShapeGeometry(sh),new THREE.MeshBasicMaterial({color:col})),0,0,z);};
 ridge(-260,0x7f9bbf,95,1);ridge(-200,0x5f7f9f,70,4);ridge(-150,0x3f6a5a,48,7);
 // prato e lago
 const mt=tex(512,512,(x,w,h)=>{x.fillStyle='#5c8a3a';x.fillRect(0,0,w,h);for(let i=0;i<9000;i++){x.fillStyle='rgba('+(60+Math.random()*50|0)+','+(100+Math.random()*60|0)+',40,.35)';x.fillRect(Math.random()*w,Math.random()*h,3,3);}for(let i=0;i<300;i++){x.fillStyle=['#f5e04a','#ffffff','#e86a9a'][i%3];x.fillRect(Math.random()*w,Math.random()*h,2,2);}},[60,60]);
 const mead=new THREE.Mesh(new THREE.PlaneGeometry(900,900),new THREE.MeshStandardMaterial({map:mt,roughness:1}));mead.rotation.x=-Math.PI/2;mead.position.y=-.05;mead.receiveShadow=true;scene.add(mead);
 const lake=new THREE.Mesh(new THREE.PlaneGeometry(600,50),new THREE.MeshStandardMaterial({color:0x4a90b8,emissive:0x2a5a80,metalness:.6,roughness:.15}));lake.rotation.x=-Math.PI/2;add(lake,0,-.02,-108);
 // campo a strisce e linee
 const pt=tex(1024,1024,(x,w,h)=>{for(let y=0;y<h;y+=102){x.fillStyle=(y/102|0)%2?'#43902f':'#4fa03c';x.fillRect(0,y,w,102);}for(let i=0;i<120000;i++){const g=Math.random()*40|0;x.fillStyle='rgba('+g+','+(80+Math.random()*70|0)+','+g+',.18)';x.fillRect(Math.random()*w,Math.random()*h,1.5,3);}});
 pt.anisotropy=8;
 const pitch=new THREE.Mesh(new THREE.PlaneGeometry(64,50),new THREE.MeshStandardMaterial({map:pt,roughness:.9}));pitch.rotation.x=-Math.PI/2;pitch.receiveShadow=true;add(pitch,0,0,-5);
 const lm=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.92});
 const line=(x,z,w,d)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),lm);m.rotation.x=-Math.PI/2;add(m,x,.03,z);};
 line(0,GZ,64,.28);line(0,GZ+11.7,39,.28);line(-19.5,GZ+5.85,.28,11.7);line(19.5,GZ+5.85,.28,11.7);
 line(0,GZ+35.1,64,.28);line(-31.8,GZ+17.55,.28,35.1);line(31.8,GZ+17.55,.28,35.1);
 const sp=new THREE.Mesh(new THREE.CircleGeometry(.25,32),lm);sp.rotation.x=-Math.PI/2;add(sp,0,.04,BS.z);
 // recinto in legno
 const wood=std(0x8a5a2b,.9);
 const post=(x,z)=>{const m=add(new THREE.Mesh(new THREE.BoxGeometry(.18,1.3,.18),wood),x,.65,z);m.castShadow=true;};
 for(let x=-32;x<=32;x+=4)post(x,-30);
 for(let z=-30;z<=16;z+=4){post(-32,z);post(32,z);}
 [.5,1.05].forEach(y=>{add(new THREE.Mesh(new THREE.BoxGeometry(64,.1,.1),wood),0,y,-30);[-32,32].forEach(x=>add(new THREE.Mesh(new THREE.BoxGeometry(.1,.1,46),wood),x,y,-7));});
 // striscioni e bandierine
 const banner=(t,bg,x)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(14,1.8),new THREE.MeshStandardMaterial({map:tex(512,64,(c,w,h)=>{c.fillStyle=bg;c.fillRect(0,0,w,h);c.strokeStyle='#fff';c.lineWidth=4;c.strokeRect(4,4,w-8,h-8);c.fillStyle='#fff';c.font='900 34px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(t,w/2,h/2+2);}),roughness:.9}));add(m,x,1.75,-29.85);};
 banner('⚽ ISISS MATESE','#0f766e',0);banner('ITI • IPSEOA • ITA','#1d4ed8',-15);banner('PENALTY SHOOTOUT','#b45309',15);
 [-32,32].forEach(x=>add(new THREE.Mesh(new THREE.CylinderGeometry(.1,.12,5,8),wood),x,2.5,-30));
 const pc=[0xef4444,0xfacc15,0x38bdf8,0xffffff,0x10b981];
 for(let i=0;i<=24;i++){const f=add(new THREE.Mesh(new THREE.CircleGeometry(.5,3),new THREE.MeshBasicMaterial({color:pc[i%5],side:THREE.DoubleSide})),-32+i*2.667,4.5-1.1*Math.sin(i/24*Math.PI),-29.6);f.rotation.z=-Math.PI/2;}
 // spettatori del paese
 const skins=[0xffcba4,0xe0ac82,0xc68863,0xf1c27d],cols=[0xdc2626,0x2563eb,0xf59e0b,0x10b981,0xffffff,0x7c3aed,0xec4899];
 const person=(x,z)=>{const g=new THREE.Group(),c=cols[Math.random()*7|0];
  const l=new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,.75,8),std(0x1e293b,.9));l.position.y=.4;g.add(l);
  const b=new THREE.Mesh(new THREE.CylinderGeometry(.2,.27,.85,10),std(c,.8));b.position.y=1.15;g.add(b);
  const hd=new THREE.Mesh(new THREE.SphereGeometry(.17,10,10),std(skins[Math.random()*4|0],.6));hd.position.y=1.75;g.add(hd);
  g.position.set(x,0,z);scene.add(g);crowd.push({g,ph:Math.random()*6.3});};
 for(let x=-30;x<=30;x+=rnd(1.4,2.6))person(x,-32+rnd(-.4,.6));
 for(let z=-26;z<=14;z+=rnd(2,3.4)){person(-34,z);person(34,z);}
 // pini
 const pineM=std(0x1f5a32,.9),trunkM=std(0x5a3a1e,.9);
 const tree=(x,z,sc)=>{add(new THREE.Mesh(new THREE.CylinderGeometry(.25*sc,.35*sc,2*sc,6),trunkM),x,sc,z);for(let k=0;k<3;k++){const c=add(new THREE.Mesh(new THREE.ConeGeometry((2.2-k*.55)*sc,3*sc,8),pineM),x,(2.6+k*1.7)*sc,z);c.castShadow=true;}};
 for(let i=0;i<90;i++)tree((Math.random()<.5?-1:1)*rnd(38,110),rnd(-70,25),rnd(1.4,2.6));
 for(let i=0;i<40;i++)tree(rnd(-110,110),rnd(-68,-45),rnd(1.6,3));
 // borgo con tetti in cotto e campanile
 const walls=[0xe6d3b3,0xd9b99b,0xcfa98a,0xefe1c8];
 for(let i=0;i<16;i++){const w=rnd(5,9),h=rnd(4,8),d=rnd(5,8),x=-80+i*10+rnd(-3,3),z=rnd(-95,-72);
  const b=add(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),std(walls[i%4],.9)),x,h/2,z);b.castShadow=true;
  const r=add(new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*.78,2.6,4),std(0xb4552d,.8)),x,h+1.3,z);r.rotation.y=Math.PI/4;
  [-1.6,1.6].forEach(o=>add(new THREE.Mesh(new THREE.PlaneGeometry(.9,1.3),new THREE.MeshBasicMaterial({color:0xffcc66})),x+o,h*.55,z+d/2+.02));}
 add(new THREE.Mesh(new THREE.BoxGeometry(3,18,3),std(0xe6d3b3,.9)),-20,9,-99);add(new THREE.Mesh(new THREE.ConeGeometry(2.6,5,4),std(0xb4552d,.8)),-20,20.5,-99).rotation.y=Math.PI/4;
}

/* ---------- PORTA ---------- */
function goal(){
 const pm=new THREE.MeshPhysicalMaterial({color:0xffffff,metalness:.6,roughness:.2,clearcoat:1});
 const pg=new THREE.CylinderGeometry(PR,PR,GH,24);
 [-1,1].forEach(s=>{const p=add(new THREE.Mesh(pg,pm),s*GW/2,GH/2,GZ);p.castShadow=true;add(new THREE.Mesh(new THREE.SphereGeometry(PR,16,16),pm),s*GW/2,GH,GZ);});
 const bar=add(new THREE.Mesh(new THREE.CylinderGeometry(PR,PR,GW,24),pm),0,GH,GZ);bar.rotation.z=Math.PI/2;bar.castShadow=true;
 const nt=tex(64,64,x=>{x.strokeStyle='rgba(255,255,255,.85)';x.lineWidth=3;x.beginPath();x.moveTo(32,0);x.lineTo(64,32);x.lineTo(32,64);x.lineTo(0,32);x.closePath();x.stroke();},[30,15]);
 const nm=new THREE.MeshStandardMaterial({map:nt,transparent:true,alphaTest:.2,side:THREE.DoubleSide,roughness:.8});
 const bg=new THREE.PlaneGeometry(GW,GH,16,8),pos=bg.attributes.position;
 for(let i=0;i<pos.count;i++)pos.setZ(i,-GD+Math.sin((pos.getX(i)/GW+.5)*Math.PI)*Math.sin((pos.getY(i)/GH+.5)*Math.PI)*1.5);
 add(new THREE.Mesh(bg,nm),0,GH/2,GZ);
 const t=add(new THREE.Mesh(new THREE.PlaneGeometry(GW,GD),nm),0,GH,GZ-GD/2);t.rotation.x=Math.PI/2;
 [-1,1].forEach(s=>{const n=add(new THREE.Mesh(new THREE.PlaneGeometry(GD,GH),nm),s*GW/2,GH/2,GZ-GD/2);n.rotation.y=Math.PI/2;
  const L=Math.hypot(GD,GH),b=add(new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,L,10),std(0x222831,.5,.5)),s*GW/2,GH/2,GZ-GD/2);b.rotation.x=Math.atan2(GD,GH);});
}

/* ---------- PALLONE ---------- */
function makeBall(){
 const bt=tex(1024,512,(x,w,h)=>{x.fillStyle='#fafafa';x.fillRect(0,0,w,h);
  const cl=['#f97316','#84cc16','#0ea5e9','#c2187f','#14b8a6'],lb=['ITI','','ITA','IPSEOA',''];
  for(let r=0;r<2;r++)for(let i=0;i<8;i++){const cx=i*128+(r?64:0)+64,cy=r?400:112;x.fillStyle=cl[(i+r*2)%5];x.beginPath();x.moveTo(cx-52,cy-38);x.lineTo(cx+8,cy-38);x.lineTo(cx+52,cy);x.lineTo(cx+8,cy+38);x.lineTo(cx-52,cy+38);x.lineTo(cx-8,cy);x.closePath();x.fill();x.fillStyle='#fff';x.font='900 20px sans-serif';x.textAlign='center';x.fillText(lb[(i+r)%5],cx-8,cy+7);}
  [256,768].forEach(ox=>{x.fillStyle='#fff';x.beginPath();x.arc(ox,256,78,0,6.3);x.fill();x.strokeStyle='#e2e8f0';x.lineWidth=3;x.stroke();x.fillStyle='#14625c';x.font='900 30px sans-serif';x.textAlign='center';x.fillText('ISISS',ox,250);x.fillText('MATESE',ox,284);cl.forEach((c,k)=>{x.fillStyle=c;x.beginPath();x.arc(ox-40+k*20,302,5,0,6.3);x.fill();});});});
 ball=new THREE.Mesh(new THREE.SphereGeometry(R,40,40),new THREE.MeshPhysicalMaterial({map:bt,roughness:.35,clearcoat:.3}));
 ball.castShadow=true;ball.position.copy(BS);scene.add(ball);
}

/* ---------- PORTIERE ---------- */
function limb(len,rt,rb,m){const g=new THREE.Group(),S=K;
 const c=new THREE.Mesh(new THREE.CylinderGeometry(rt*S,rb*S,len*S,16),m);c.position.y=-len*S/2;g.add(c);
 g.add(new THREE.Mesh(new THREE.SphereGeometry(rt*S,16,12),m));
 const b=new THREE.Mesh(new THREE.SphereGeometry(rb*S,16,12),m);b.position.y=-len*S;g.add(b);return g;}
function makeGoalie(){
 const S=K,root=new THREE.Group();root.position.set(0,0,GZ+.5);
 const shirtT=tex(256,256,(x,w,h)=>{x.fillStyle='#1f5f5b';x.fillRect(0,0,w,h);
  x.fillStyle='#c2187f';x.fillRect(52,0,26,h);x.fillRect(178,0,26,h);
  x.fillStyle='#f97316';x.fillRect(48,0,4,h);x.fillRect(78,0,4,h);x.fillRect(174,0,4,h);x.fillRect(204,0,4,h);
  x.fillStyle='#d9f99d';x.textAlign='center';x.textBaseline='middle';
  [0,256].forEach(ox=>{x.font='900 28px sans-serif';x.fillText('ISISS',ox,120);x.fillText('MATESE',ox,152);x.font='900 20px sans-serif';x.fillText('ITI',ox-30,64);
   x.fillStyle='#fff';x.beginPath();x.arc(ox+30,66,15,0,6.3);x.fill();x.fillStyle='#f97316';x.beginPath();x.arc(ox+26,62,6,0,6.3);x.fill();x.fillStyle='#0ea5e9';x.beginPath();x.arc(ox+35,71,5,0,6.3);x.fill();x.fillStyle='#d9f99d';});
  x.fillStyle='#fff';x.font='900 120px sans-serif';x.fillText('1',128,150);x.font='700 24px sans-serif';x.fillText('MATESE',128,60);});
 const shirt=new THREE.MeshStandardMaterial({map:shirtT,roughness:.65}),sleeve=std(0x1f5f5b,.65),magenta=std(0xc2187f,.55),skin=std(0xffcba4,.5),shorts=std(0xb5d62a,.75),sock=std(0x1f5f5b,.6),shoe=std(0x164e4a,.3),glove=std(0xd61f8c,.25),hairM=std(0x1a1a1a,.9),dark=new THREE.MeshBasicMaterial({color:0x111111});
 const pelvis=new THREE.Group();root.add(pelvis);
 const hb=new THREE.Mesh(new THREE.CylinderGeometry(.2*S,.2*S,.42*S,16),shorts);hb.rotation.z=Math.PI/2;pelvis.add(hb);
 const torso=new THREE.Group();torso.position.y=.1*S;pelvis.add(torso);
 const chest=new THREE.Mesh(new THREE.CylinderGeometry(.38*S,.28*S,.75*S,20),shirt);chest.position.y=.37*S;torso.add(chest);
 const neck=new THREE.Mesh(new THREE.CylinderGeometry(.09*S,.12*S,.12*S,12),skin);neck.position.y=.78*S;torso.add(neck);
 const head=new THREE.Group();head.position.y=.88*S;torso.add(head);
 const hd=new THREE.Mesh(new THREE.SphereGeometry(.16*S,20,20),skin);hd.scale.set(1,1.2,1.05);hd.position.y=.15*S;head.add(hd);
 const hr=new THREE.Mesh(new THREE.SphereGeometry(.17*S,20,20),hairM);hr.position.set(0,.22*S,-.02*S);head.add(hr);
 [-1,1].forEach(s=>{
  const e=new THREE.Mesh(new THREE.SphereGeometry(.04*S,8,8),skin);e.position.set(s*.16*S,.15*S,0);head.add(e);
  const ew=new THREE.Mesh(new THREE.SphereGeometry(.026*S,10,10),std(0xffffff,.3));ew.position.set(s*.06*S,.19*S,.145*S);head.add(ew);
  const ep=new THREE.Mesh(new THREE.SphereGeometry(.013*S,8,8),dark);ep.position.set(s*.06*S,.19*S,.168*S);head.add(ep);
  const br=new THREE.Mesh(new THREE.BoxGeometry(.055*S,.012*S,.02*S),hairM);br.position.set(s*.06*S,.235*S,.15*S);br.rotation.z=-s*.2;head.add(br);});
 const mo=new THREE.Mesh(new THREE.BoxGeometry(.07*S,.012*S,.02*S),new THREE.MeshBasicMaterial({color:0x7f1d1d}));mo.position.set(0,.085*S,.158*S);head.add(mo);
 const sh=[],el=[],hip=[],kn=[],sides=[-1,1];
 sides.forEach((s,i)=>{
  const shd=new THREE.Group();shd.position.set(s*.42*S,.65*S,0);torso.add(shd);
  const ua=limb(.42,.13,.11,magenta);shd.add(ua);
  const elb=new THREE.Group();elb.position.y=-.42*S;ua.add(elb);
  const la=limb(.42,.1,.09,sleeve);elb.add(la);
  const gl=new THREE.Group();gl.position.y=-.5*S;la.add(gl);
  gl.add(new THREE.Mesh(new THREE.BoxGeometry(.22*S,.28*S,.18*S),glove));
  for(let f=0;f<4;f++){const fg=new THREE.Mesh(new THREE.CylinderGeometry(.025*S,.02*S,.1*S,6),glove);fg.position.set((-.075+f*.05)*S,-.17*S,0);gl.add(fg);}
  if(i===0){const ab=new THREE.Mesh(new THREE.CylinderGeometry(.12*S,.12*S,.05*S,16,1,true),new THREE.MeshBasicMaterial({color:0xa3e635,side:THREE.DoubleSide}));ab.position.y=-.2*S;ua.add(ab);}
  sh.push(shd);el.push(elb);
  const h=new THREE.Group();h.position.set(s*.19*S,0,0);pelvis.add(h);
  const th=limb(.48,.16,.13,shorts);h.add(th);
  const k=new THREE.Group();k.position.y=-.48*S;th.add(k);
  const ca=limb(.48,.12,.085,sock);k.add(ca);const stp=new THREE.Mesh(new THREE.CylinderGeometry(.125*S,.12*S,.07*S,12),magenta);stp.position.y=-.1*S;ca.add(stp);
  const so=new THREE.Mesh(new THREE.BoxGeometry(.18*S,.13*S,.34*S),shoe);so.position.set(0,-.48*S,.08*S);ca.add(so);
  hip.push(h);kn.push(k);});
 root.traverse(o=>{if(o.isMesh)o.castShadow=true;});scene.add(root);
 return {root,pelvis,torso,head,sh,el,hip,kn,sides,start:V3(0,0,GZ+.5),target:V3(0,0,GZ+.5),diving:false,side:0,t:0,fromX:0};
}
const lerp=THREE.MathUtils.lerp,clamp=THREE.MathUtils.clamp;
function animGoalie(dt,time){const g=gk;
 if(g.diving){
  g.t=Math.min(g.t+dt*3,1);const e=1-Math.pow(1-g.t,3);
  g.root.position.x=g.fromX+(g.target.x-g.fromX)*e;g.root.position.y=g.target.y*e*.6;
  g.root.rotation.z=-g.side*(Math.PI/2.2)*e;g.root.rotation.x=-.2*e;
  g.pelvis.position.y=1.76;g.torso.rotation.set(.15*(1-e),0,0);
  g.sides.forEach((s,i)=>{g.sh[i].rotation.z=lerp(s*.5,s*(Math.PI-.25),e);g.el[i].rotation.x=lerp(-.9,0,e);g.hip[i].rotation.x=lerp(-.3,-.5,e);g.hip[i].rotation.z=lerp(s*.2,s*.5,e);g.kn[i].rotation.x=lerp(.6,.3,e);});
 }else{
  g.pelvis.position.y=1.76+Math.abs(Math.sin(time*5))*.05;
  g.root.position.x=g.start.x+Math.sin(time*1.6)*.5;g.root.position.y=0;g.root.rotation.set(0,0,0);
  g.torso.rotation.set(.15,0,Math.sin(time*1.6)*.05);
  g.head.rotation.y=clamp((ball.position.x-g.root.position.x)*.05,-.5,.5);
  g.sides.forEach((s,i)=>{g.sh[i].rotation.z=s*(.5+Math.sin(time*4)*.05);g.el[i].rotation.x=-.9;g.hip[i].rotation.x=-.3;g.hip[i].rotation.z=s*.2;g.kn[i].rotation.x=.6;});
 }
}
function goalieAI(){
 const tz=Math.abs((gk.start.z-ball.position.z)/st.vel.z);
 let px=ball.position.x+st.vel.x*tz,py=ball.position.y+st.vel.y*tz-.5*GRAV*tz*tz;
 setTimeout(()=>{
  if(!st.shot)return;
  if(st.chip){px=Math.random()>.5?4.5:-4.5;py=.5;}
  else if(Math.random()<.6){px=(Math.random()>.5?1:-1)*(2+Math.random()*4.5);py=.6+Math.random()*2.2;}
  px=clamp(px,-GW/2.2,GW/2.2);py=clamp(py,.4,3.5);
  gk.fromX=gk.root.position.x;gk.target.set(px,py>2?py-.5:py,gk.start.z);gk.diving=true;gk.t=0;gk.side=px<gk.fromX?-1:1;
 },st.chip?150:380);
}

/* ---------- CONTROLLI ---------- */
function setChipUI(on){$('cuc').classList.toggle('on',on);$('cs').innerText=on?'ON':'OFF';cross.style.borderColor=on?'#facc15':'rgba(255,255,255,.85)';cross.style.boxShadow=on?'0 0 15px rgba(250,204,21,.8)':'0 0 15px rgba(0,255,128,.45)';}
function aim(cx,cy){
 if(!st.aiming||st.shot)return;
 cross.style.left=cx+'px';cross.style.top=cy+'px';
 mouse.set(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);ray.setFromCamera(mouse,camera);
 const d=(GZ-camera.position.z)/ray.ray.direction.z,p=camera.position.clone().add(ray.ray.direction.clone().multiplyScalar(d));
 st.target.set(clamp(p.x,-GW/1.8,GW/1.8),clamp(p.y,.3,GH+2.5),GZ);
}
function setIns(t,c){const e=$('ins');e.innerText=t;e.style.color=c||'#fff';}
function charge(){if(st.shot)return;st.charging=true;st.power=0;st.dir=1;setIns('POWERING...','#facc15');}
function release(){if(!st.charging||st.shot)return;st.charging=false;shoot();setIns('SHOT IN FLIGHT...');}
function events(){
 addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
 addEventListener('mousemove',e=>aim(e.clientX,e.clientY));
 addEventListener('mousedown',e=>{if(!e.target.closest('button'))charge();});
 addEventListener('mouseup',release);
 addEventListener('touchmove',e=>{if(e.touches.length)aim(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
 addEventListener('touchstart',e=>{if(!e.target.closest('button')){aim(e.touches[0].clientX,e.touches[0].clientY);charge();}},{passive:false});
 addEventListener('touchend',release);
 addEventListener('keydown',e=>{if(e.key==='Shift'){st.shift=true;setChipUI(true);}});
 addEventListener('keyup',e=>{if(e.key==='Shift'){st.shift=false;if(!st.toggle)setChipUI(false);}});
  $('cuc').addEventListener('click',()=>{st.toggle=!st.toggle;setChipUI(st.toggle);});
 $('restart').addEventListener('click',()=>{st.goals=st.miss=st.streak=0;score();resetRound();});
}

/* ---------- FISICA ---------- */
function shoot(){
 st.shot=true;st.aiming=false;cross.style.display='none';st.chip=st.toggle||st.shift;sfx.kick(st.chip);
 const p0=ball.position.clone(),p1=st.target.clone();
 if(st.chip){
  p1.y=clamp(p1.y,1,GH-1);const H=5.5+st.power*2,t1=Math.sqrt(2*(H-p0.y)/GRAV),t2=Math.sqrt(2*(H-p1.y)/GRAV),T=t1+t2;
  st.vel.set((p1.x-p0.x)/T,GRAV*t1,(p1.z-p0.z)/T);st.spin.set(-35,0,0);
 }else{
  st.vel.copy(p1.sub(p0).normalize()).multiplyScalar(25+st.power*28);st.vel.y+=2+st.power*4;
  st.spin.set((Math.random()-.5)*40,(Math.random()-.5)*40,(Math.random()-.5)*20);shake=.25;
 }
 goalieAI();
}
function segDist(p,a,b){const v=b.clone().sub(a),w=p.clone().sub(a),c1=w.dot(v);if(c1<=0)return{d:p.distanceTo(a),p:a};const c2=v.dot(v);if(c2<=c1)return{d:p.distanceTo(b),p:b};const q=a.clone().add(v.multiplyScalar(c1/c2));return{d:p.distanceTo(q),p:q};}
function collide(){
 if(st.done)return;
 for(const pp of posts){const r=segDist(ball.position,pp[0],pp[1]);if(r.d<R+PR){st.vel.reflect(ball.position.clone().sub(r.p).normalize()).multiplyScalar(.6);sfx.post();shake=.4;result('POST!',false);return;}}
 const gb=new THREE.Box3().setFromObject(gk.root);gb.expandByScalar(-.1);
 if(gb.containsPoint(ball.position)&&ball.position.z>GZ-.8){st.vel.z*=-.4;st.vel.x+=(Math.random()-.5)*10;st.vel.y=Math.abs(st.vel.y)*.5;sfx.save();result('SAVED!',false);return;}
 const box=new THREE.Box3(V3(-GW/2+.3,.2,GZ-GD),V3(GW/2-.3,GH-.2,GZ-.2));
 if(box.containsPoint(ball.position)){st.vel.multiplyScalar(.2);st.inNet=true;sfx.goal();spawnConfetti();result(st.chip?'To fatto er cucchiaio de totti':'GOAL!',true);return;}
 if(ball.position.z<GZ-3||Math.abs(ball.position.x)>GW||ball.position.y>GH+4)result('MISS!',false);
}
function score(){$('g').innerText=st.goals;$('m').innerText=st.miss;$('s').innerText=st.streak;}
function result(msg,ok){
 st.done=true;const e=$('msgt');e.innerText=msg;e.className=(ok?'ok':'bad')+(msg.length>10?' long':'');
 e.style.animation='none';void e.offsetWidth;e.style.animation='';
 if(ok){st.goals++;st.streak++;}else{st.miss++;st.streak=0;}
 score();$('msg').style.display='block';setTimeout(resetRound,msg.length>10?3500:2500);
}
function resetRound(){
 ball.position.copy(BS);ball.rotation.set(0,0,0);st.vel.set(0,0,0);st.spin.set(0,0,0);
 gk.root.position.copy(gk.start);gk.diving=false;
 st.shot=false;st.aiming=true;st.done=false;st.inNet=false;st.power=0;
 $('msg').style.display='none';$('pf').style.width='0%';setIns('Hold to power up shot');cross.style.display='flex';
}
function spawnConfetti(){
 const g=new THREE.PlaneGeometry(.25,.25),cols=[0x10b981,0x38bdf8,0xfacc15,0xffffff,0xef4444,0x8b5cf6];
 for(let i=0;i<100;i++){const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:cols[i%6],side:THREE.DoubleSide,transparent:true}));
  m.position.set((Math.random()-.5)*GW,Math.random()*GH+1,GZ+(Math.random()-.5)*3);
  m.userData={v:V3((Math.random()-.5)*10,Math.random()*12+5,(Math.random()-.5)*10),life:3};scene.add(m);confetti.push(m);}
}

/* ---------- LOOP ---------- */
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.1),time=clock.getElapsedTime();
 if(st.charging){st.power+=dt*1.5*st.dir;if(st.power>=1){st.power=1;st.dir=-1;}else if(st.power<=0){st.power=0;st.dir=1;}$('pf').style.width=st.power*100+'%';}
 if(st.shot){
  st.vel.y-=GRAV*dt;ball.position.addScaledVector(st.vel,dt);ball.rotation.x+=st.spin.x*dt;ball.rotation.y+=st.spin.y*dt;
  if(ball.position.y<R){ball.position.y=R;st.vel.y*=-.6;st.vel.x*=.85;st.vel.z*=.85;}
  if(st.inNet&&ball.position.z<GZ-GD+.5){ball.position.z=GZ-GD+.5;st.vel.z*=-.2;}
  collide();
 }
 animGoalie(dt,time);
 crowd.forEach(q=>{q.g.position.y=st.inNet?Math.abs(Math.sin(time*9+q.ph))*.5:Math.sin(time*2+q.ph)*.02;});
 for(let i=confetti.length-1;i>=0;i--){const c=confetti[i];c.userData.v.y-=GRAV*.4*dt;c.position.addScaledVector(c.userData.v,dt);c.rotation.x+=5*dt;c.rotation.y+=5*dt;c.userData.life-=dt;if(c.userData.life<.5)c.material.opacity=c.userData.life/.5;if(c.position.y<0||c.userData.life<=0){scene.remove(c);confetti.splice(i,1);}}
 if(shake>0){camera.position.x=camBase.x+(Math.random()-.5)*shake;camera.position.y=camBase.y+(Math.random()-.5)*shake;shake=Math.max(0,shake-dt*1.5);}
 else camera.position.lerp(camBase,dt*5);
 renderer.render(scene,camera);
}
window.onload=init;
</script>
