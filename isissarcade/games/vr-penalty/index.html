<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Penalty Shootout AR — ISISS Arcade VR</title>
  <link rel="icon" type="image/png" href="../../assets/img/isiss-logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="../../assets/js/ar-common.js"></script>
<script>
Arc.initOverlay({
  title: '3D Penalty Shootout',
  subtitle: 'Il rigore nella tua stanza, in realtà aumentata.',
  howto: [
    'La <b>porta</b> e il <b>portiere</b> compaiono davanti a te, sul pavimento della tua stanza.',
    '<b>Calcia</b> la palla colpendola con un controller con un colpo deciso in avanti.',
    'Pulsante <b>A / X</b>: riposiziona il campo davanti a te.',
    'Stanza piccola? Aggiungi <code>?d=2.2</code> all\'indirizzo per avvicinare la porta.'
  ]
});

AFRAME.registerComponent('penalty-game', {
  init() {
    const THREE = AFRAME.THREE, self = this;
    const Q = new URLSearchParams(location.search);
    this.R = 0.11; this.G = 9.8;
    this.GW = 2.4; this.GH = 1.25;
    this.goalZ = -Math.min(6, Math.max(1.8, parseFloat(Q.get('d')) || 3.0));
    this.start = new THREE.Vector3(0, this.R, -0.9);
    this.stats = { goals: 0, saves: 0, miss: 0, streak: 0, best: 0 };
    this.running = false;
    this.hs = { left: { p: null, v: new THREE.Vector3() }, right: { p: null, v: new THREE.Vector3() } };
    this.root = new THREE.Group();
    this.el.setObject3D('game', this.root);

    this.buildGoal(); this.buildBall(); this.buildKeeper();
    this.hud = document.getElementById('hud'); this.banner = document.getElementById('banner'); this.help = document.getElementById('help');
    this.hud.setAttribute('position', `0 1.9 ${this.goalZ}`);
    this.banner.setAttribute('position', `0 1.45 ${this.goalZ + 0.6}`);
    this.updateHud();

    Arc.onStart(() => { self.running = true; self.resetBall(); self.help.setAttribute('value', Arc.inXR ? 'Colpisci la palla con un controller!' : 'Clicca sulla porta per tirare'); });
    Arc.onRecenter(() => self.help.setAttribute('value', 'Colpisci la palla con un controller!'));
    Arc.onTrigger((ray, src) => {          // anteprima 2D: clic = tiro verso il punto cliccato
      if (src !== 'mouse' || self.ball.state !== 'ready' || Math.abs(ray.dir.z) < 1e-4) return;
      const t = (self.goalZ - ray.origin.z) / ray.dir.z; if (t <= 0) return;
      const tgt = ray.origin.clone().addScaledVector(ray.dir, t);
      tgt.x = THREE.MathUtils.clamp(tgt.x, -self.GW / 2 - 0.4, self.GW / 2 + 0.4);
      tgt.y = THREE.MathUtils.clamp(tgt.y, 0.1, self.GH + 0.4);
      self.launchTo(tgt, 6.5);
    });
  },

  buildGoal() {
    const THREE = AFRAME.THREE, W = this.GW, H = this.GH, z = this.goalZ;
    const g = new THREE.Group(); g.position.z = z;
    const white = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 });
    const post = (x, y, w, h, d) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), white); m.position.set(x, y, 0); g.add(m); };
    post(-W / 2, H / 2, 0.07, H, 0.07); post(W / 2, H / 2, 0.07, H, 0.07); post(0, H, W + 0.07, 0.07, 0.07);
    const net = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.35 });
    const back = new THREE.Mesh(new THREE.PlaneGeometry(W, H, 16, 8), net); back.position.set(0, H / 2, -0.8); g.add(back);
    [-1, 1].forEach(s => { const side = new THREE.Mesh(new THREE.PlaneGeometry(0.8, H, 4, 8), net); side.rotation.y = Math.PI / 2; side.position.set(s * W / 2, H / 2, -0.4); g.add(side); });
    const top = new THREE.Mesh(new THREE.PlaneGeometry(W, 0.8, 16, 4), net); top.rotation.x = Math.PI / 2; top.position.set(0, H, -0.4); g.add(top);
    this.root.add(Arc.cast(g));
    // dischetto
    const spot = new THREE.Mesh(new THREE.RingGeometry(0.1, 0.16, 32), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8, side: THREE.DoubleSide }));
    spot.rotation.x = -Math.PI / 2; spot.position.set(0, 0.005, this.start.z); this.root.add(spot);
  },

  buildBall() {
    const THREE = AFRAME.THREE;
    let geo = new THREE.IcosahedronGeometry(this.R, 1).toNonIndexed();
    const n = geo.attributes.position.count / 3, col = new Float32Array(n * 9);
    for (let f = 0; f < n; f++) { const c = (f % 4 === 0) ? 0.08 : 1; for (let k = 0; k < 9; k++) col[f * 9 + k] = c; }
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    geo.computeVertexNormals();
    this.ballMesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.5 }));
    Arc.cast(this.ballMesh); this.root.add(this.ballMesh);
    this.ball = { pos: this.start.clone(), vel: new THREE.Vector3(), state: 'ready', timer: 0, resolved: false, age: 0 };
  },

  buildKeeper() {
    const THREE = AFRAME.THREE, k = new THREE.Group();
    const kit = new THREE.MeshStandardMaterial({ color: 0xf97316 }), dark = new THREE.MeshStandardMaterial({ color: 0x14213d }),
          skin = new THREE.MeshStandardMaterial({ color: 0xf1c27d }), glove = new THREE.MeshStandardMaterial({ color: 0x22c55e });
    const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); k.add(m); return m; };
    add(new THREE.BoxGeometry(0.34, 0.42, 0.18), kit, 0, 0.55, 0);
    add(new THREE.SphereGeometry(0.09, 16, 12), skin, 0, 0.88, 0);
    add(new THREE.BoxGeometry(0.12, 0.34, 0.12), dark, -0.09, 0.17, 0);
    add(new THREE.BoxGeometry(0.12, 0.34, 0.12), dark, 0.09, 0.17, 0);
    this.armL = add(new THREE.BoxGeometry(0.09, 0.38, 0.09), kit, -0.24, 0.62, 0); this.armL.rotation.z = -0.5;
    this.armR = add(new THREE.BoxGeometry(0.09, 0.38, 0.09), kit, 0.24, 0.62, 0);  this.armR.rotation.z = 0.5;
    add(new THREE.SphereGeometry(0.06, 10, 8), glove, -0.33, 0.8, 0); add(new THREE.SphereGeometry(0.06, 10, 8), glove, 0.33, 0.8, 0);
    k.position.set(0, 0, this.goalZ + 0.15);
    this.keeper = { g: k, x: 0, y: 0, tx: 0, ty: 0, diving: false, speed: 3.2 };
    this.root.add(Arc.cast(k));
  },

  launchTo(tgt, speed) {
    const b = this.ball, dx = tgt.x - b.pos.x, dz = tgt.z - b.pos.z, d = Math.hypot(dx, dz), T = d / speed;
    b.vel.set(dx / T, (tgt.y - b.pos.y + 0.5 * this.G * T * T) / T, dz / T);
    this.onShot();
  },

  onShot() {
    const b = this.ball; b.state = 'flying'; b.resolved = false; b.age = 0;
    Arc.beep(180, 0.12, 'triangle', 0.25, 90);
    // il portiere "legge" il tiro, ma sbaglia spesso la direzione
    const tt = (this.goalZ - b.pos.z) / b.vel.z;
    let px = b.pos.x + b.vel.x * tt, py = b.pos.y + b.vel.y * tt - 0.5 * this.G * tt * tt;
    if (Math.random() < 0.42) px = (Math.random() * 2 - 1) * (this.GW / 2);
    const K = this.keeper; K.diving = true;
    K.tx = AFRAME.THREE.MathUtils.clamp(px, -this.GW / 2 + 0.2, this.GW / 2 - 0.2);
    K.ty = AFRAME.THREE.MathUtils.clamp(py - 0.5, 0, 0.5);
  },

  checkKick() {
    const b = this.ball;
    for (const h of ['left', 'right']) {
      const hs = this.hs[h]; if (!hs.p) continue;
      if (hs.p.distanceTo(b.pos) < this.R + 0.1 && hs.v.length() > 1.0 && hs.v.z < -0.4) {
        b.vel.copy(hs.v).multiplyScalar(1.5);
        if (b.vel.length() > 9) b.vel.setLength(9);
        b.vel.y = AFRAME.THREE.MathUtils.clamp(b.vel.y, -0.3, 3.2);
        if (b.vel.z > -2.5) b.vel.z = -2.5;
        Arc.haptic(h, 0.9, 70); this.onShot(); return;
      }
    }
  },

  say(text, color) {
    this.banner.setAttribute('value', text); this.banner.setAttribute('color', color || '#ffd400');
    this.banner.removeAttribute('animation');
    this.banner.setAttribute('opacity', 1);
    this.banner.setAttribute('animation', 'property: opacity; from: 1; to: 0; delay: 1200; dur: 700; easing: linear');
  },

  updateHud() {
    const s = this.stats;
    this.hud.setAttribute('value', `GOL ${s.goals}   PARATE ${s.saves}   FUORI ${s.miss}\nSERIE ${s.streak}   RECORD ${s.best}`);
  },

  result(kind) {
    const b = this.ball, s = this.stats; b.resolved = true; b.timer = 2.2;
    if (kind === 'goal') { s.goals++; s.streak++; s.best = Math.max(s.best, s.streak); this.say('GOOOL!', '#22c55e'); Arc.beep(520, 0.12, 'square', 0.2); setTimeout(() => Arc.beep(780, 0.25, 'square', 0.2), 120); Arc.haptic('right', 1, 150); Arc.haptic('left', 1, 150); }
    else if (kind === 'save') { s.saves++; s.streak = 0; this.say('PARATA!', '#f97316'); Arc.beep(160, 0.25, 'sawtooth', 0.2, 80); }
    else if (kind === 'post') { s.miss++; s.streak = 0; this.say('PALO!', '#ffffff'); Arc.beep(900, 0.08, 'triangle', 0.3); }
    else { s.miss++; s.streak = 0; this.say('FUORI!', '#ef4444'); Arc.beep(140, 0.3, 'sawtooth', 0.15, 70); }
    this.updateHud();
  },

  resetBall() {
    const b = this.ball; b.pos.copy(this.start); b.vel.set(0, 0, 0); b.state = 'ready'; b.timer = 0; b.resolved = false;
    this.keeper.diving = false; this.keeper.tx = 0; this.keeper.ty = 0;
  },

  tick(time, dtms) {
    if (!this.running) return;
    const dt = Math.min(dtms / 1000, 0.05), b = this.ball, K = this.keeper, THREE = AFRAME.THREE, t = time / 1000;
    if (dt <= 0) return;

    // velocità dei controller (per il calcio)
    if (Arc.inXR && Arc.hands) {
      for (const h of ['left', 'right']) {
        const p = Arc.handPos(h), hs = this.hs[h];
        if (hs.p) hs.v.lerp(p.clone().sub(hs.p).divideScalar(dt), 0.5);
        hs.p = p;
      }
      if (b.state === 'ready') this.checkKick();
    }

    // portiere
    if (K.diving) {
      const k = Math.min(1, dt * 7);
      K.x += THREE.MathUtils.clamp(K.tx - K.x, -K.speed * dt, K.speed * dt) * (0.6 + 0.4 * k);
      K.y += (K.ty - K.y) * Math.min(1, dt * 8);
    } else { K.x += (Math.sin(t * 1.3) * 0.35 - K.x) * Math.min(1, dt * 3); K.y += (0 - K.y) * Math.min(1, dt * 6); }
    K.g.position.set(K.x, K.y, this.goalZ + 0.15);
    K.g.rotation.z = K.diving ? THREE.MathUtils.clamp(-(K.tx) * 0.55, -1.0, 1.0) * Math.min(1, Math.abs(K.tx - K.x) + 0.3) : 0;
    this.armL.rotation.z = -0.5 - (K.diving ? 1.0 : Math.sin(t * 4) * 0.1); this.armR.rotation.z = 0.5 + (K.diving ? 1.0 : Math.sin(t * 4) * 0.1);

    // palla
    if (b.state === 'flying') {
      b.age += dt;
      const prevZ = b.pos.z;
      b.vel.y -= this.G * dt; b.pos.addScaledVector(b.vel, dt);
      if (b.pos.y < this.R) { b.pos.y = this.R; b.vel.y = -b.vel.y * 0.55; b.vel.x *= 0.92; b.vel.z *= 0.92; if (Math.abs(b.vel.y) < 0.4) b.vel.y = 0; }
      if (b.pos.y <= this.R + 0.001) { b.vel.x *= (1 - 0.8 * dt); b.vel.z *= (1 - 0.8 * dt); }

      if (!b.resolved && prevZ > this.goalZ && b.pos.z <= this.goalZ) {
        const x = b.pos.x, y = b.pos.y, hw = this.GW / 2;
        const onPost = (Math.abs(Math.abs(x) - hw) < 0.09 && y < this.GH + 0.08) || (Math.abs(x) < hw && Math.abs(y - this.GH) < 0.09);
        const inside = Math.abs(x) < hw - 0.04 && y < this.GH - 0.04;
        const reach = K.diving ? 0.46 : 0.3;
        const saved = Math.abs(x - K.x) < reach && y > K.y - 0.02 && y < K.y + 1.0 && inside;
        if (saved) { b.vel.z = Math.abs(b.vel.z) * 0.4; b.vel.x += (Math.random() - 0.5) * 3; b.vel.y = 1.5; this.result('save'); }
        else if (onPost) { b.vel.z = Math.abs(b.vel.z) * 0.5; b.vel.y *= 0.5; this.result('post'); }
        else if (inside) this.result('goal');
        else this.result('miss');
      }
      if (b.resolved && b.pos.z < this.goalZ) {            // dentro la rete: la palla rallenta
        b.vel.multiplyScalar(Math.exp(-4 * dt)); if (b.pos.z < this.goalZ - 0.75) { b.pos.z = this.goalZ - 0.75; b.vel.z = 0; }
      }
      if (!b.resolved && (b.age > 4 || b.pos.z > 0.5 || Math.abs(b.pos.x) > 6)) this.result('miss');
      if (b.resolved) { b.timer -= dt; if (b.timer <= 0) this.resetBall(); }
      this.ballMesh.rotation.x -= b.vel.z * dt * 3; this.ballMesh.rotation.z += b.vel.x * dt * 3;
    }
    this.ballMesh.position.copy(b.pos);
  }
});
</script>
</head>
<body>
<a-scene webxr="referenceSpaceType: local-floor; optionalFeatures: hit-test"
         xr-mode-ui="enabled: false" background="transparent: true" renderer="alpha: true; antialias: true"
         cursor="rayOrigin: mouse" raycaster="objects: .clickable" loading-screen="enabled: false">

  <a-entity id="rig">
    <a-entity id="cam" camera look-controls="touchEnabled: false" position="0 1.6 0"></a-entity>
    <a-entity id="lc" laser-controls="hand: left" raycaster="far: 8; objects: .clickable"></a-entity>
    <a-entity id="rc" laser-controls="hand: right" raycaster="far: 8; objects: .clickable"></a-entity>
  </a-entity>

  <a-entity arc-world id="world">
    <a-entity light="type: ambient; intensity: 0.9; color: #ffffff"></a-entity>
    <a-entity light="type: directional; intensity: 0.8; castShadow: true; shadowCameraTop: 4; shadowCameraBottom: -4; shadowCameraLeft: -4; shadowCameraRight: 4; shadowMapWidth: 1024; shadowMapHeight: 1024" position="2 5 1"></a-entity>

    <!-- pavimento invisibile che riceve solo le ombre: il vero pavimento resta visibile -->
    <a-plane rotation="-90 0 0" width="14" height="14" material="shader: shadow; opacity: 0.45" shadow="receive: true"></a-plane>
    <!-- griglia visibile solo nell'anteprima 2D -->
    <a-plane class="preview-only" rotation="-90 0 0" position="0 -0.01 0" width="14" height="14" material="color: #1f6b3a; opacity: 0.9"></a-plane>

    <a-text id="hud"    value="" align="center" width="3.2" color="#ffffff" position="0 1.8 -3"></a-text>
    <a-text id="banner" value="" align="center" width="6"   color="#ffd400" position="0 1.35 -2.2" opacity="0"></a-text>
    <a-text id="help"   value="" align="center" width="2.2" color="#9ff" position="0 0.55 -0.9" rotation="-60 0 0"></a-text>

    <a-entity penalty-game></a-entity>
  </a-entity>
</a-scene>

</body>
</html>
