<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ISISS Matese — Logo Blaster MR</title>
<link rel="icon" type="image/png" href="../../assets/img/isiss-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="../../assets/js/ar-common.js"></script>
<script>
Arc.initOverlay({
  title:'ISISS Matese Logo Blaster',
  subtitle:'Spara al logo ISISS Matese nella tua stanza.',
  howto:[
    '<b>Trigger</b>: spara al logo con il blaster.',
    'Il logo si muove da solo: non devi premere altri pulsanti.',
    'Fai più centri consecutivi per aumentare la combo.',
    'A / X ricentra solo se ne hai bisogno.',
    'Gioca in una stanza libera e ben illuminata.'
  ]
});

AFRAME.registerComponent('blaster-game', {
  init(){
    const T=AFRAME.THREE;
    this.T=T; this.root=new T.Group(); this.el.setObject3D('game',this.root);
    this.target=null; this.running=false; this.countdown=false; this.finished=false;
    this.score=0; this.combo=0; this.maxCombo=0; this.shots=0; this.hits=0; this.timeLeft=60; this.startAt=0; this.lastShot=0;
    this.vel=new T.Vector3(); this.goal=new T.Vector3(); this.tmp=new T.Vector3(); this.tmp2=new T.Vector3();
    this.beams=[]; this.fx=[]; this.guns={left:null,right:null}; this.recoil={left:0,right:0}; this.raycaster=new T.Raycaster();
    this.msg=document.getElementById('msg'); this.hud=document.getElementById('hud'); this.scoreEl=document.getElementById('score');
    this.timerEl=document.getElementById('timer'); this.comboEl=document.getElementById('combo'); this.accuracyEl=document.getElementById('accuracy');
    this.flashEl=document.getElementById('flash');
    this.domScore=document.getElementById('d-score'); this.domTimer=document.getElementById('d-timer'); this.domCombo=document.getElementById('d-combo'); this.domAccuracy=document.getElementById('d-accuracy');
    this.popupEl=document.getElementById('xr-popup'); this.endEl=document.getElementById('xr-end'); this.endScore=document.getElementById('end-score'); this.endAcc=document.getElementById('end-acc'); this.endHits=document.getElementById('end-hits'); this.endCombo=document.getElementById('end-combo');
    this.mode='classic'; this.modes={classic:{name:'CLASSIC',duration:60,points:100,speed:0.72,size:.72,desc:'60 secondi · combo e punteggio'},blitz:{name:'BLITZ',duration:30,points:150,speed:1.05,size:.66,desc:'30 secondi · tutto più veloce'},precision:{name:'PRECISION',duration:60,points:200,speed:.62,size:.56,desc:'60 secondi · bersaglio piccolo'} };
    this.modeCfg=this.modes.classic;
    document.querySelectorAll('.mode-btn').forEach(b=>b.addEventListener('click',()=>this.selectMode(b.dataset.mode)));
    document.getElementById('restart-game').addEventListener('click',()=>this.begin());
    this.popupScale=0; this.popupLife=0;
    this.makeTarget(); this.makeGuns();
    Arc.onStart(()=>this.begin());
    Arc.onTrigger((ray,hand)=>this.shoot(ray,hand));
    ['left','right'].forEach(h=>document.getElementById(h==='left'?'lc':'rc').addEventListener('gripdown',()=>this.recenter()));
    window.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r')this.recenter()});
  },

  makeTarget(){
    const T=this.T;
    const tex=new T.TextureLoader().load('../../assets/img/isiss-logo.png');
    tex.colorSpace=T.SRGBColorSpace;
    this.target=new T.Mesh(new T.PlaneGeometry(.72,.72),new T.MeshBasicMaterial({map:tex,transparent:true,side:T.DoubleSide,alphaTest:.05,depthWrite:false}));
    this.target.visible=false; this.root.add(this.target);
    this.ring=new T.Mesh(new T.RingGeometry(.39,.42,64),new T.MeshBasicMaterial({color:0x55ddff,transparent:true,opacity:.82,side:T.DoubleSide,depthWrite:false}));
    this.ring.position.z=.006; this.target.add(this.ring);
    this.ring2=new T.Mesh(new T.RingGeometry(.46,.475,64),new T.MeshBasicMaterial({color:0xff3fd4,transparent:true,opacity:.38,side:T.DoubleSide,depthWrite:false}));
    this.ring2.position.z=.008; this.target.add(this.ring2);
  },

  makeGuns(){
    const T=this.T;
    ['left','right'].forEach(hand=>{
      const el=document.getElementById(hand==='left'?'lc':'rc');
      const g=new T.Group();
      // Blaster compatto: piu corto e leggero, perfettamente allineato al ray del controller (-Z).
      g.scale.setScalar(.72);
      const body=new T.Mesh(new T.BoxGeometry(.062,.075,.17),new T.MeshBasicMaterial({color:0x17233b}));
      body.position.set(0,-.018,-.075); g.add(body);
      const top=new T.Mesh(new T.BoxGeometry(.068,.018,.105),new T.MeshBasicMaterial({color:0x35e6ff}));
      top.position.set(0,.028,-.09); g.add(top);
      const grip=new T.Mesh(new T.BoxGeometry(.043,.095,.052),new T.MeshBasicMaterial({color:0x33435f}));
      grip.position.set(0,-.078,-.005); grip.rotation.x=-.14; g.add(grip);
      const guard=new T.Mesh(new T.TorusGeometry(.025,.006,8,18,Math.PI),new T.MeshBasicMaterial({color:0x5c6d8e}));
      guard.rotation.x=Math.PI/2; guard.position.set(0,-.037,-.035); g.add(guard);
      const muzzle=new T.Mesh(new T.CylinderGeometry(.019,.023,.018,16),new T.MeshBasicMaterial({color:0xdffcff}));
      muzzle.rotation.x=Math.PI/2; muzzle.position.z=-.171; g.add(muzzle);
      const core=new T.Mesh(new T.SphereGeometry(.012,10,10),new T.MeshBasicMaterial({color:0x7fffff}));
      core.position.z=-.183; g.add(core);
      const flash=new T.Mesh(new T.SphereGeometry(.042,10,10),new T.MeshBasicMaterial({color:0x8fffff,transparent:true,opacity:0,depthWrite:false}));
      flash.position.z=-.205; g.add(flash);
      el.object3D.add(g); this.guns[hand]={g,flash};
    });
  },
  head(){return Arc.inXR?Arc.headLocal():new this.T.Vector3(0,1.6,0)},
  recenter(){if(Arc.inXR)Arc.recenter(); const h=this.head(); this.target.position.set(h.x,h.y-.1,h.z-1.7); this.setGoal(1.0);},

  selectMode(mode){
    if(!this.modes[mode]) return; this.mode=mode; this.modeCfg=this.modes[mode];
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
    const d=document.getElementById('mode-desc'); if(d)d.textContent=this.modeCfg.desc;
  },
  begin(){
    if(this.countdown)return;
    this.modeCfg=this.modes[this.mode]||this.modes.classic;
    this.countdown=true; this.finished=false; this.running=false;
    this.score=0;this.combo=0;this.maxCombo=0;this.shots=0;this.hits=0;this.timeLeft=this.modeCfg.duration;
    this.target.visible=false; this.hud.object3D.visible=true; this.endEl.classList.add('hidden'); this.flashEl.setAttribute('material','opacity:0');
    this.updateHUD(); this.countdownStep(0);
  },

  countdownStep(i){
    const seq=['3','2','1','VIA!'];
    if(i>=seq.length){this.running=true;this.countdown=false;this.startAt=performance.now();this.spawnTarget(true);this.popup('CENTRA IL LOGO!','#ffd84d',1.15,1100);this.sound('start');return;}
    const s=seq[i]; this.popup(s,s==='VIA!'?'#57ff9b':'#ffffff',s==='VIA!'?1.55:1.35,650); this.sound(s==='VIA!'?'go':'count');
    setTimeout(()=>this.countdownStep(i+1),s==='VIA!'?650:700);
  },

  spawnTarget(first){
    const h=this.head(),a=Math.random()*Math.PI*2,r=first?1.55:1.1+Math.random()*1.6;
    this.target.position.set(h.x+Math.sin(a)*r,.9+Math.random()*1.0,h.z+Math.cos(a)*r);
    this.target.scale.setScalar(.02);
    this.target.visible=true; this.target.scale.setScalar(.02); this.setGoal(.9+Math.random()*2.0);
  },

  setGoal(minRadius){
    const h=this.head(),a=Math.random()*Math.PI*2,r=minRadius+Math.random()*1.2;
    this.goal.set(h.x+Math.sin(a)*r,.82+Math.random()*1.15,h.z+Math.cos(a)*r);
    this.nextGoal=performance.now()+650+Math.random()*1000;
  },

  popup(text,color,scale,duration){
    this.msg.setAttribute('value',text); this.msg.setAttribute('color',color); this.popupScale=.15; this.popupTargetScale=scale; this.popupLife=duration/1000;
    this.msg.object3D.scale.setScalar(.15);
    if(this.popupEl){ this.popupEl.textContent=text; this.popupEl.style.setProperty('--pop-color',color); this.popupEl.classList.remove('show'); void this.popupEl.offsetWidth; this.popupEl.classList.add('show'); clearTimeout(this.popupTimer); this.popupTimer=setTimeout(()=>this.popupEl.classList.remove('show'),Math.max(250,duration)); }
  },
  updateHUD(){
    const acc=this.shots?Math.round(this.hits/this.shots*100):100;
    this.scoreEl.setAttribute('value',String(this.score).padStart(5,'0'));
    this.timerEl.setAttribute('value',String(Math.max(0,Math.ceil(this.timeLeft))));
    this.comboEl.setAttribute('value',this.combo>1?'COMBO x'+Math.min(this.combo,5):'');
    this.accuracyEl.setAttribute('value',acc+'%');
    if(this.domScore)this.domScore.textContent=String(this.score).padStart(5,'0');
    if(this.domTimer)this.domTimer.textContent=Math.max(0,Math.ceil(this.timeLeft));
    if(this.domCombo)this.domCombo.textContent=this.combo>1?'COMBO x'+Math.min(this.combo,5):'COMBO —';
    if(this.domAccuracy)this.domAccuracy.textContent=acc+'%';
  },

  shoot(ray,hand){
    if(!this.running||!this.target.visible)return;
    const now=performance.now(); if(now-this.lastShot<110)return; this.lastShot=now; this.shots++;
    const origin=ray.origin.clone(), dir=ray.dir.clone().normalize();

    // Raycast reale contro il piano del logo. Evita i falsi MISS dovuti alla vecchia
    // distanza dal centro: se il raggio attraversa il logo, e un centro valido.
    this.raycaster.set(origin,dir);
    this.raycaster.far=15;
    this.target.updateMatrixWorld(true);
    const hits=this.raycaster.intersectObject(this.target,false);
    const hit=hits.length>0;
    const center=this.target.getWorldPosition(this.tmp);
    const end=origin.clone().addScaledVector(dir,hit?hits[0].distance:7);
    this.beam(origin,end,hit); this.fireGun(hand);

    if(hit){
      this.hits++; this.combo++; this.maxCombo=Math.max(this.maxCombo,this.combo);
      const pts=this.modeCfg.points*Math.min(this.combo,5); this.score+=pts;
      this.popup('+'+pts+'  CENTRO!',this.combo>=3?'#57ff9b':'#ffffff',1.0+Math.min(this.combo,5)*.07,700);
      this.explode(hits[0].point); this.sound('hit'); this.pulse(hand); this.flash(.16);
      this.setGoal(1.35); this.vel.multiplyScalar(.25);
    }else{
      this.combo=0; this.popup('MISS!','#ff6480',.78,420); this.sound('miss');
    }
    this.updateHUD();
  },
  fireGun(hand){
    const g=this.guns[hand];if(!g)return;g.g.position.z=.045;g.flash.material.opacity=1;this.recoil[hand]=.09;
  },
  pulse(hand){Arc.haptic(hand||'right',.75,55)},
  flash(seconds){this.flashTime=seconds;this.flashEl.setAttribute('material','opacity:.16')},

  beam(a,b,hit){
    const T=this.T,len=a.distanceTo(b);
    const m=new T.Mesh(new T.CylinderGeometry(hit?.018:.009,hit?.018:.009,len,8),new T.MeshBasicMaterial({color:hit?0x70fff0:0xff385f,transparent:true,opacity:.95,depthWrite:false}));
    m.position.copy(a).lerp(b,.5);m.lookAt(b);this.root.add(m);this.beams.push({m,life:.13});
  },

  explode(p){
    const T=this.T;
    for(let i=0;i<20;i++){
      const m=new T.Mesh(new T.SphereGeometry(.014+Math.random()*.025,7,7),new T.MeshBasicMaterial({color:i%2?0x29eaff:0xff3bd4,transparent:true,opacity:1,depthWrite:false}));
      m.position.copy(p);const v=new T.Vector3(Math.random()-.5,Math.random()-.45,Math.random()-.5).normalize().multiplyScalar(.7+Math.random()*1.3);this.root.add(m);this.fx.push({m,v,life:.45});
    }
  },

  sound(type){try{
    if(type==='hit'){Arc.beep(480,.06,'square',.08,1100);setTimeout(()=>Arc.beep(1250,.11,'sine',.05,1750),35)}
    else if(type==='miss')Arc.beep(120,.08,'sawtooth',.035,70);
    else if(type==='count')Arc.beep(520,.08,'sine',.045,700);
    else if(type==='go'){Arc.beep(720,.09,'square',.06,1100);setTimeout(()=>Arc.beep(1100,.13,'square',.05,1650),70)}
    else Arc.beep(330,.16,'sine',.05,880);
  }catch(e){}}
,
  finish(){
    if(this.finished)return;this.finished=true;this.running=false;this.target.visible=false;
    const acc=this.shots?Math.round(this.hits/this.shots*100):0;
    this.endScore.textContent=this.score+' PUNTI'; this.endAcc.textContent=acc+'%'; this.endHits.textContent=this.hits; this.endCombo.textContent='x'+Math.min(this.maxCombo,5);
    this.endEl.classList.remove('hidden'); this.popupEl.classList.remove('show');
    this.sound('go');
  },

  tick(time,dtms){
    const dt=Math.min(dtms/1000,.05),now=performance.now();
    if(this.running){
      this.timeLeft=Math.max(0,this.modeCfg.duration-(now-this.startAt)/1000);this.updateHUD();if(this.timeLeft<=0){this.finish();return;}
    }
    if(this.popupLife>0){this.popupLife-=dt;this.popupScale+=(this.popupTargetScale-this.popupScale)*Math.min(1,dt*14);this.msg.object3D.scale.setScalar(this.popupScale);if(this.popupLife<=0)this.msg.setAttribute('value','');}
    if(this.flashTime>0){this.flashTime-=dt;if(this.flashTime<=0)this.flashEl.setAttribute('material','opacity:0');}
    for(const h of ['left','right']){if(this.recoil[h]>0){this.recoil[h]-=dt;const g=this.guns[h];if(g){g.g.position.z=Math.max(0,this.recoil[h]/.09*.045);g.flash.material.opacity=Math.max(0,this.recoil[h]/.09)}}}
    this.beams=this.beams.filter(b=>{b.life-=dt;b.m.material.opacity=Math.max(0,b.life/.13);if(b.life<=0){this.root.remove(b.m);b.m.geometry.dispose();b.m.material.dispose();return false}return true});
    this.fx=this.fx.filter(x=>{x.life-=dt;x.m.position.addScaledVector(x.v,dt);x.v.y-=1.5*dt;x.m.material.opacity=Math.max(0,x.life/.45);if(x.life<=0){this.root.remove(x.m);x.m.geometry.dispose();x.m.material.dispose();return false}return true});
    if(!this.running||!this.target.visible)return;
    const h=this.head();
    if(now>this.nextGoal)this.setGoal(1.0);
    this.tmp.copy(this.goal).sub(this.target.position);
    if(this.tmp.length()>.03){this.tmp.normalize();this.vel.lerp(this.tmp.multiplyScalar(this.modeCfg.speed),1-Math.exp(-dt*3.5));this.target.position.addScaledVector(this.vel,dt);}
    if(this.target.position.distanceTo(h)>3.8)this.setGoal(1.0);
    this.target.position.y=this.T.MathUtils.clamp(this.target.position.y,.72,2.05);
    // Il logo deve sempre guardare il giocatore, anche quando si trova dietro di lui.
    // Niente yaw memorizzato: ogni frame usiamo direttamente la posizione della testa.
    this.target.rotation.set(0, Math.atan2(h.x-this.target.position.x, h.z-this.target.position.z), 0);
    this.ring.rotation.z+=dt*2.5;this.ring2.rotation.z-=dt*1.5;
    const pulse=this.modeCfg.size*(1+Math.sin(time/100)*.035);this.target.scale.lerp(this.tmp2.set(pulse,pulse,pulse),Math.min(1,dt*9));
  }
});
</script>
<style>
  #xr-overlay{position:fixed;inset:0;z-index:20;pointer-events:none;font-family:Manrope,system-ui,sans-serif;color:#f4f6fb}
  #xr-hud{position:absolute;top:max(18px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;pointer-events:none}
  .hud-card{min-width:92px;padding:9px 15px;border:1px solid rgba(85,200,255,.34);border-radius:16px;background:rgba(9,18,42,.78);box-shadow:0 10px 32px rgba(0,0,0,.28);backdrop-filter:blur(10px);text-align:center}
  .hud-label{font-size:10px;letter-spacing:.16em;color:#9db4d6;font-weight:800}.hud-value{font-size:25px;line-height:1.05;font-family:'Space Grotesk',system-ui,sans-serif;font-weight:800}
  #xr-popup{position:absolute;top:25%;left:50%;transform:translate(-50%,-50%) scale(.65);opacity:0;padding:14px 26px;border-radius:22px;background:linear-gradient(100deg,rgba(255,122,26,.94),rgba(230,51,143,.94),rgba(18,181,201,.94));font-family:'Space Grotesk',system-ui,sans-serif;font-size:clamp(26px,5vw,54px);font-weight:800;letter-spacing:.02em;text-align:center;white-space:nowrap;box-shadow:0 18px 60px rgba(0,0,0,.45);text-shadow:0 3px 15px rgba(0,0,0,.25);transition:transform .18s ease,opacity .18s ease}
  #xr-popup.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #xr-end{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(7,14,31,.48);backdrop-filter:blur(7px);pointer-events:auto;padding:20px}
  #xr-end.hidden{display:none}.end-box{width:min(560px,92vw);padding:28px;border-radius:28px;background:#131d3d;border:1px solid rgba(85,200,255,.28);box-shadow:0 24px 70px rgba(0,0,0,.5);text-align:center}
  .end-kicker{font-size:11px;letter-spacing:.18em;color:#55c8ff;font-weight:800}.end-box h2{margin:7px 0 4px;font:800 clamp(30px,6vw,46px)/1.05 'Space Grotesk',system-ui,sans-serif}.end-score{font:800 52px/1 'Space Grotesk',system-ui,sans-serif;background:linear-gradient(100deg,#ff7a1a,#e6338f,#12b5c9,#2fcf7a);-webkit-background-clip:text;background-clip:text;color:transparent}.end-stats{display:flex;justify-content:center;gap:10px;margin:18px 0;flex-wrap:wrap}.stat{padding:10px 15px;border-radius:14px;background:#0d1630;border:1px solid #263e67}.stat b{display:block;font-size:20px}.stat span{font-size:10px;letter-spacing:.12em;color:#9db4d6}
  .mode-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.mode-btn,.restart-btn{border:0;border-radius:14px;padding:13px 9px;font-weight:800;cursor:pointer;color:#0d1630;background:linear-gradient(100deg,#ff7a1a,#e6338f 45%,#12b5c9 80%,#2fcf7a)}.mode-btn{background:#0d1630;color:#dce8fb;border:1px solid #2a4a7a}.mode-btn.active{background:linear-gradient(100deg,#ff7a1a,#e6338f,#12b5c9);color:#fff;border-color:transparent}.mode-desc{font-size:12px;color:#9db4d6;margin:0 0 12px}.restart-btn{width:100%;font-size:17px}
  @media(max-width:600px){#xr-hud{gap:5px}.hud-card{min-width:70px;padding:7px 10px}.hud-value{font-size:20px}.mode-row{grid-template-columns:1fr}.end-box{padding:22px}}
</style>
</head>
<body>
<div id="xr-overlay" aria-live="polite">
  <div id="xr-hud">
    <div class="hud-card"><div class="hud-label">PUNTI</div><div id="d-score" class="hud-value">00000</div></div>
    <div class="hud-card"><div class="hud-label">TEMPO</div><div id="d-timer" class="hud-value">60</div></div>
    <div class="hud-card"><div class="hud-label">COMBO</div><div id="d-combo" class="hud-value">COMBO —</div></div>
    <div class="hud-card"><div class="hud-label">PRECISIONE</div><div id="d-accuracy" class="hud-value">100%</div></div>
  </div>
  <div id="xr-popup"></div>
  <div id="xr-end" class="hidden">
    <div class="end-box">
      <div class="end-kicker">PARTITA TERMINATA</div><h2>OTTIMO LAVORO</h2>
      <div id="end-score" class="end-score">0 PUNTI</div>
      <div class="end-stats"><div class="stat"><b id="end-acc">0%</b><span>PRECISIONE</span></div><div class="stat"><b id="end-hits">0</b><span>CENTRI</span></div><div class="stat"><b id="end-combo">x0</b><span>MAX COMBO</span></div></div>
      <div class="hud-label">SCEGLI MODALITÀ</div>
      <div class="mode-row"><button class="mode-btn active" data-mode="classic">CLASSIC</button><button class="mode-btn" data-mode="blitz">BLITZ</button><button class="mode-btn" data-mode="precision">PRECISION</button></div>
      <p id="mode-desc" class="mode-desc">60 secondi · combo e punteggio</p>
      <button id="restart-game" class="restart-btn">↻ RICOMINCIA</button>
    </div>
  </div>
</div>
<a-scene webxr="referenceSpaceType: local-floor; optionalFeatures: hit-test, bounded-floor, plane-detection, dom-overlay; overlayElement: #xr-overlay" xr-mode-ui="enabled:false" background="transparent:true" renderer="alpha:true;antialias:true" loading-screen="enabled:false">
  <a-entity id="rig">
    <a-entity id="cam" camera look-controls="touchEnabled:false" position="0 1.6 0">
      <a-text visible="false" id="score" value="00000" align="center" width=".8" color="#ffffff" position="-.62 .48 -1.02"></a-text>
      <a-text visible="false" id="timer" value="60" align="center" width=".48" color="#57ff9b" position=".62 .48 -1.02"></a-text>
      <a-text visible="false" id="combo" value="" align="center" width="1.0" color="#ffcf4a" position="0 .58 -1.02"></a-text>
      <a-text visible="false" id="accuracy" value="100%" align="center" width=".65" color="#9fe8ff" position="0 .39 -1.02"></a-text>
      <a-text visible="false" id="hud" value="" align="center" width="1.3" color="#9fe8ff" position="0 .30 -1.02"></a-text>
      <a-ring id="reticle" radius-inner=".008" radius-outer=".014" color="#57ffea" position="0 0 -1" visible="false"></a-ring>
      <a-plane id="flash" width="3" height="3" position="0 0 -.3" material="color:#ff204d;opacity:0;transparent:true;depthTest:false;shader:flat"></a-plane>
    </a-entity>
    <a-entity id="lc" laser-controls="hand:left" raycaster="far:15;objects:.clickable"></a-entity>
    <a-entity id="rc" laser-controls="hand:right" raycaster="far:15;objects:.clickable"></a-entity>
  </a-entity>
  <a-entity arc-world id="world">
