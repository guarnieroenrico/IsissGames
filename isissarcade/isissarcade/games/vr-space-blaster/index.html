<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Blaster AR — ISISS Arcade VR</title>
  <link rel="icon" type="image/png" href="../../assets/img/isiss-logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="../../assets/js/ar-common.js"></script>
  <script>
Arc.initOverlay({
  title: 'Space Blaster',
  subtitle: 'Le navi nemiche invadono la tua stanza. Difendila!',
  howto: [
    '<b>Trigger</b> (tienilo premuto): spara il laser dal controller.',
    '<b>Grip</b>: bomba nucleare (1 carica, ne ricevi una a ogni ondata).',
    'Spara anche ai <b>proiettili</b> nemici e ai <b>pacchi verdi</b> (+25 energia).',
    'Gira su te stesso: i nemici arrivano da ogni direzione. A / X = ricentra.',
    'Hai bisogno di spazio libero attorno a te.'
  ]
});

AFRAME.registerComponent('blaster-game', {
  init() {
    const THREE = AFRAME.THREE, self = this;
    this.root = new THREE.Group(); this.el.setObject3D('game', this.root);
    this.enemies = []; this.bolts = []; this.packs = []; this.fx = []; this.beams = [];
    this.held = { left: false, right: false, mouse: false }; this.cool = 0;
    this.hudEl = document.getElementById('hud'); this.msgEl = document.getElementById('msg'); this.flash = document.getElementById('flash');
    this.running = false; this.over = true;
    Arc.onStart(() => { self.running = true; self.newGame(); });
    Arc.onTrigger((ray, src) => { if (self.over) { if (self.running) self.newGame(); return; } self.held[src] = true; self.fire(ray); self.cool = 0.16; });
    Arc.onTriggerUp = src => { self.held[src] = false; };
    ['left', 'right'].forEach(h => document.getElementById(h === 'left' ? 'lc' : 'rc').addEventListener('gripdown', () => self.nuke()));
    window.addEventListener('keydown', e => { if (e.key === 'n') self.nuke(); });
  },

  head() { return Arc.inXR ? Arc.headLocal() : new (AFRAME.THREE.Vector3)(0, 1.6, 0); },

  newGame() {
    [...this.enemies, ...this.bolts, ...this.packs].forEach(o => this.root.remove(o.mesh));
    this.enemies = []; this.bolts = []; this.packs = [];
    this.hp = 100; this.score = 0; this.wave = 0; this.nukes = 1; this.queue = 0; this.spawnT = 0; this.waitT = 1.5; this.over = false;
    this.msgEl.setAttribute('value', ''); this.hud();
  },

  hud() {
    this.hudEl.setAttribute('value', `ENERGIA ${Math.max(0, Math.ceil(this.hp))}   PUNTI ${this.score}\nONDATA ${this.wave}   BOMBE ${this.nukes}`);
    this.hudEl.setAttribute('color', this.hp < 30 ? '#ff5050' : '#9ff');
  },
  say(t, ms) { this.msgEl.setAttribute('value', t); clearTimeout(this._mt); if (ms) this._mt = setTimeout(() => this.msgEl.setAttribute('value', ''), ms); },

  makeEnemy(type) {
    const THREE = AFRAME.THREE, g = new THREE.Group();
    const col = type === 'drone' ? 0xff007f : type === 'fighter' ? 0x00f0ff : 0xff3030;
    const mat = new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.55, flatShading: true });
    let r;
    if (type === 'drone') { r = 0.2; g.add(new THREE.Mesh(new THREE.OctahedronGeometry(r), mat)); }
    else if (type === 'fighter') {
      r = 0.28; const c = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.45, 6), mat); c.rotation.x = -Math.PI / 2; g.add(c);
      const w = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.02, 0.18), mat); w.position.z = 0.1; g.add(w);
    } else { r = 0.65; g.add(new THREE.Mesh(new THREE.IcosahedronGeometry(r, 1), mat)); const ring = new THREE.Mesh(new THREE.TorusGeometry(r * 1.3, 0.04, 8, 32), mat); ring.rotation.x = Math.PI / 2; g.add(ring); }
    const hp = type === 'drone' ? 1 : type === 'fighter' ? 2 : 22 + this.wave * 2;
    return { mesh: Arc.cast(g), type, hp, max: hp, r, fireT: Arc.rand(1.5, 3), ang: Arc.rand(0, 6.28), pos: g.position };
  },

  spawn() {
    const h = this.head(), boss = this.wave % 5 === 0 && this.bossPending;
    let type = boss ? 'boss' : (Math.random() < 0.35 + Math.min(0.3, this.wave * 0.04) ? 'fighter' : 'drone');
    if (boss) this.bossPending = false;
    const e = this.makeEnemy(type), a = Arc.rand(0, Math.PI * 2), d = Arc.rand(3.5, 4.8);
    e.pos.set(h.x + Math.cos(a) * d, Arc.rand(0.7, 2.6), h.z + Math.sin(a) * d);
    e.ang = Math.atan2(e.pos.z - h.z, e.pos.x - h.x); this.root.add(e.mesh); this.enemies.push(e);
  },

  fire(ray) {
    const THREE = AFRAME.THREE; let best = null, bt = 12;
    const test = (list, rad) => list.forEach(o => {
      const c = o.mesh.position, oc = c.clone().sub(ray.origin), t = oc.dot(ray.dir); if (t < 0.1 || t > bt) return;
      const d2 = oc.lengthSq() - t * t, r = (rad || o.r) + 0.05; if (d2 < r * r) { bt = t; best = o; }
    });
    test(this.enemies); test(this.packs, 0.2); test(this.bolts, 0.14);
    const end = ray.origin.clone().addScaledVector(ray.dir, bt === 12 ? 6 : bt);
    this.beam(ray.origin, end); Arc.beep(900, 0.09, 'square', 0.07, 300);
    if (!best) return;
    const o = best;
    if (this.packs.includes(o)) { this.hp = Math.min(100, this.hp + 25); this.kill(this.packs, o, 0x22ff88, 0.5); this.say('+25 ENERGIA', 800); Arc.beep(500, 0.2, 'sine', 0.2, 1000); }
    else if (this.bolts.includes(o)) this.kill(this.bolts, o, 0xffaa00, 0.5);
    else { o.hp--; this.explode(end, 0x00f0ff, 0.4); if (o.hp <= 0) { this.score += o.type === 'boss' ? 500 : o.type === 'fighter' ? 30 : 10; this.kill(this.enemies, o, 0xff8800, o.r * 3, true); } }
    this.hud();
  },

  kill(arr, o, col, size, drop) {
    arr.splice(arr.indexOf(o), 1); this.root.remove(o.mesh); this.explode(o.mesh.position, col, size);
    Arc.beep(120, 0.3, 'sawtooth', 0.18, 40);
    if (drop && Math.random() < (o.type === 'boss' ? 1 : 0.12)) this.dropPack(o.mesh.position);
  },

  dropPack(p) {
    const THREE = AFRAME.THREE, m = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.22, 0.22), new THREE.MeshStandardMaterial({ color: 0x22ff88, emissive: 0x22ff88, emissiveIntensity: 0.6 }));
    m.position.copy(p); m.position.y = Math.max(0.8, p.y); this.root.add(m); this.packs.push({ mesh: m, r: 0.2, life: 12 });
  },

  explode(p, col, size) {
    const THREE = AFRAME.THREE, m = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 8), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.9 }));
    m.position.copy(p); this.root.add(m); this.fx.push({ m, t: 0, size });
  },

  beam(a, b) {
    const THREE = AFRAME.THREE, L = a.distanceTo(b), m = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.012, 1), new THREE.MeshBasicMaterial({ color: 0x66ffcc }));
    m.scale.z = L; m.position.copy(a).lerp(b, 0.5); m.lookAt(b); this.root.add(m); this.beams.push({ m, t: 0.07 });
  },

  nuke() {
    if (this.over || this.nukes <= 0 || !this.running) return;
    this.nukes--; Arc.beep(60, 1, 'sawtooth', 0.4, 20); Arc.haptic('left', 1, 300); Arc.haptic('right', 1, 300);
    [...this.enemies].forEach(e => { e.hp -= e.type === 'boss' ? 10 : 99; if (e.hp <= 0) { this.score += 10; this.kill(this.enemies, e, 0xffffff, e.r * 4); } });
    this.bolts.slice().forEach(b => this.kill(this.bolts, b, 0xffffff, 0.4)); this.say('BOMBA NUCLEARE!', 900); this.hud();
  },

  hurt(n) {
    this.hp -= n; Arc.beep(90, 0.3, 'sawtooth', 0.3, 40); Arc.haptic('left', 1, 150); Arc.haptic('right', 1, 150);
    this.flash.setAttribute('material', 'opacity', 0.5); this.flashT = 0.4; this.hud();
    if (this.hp <= 0) { this.over = true; const rec = Math.max(this.score, parseInt(localStorage.getItem('isiss_vr_blaster_best') || '0', 10)); try { localStorage.setItem('isiss_vr_blaster_best', rec); } catch (e) {} this.say(`GAME OVER\nPunti ${this.score}  ·  Record ${rec}\nTrigger per ricominciare`); }
  },

  tick(time, dtms) {
    if (!this.running) return;
    const dt = Math.min(dtms / 1000, 0.05), THREE = AFRAME.THREE; if (dt <= 0) return;
    // effetti
    this.fx = this.fx.filter(f => { f.t += dt * 2.5; f.m.scale.setScalar(1 + f.t * f.size * 4); f.m.material.opacity = Math.max(0, 0.9 - f.t); if (f.t >= 0.9) { this.root.remove(f.m); return false; } return true; });
    this.beams = this.beams.filter(b => { b.t -= dt; if (b.t <= 0) { this.root.remove(b.m); return false; } return true; });
    if (this.flashT > 0) { this.flashT -= dt; this.flash.setAttribute('material', 'opacity', Math.max(0, this.flashT)); }
    if (this.over) return;

    const h = this.head();
    // fuoco continuo
    this.cool -= dt;
    if (this.cool <= 0) for (const s of ['left', 'right']) if (this.held[s] && Arc.inXR) { this.fire(Arc.handRay(s)); this.cool = 0.16; Arc.haptic(s, 0.25, 20); }

    // ondate
    if (this.queue === 0 && this.enemies.length === 0) {
      this.waitT -= dt;
      if (this.waitT <= 0) { this.wave++; this.queue = 3 + this.wave * 2; this.bossPending = this.wave % 5 === 0; if (this.bossPending) this.queue += 1; this.nukes = Math.min(3, this.nukes + (this.wave > 1 ? 1 : 0)); this.waitT = 3; this.say(this.bossPending ? `ONDATA ${this.wave}\nBOSS IN ARRIVO!` : `ONDATA ${this.wave}`, 1800); Arc.beep(300, 0.4, 'triangle', 0.2, 600); this.hud(); }
    }
    if (this.queue > 0) { this.spawnT -= dt; if (this.spawnT <= 0) { this.spawn(); this.queue--; this.spawnT = Math.max(0.6, 1.6 - this.wave * 0.08); } }

    // nemici
    for (const e of [...this.enemies]) {
      const p = e.pos, to = h.clone().sub(p), d = to.length();
      if (e.type === 'drone') {
        p.addScaledVector(to.normalize(), (0.55 + this.wave * 0.04) * dt); p.y += Math.sin(time / 400 + e.ang) * 0.2 * dt;
        if (d < 0.4) { this.kill(this.enemies, e, 0xff007f, 0.6); this.hurt(10); continue; }
      } else {
        const want = e.type === 'boss' ? 2.8 : 2.2, cur = Math.hypot(p.x - h.x, p.z - h.z);
        e.ang += dt * (e.type === 'boss' ? 0.25 : 0.4); const rr = cur + (want - cur) * Math.min(1, dt * 0.8);
        p.x = h.x + Math.cos(e.ang) * rr; p.z = h.z + Math.sin(e.ang) * rr;
        p.y += ((1.5 + Math.sin(time / 900 + e.ang * 3) * 0.6) - p.y) * dt;
        e.fireT -= dt;
        if (e.fireT <= 0 && d < 4) { e.fireT = e.type === 'boss' ? 1.4 : Arc.rand(2, 3.5) - this.wave * 0.05; this.shootBolt(p, h, e.type === 'boss' ? 3 : 1); }
      }
      e.mesh.lookAt(h.x, p.y, h.z); if (e.type === 'boss') e.mesh.rotation.y += time / 700;
    }
    // proiettili nemici
    for (const b of [...this.bolts]) {
      b.mesh.position.addScaledVector(b.v, dt); b.life -= dt;
      if (b.mesh.position.distanceTo(new THREE.Vector3(h.x, h.y - 0.1, h.z)) < 0.3) { this.kill(this.bolts, b, 0xffaa00, 0.5); this.hurt(10); }
      else if (b.life <= 0) { this.bolts.splice(this.bolts.indexOf(b), 1); this.root.remove(b.mesh); }
    }
    for (const k of [...this.packs]) { k.life -= dt; k.mesh.rotation.y += dt; if (k.life <= 0) { this.packs.splice(this.packs.indexOf(k), 1); this.root.remove(k.mesh); } }
  },

  shootBolt(from, h, n) {
    const THREE = AFRAME.THREE;
    for (let i = 0; i < n; i++) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffaa00 }));
      m.position.copy(from); const dir = new THREE.Vector3(h.x, h.y - 0.1, h.z).sub(from).normalize();
      if (n > 1) dir.x += (i - 1) * 0.12;
      this.root.add(m); this.bolts.push({ mesh: m, r: 0.1, v: dir.normalize().multiplyScalar(1.8 + this.wave * 0.05), life: 6 });
    }
    Arc.beep(500, 0.15, 'sawtooth', 0.08, 200);
  }
});
  </script>
</head>
<body>
<a-scene webxr="referenceSpaceType: local-floor; optionalFeatures: hit-test"
         xr-mode-ui="enabled: false" background="transparent: true" renderer="alpha: true; antialias: true"
         cursor="rayOrigin: mouse" raycaster="objects: .clickable" loading-screen="enabled: false">
  <a-entity id="rig">
    <a-entity id="cam" camera look-controls="touchEnabled: false" position="0 1.6 0">
      <!-- HUD fissato alla testa + lampo rosso quando vieni colpito -->
      <a-text id="hud" value="" align="center" width="1.3" color="#99ffff" position="0 -0.32 -0.9"></a-text>
      <a-plane id="flash" width="3" height="3" position="0 0 -0.3" material="color: #ff0000; opacity: 0; transparent: true; depthTest: false; shader: flat"></a-plane>
    </a-entity>
    <a-entity id="lc" laser-controls="hand: left" raycaster="far: 8; objects: .clickable"></a-entity>
    <a-entity id="rc" laser-controls="hand: right" raycaster="far: 8; objects: .clickable"></a-entity>
  </a-entity>
  <a-entity arc-world id="world">
    <a-entity light="type: ambient; intensity: 0.8; color: #ffffff"></a-entity>
    <a-entity light="type: point; intensity: 1; distance: 12; color: #ffffff" position="0 2.5 0"></a-entity>
    <a-plane class="preview-only" rotation="-90 0 0" position="0 -0.01 0" width="14" height="14" material="color: #0a0f24"></a-plane>
    <a-text id="msg" value="" align="center" width="3" color="#ffd400" position="0 1.7 -1.8"></a-text>
    <a-entity blaster-game></a-entity>
  </a-entity>
</a-scene>
</body>
</html>
