<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ISISS Matese — Logo Blaster MR</title>
<link rel="icon" type="image/png" href="../../assets/img/isiss-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="../../assets/js/ar-common.js"></script>
<script>
Arc.initOverlay({
  title:'ISISS Matese Logo Blaster',
  subtitle:'Spara al logo ISISS Matese nella tua stanza.',
  howto:[
    '<b>Trigger</b>: spara al logo con il blaster.',
    'Il logo si muove da solo: non devi premere altri pulsanti.',
    'Fai più centri consecutivi per aumentare la combo.',
    'A / X ricentra solo se ne hai bisogno.',
    'Gioca in una stanza libera e ben illuminata.'
  ]
});

AFRAME.registerComponent('blaster-game', {
  init(){
    const T=AFRAME.THREE;
    this.T=T; this.root=new T.Group(); this.el.setObject3D('game',this.root);
    this.target=null; this.running=false; this.countdown=false; this.finished=false;
    this.score=0; this.combo=0; this.maxCombo=0; this.shots=0; this.hits=0; this.timeLeft=60; this.startAt=0; this.lastShot=0;
    this.vel=new T.Vector3(); this.goal=new T.Vector3(); this.tmp=new T.Vector3(); this.tmp2=new T.Vector3();
    this.beams=[]; this.fx=[]; this.guns={left:null,right:null}; this.recoil={left:0,right:0};
    this.msg=document.getElementById('msg'); this.hud=document.getElementById('hud'); this.scoreEl=document.getElementById('score');
    this.timerEl=document.getElementById('timer'); this.comboEl=document.getElementById('combo'); this.accuracyEl=document.getElementById('accuracy');
    this.flashEl=document.getElementById('flash');
    this.popupScale=0; this.popupLife=0;
    this.makeTarget(); this.makeGuns();
    Arc.onStart(()=>this.begin());
    Arc.onTrigger((ray,hand)=>this.shoot(ray,hand));
    ['left','right'].forEach(h=>document.getElementById(h==='left'?'lc':'rc').addEventListener('gripdown',()=>this.recenter()));
    window.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r')this.recenter()});
  },

  makeTarget(){
    const T=this.T;
    const tex=new T.TextureLoader().load('../../assets/img/isiss-logo.png');
    tex.colorSpace=T.SRGBColorSpace;
    this.target=new T.Mesh(new T.PlaneGeometry(.72,.72),new T.MeshBasicMaterial({map:tex,transparent:true,side:T.DoubleSide,alphaTest:.05,depthWrite:false}));
    this.target.visible=false; this.root.add(this.target);
    this.ring=new T.Mesh(new T.RingGeometry(.39,.42,64),new T.MeshBasicMaterial({color:0x55ddff,transparent:true,opacity:.82,side:T.DoubleSide,depthWrite:false}));
    this.ring.position.z=.006; this.target.add(this.ring);
    this.ring2=new T.Mesh(new T.RingGeometry(.46,.475,64),new T.MeshBasicMaterial({color:0xff3fd4,transparent:true,opacity:.38,side:T.DoubleSide,depthWrite:false}));
    this.ring2.position.z=.008; this.target.add(this.ring2);
  },

  makeGuns(){
    const T=this.T;
    ['left','right'].forEach(hand=>{
      const el=document.getElementById(hand==='left'?'lc':'rc');
      const g=new T.Group();
      const body=new T.Mesh(new T.BoxGeometry(.075,.11,.25),new T.MeshBasicMaterial({color:0x16223b})); body.position.set(0,-.025,-.10); g.add(body);
      const top=new T.Mesh(new T.BoxGeometry(.085,.028,.16),new T.MeshBasicMaterial({color:0x38e7ff})); top.position.set(0,.042,-.14); g.add(top);
      const grip=new T.Mesh(new T.BoxGeometry(.055,.13,.065),new T.MeshBasicMaterial({color:0x34415f})); grip.position.set(0,-.105,-.01); grip.rotation.x=-.18; g.add(grip);
      const muzzle=new T.Mesh(new T.CylinderGeometry(.026,.032,.025,16),new T.MeshBasicMaterial({color:0xffffff})); muzzle.rotation.x=Math.PI/2; muzzle.position.z=-.245; g.add(muzzle);
      const core=new T.Mesh(new T.SphereGeometry(.018,12,12),new T.MeshBasicMaterial({color:0x7fffff})); core.position.z=-.265; g.add(core);
      const flash=new T.Mesh(new T.SphereGeometry(.055,10,10),new T.MeshBasicMaterial({color:0x8fffff,transparent:true,opacity:0,depthWrite:false})); flash.position.z=-.29; g.add(flash);
      el.object3D.add(g); this.guns[hand]={g,flash};
    });
  },

  head(){return Arc.inXR?Arc.headLocal():new this.T.Vector3(0,1.6,0)},
  recenter(){if(Arc.inXR)Arc.recenter(); const h=this.head(); this.target.position.set(h.x,h.y-.1,h.z-1.7); this.setGoal(1.0);},

  begin(){
    if(this.countdown)return;
    this.countdown=true; this.finished=false; this.running=false;
    this.score=0;this.combo=0;this.maxCombo=0;this.shots=0;this.hits=0;this.timeLeft=60;
    this.target.visible=false; this.hud.object3D.visible=true; this.flashEl.setAttribute('material','opacity:0');
    this.updateHUD(); this.countdownStep(0);
  },

  countdownStep(i){
    const seq=['3','2','1','VIA!'];
    if(i>=seq.length){this.running=true;this.countdown=false;this.startAt=performance.now();this.spawnTarget(true);this.popup('CENTRA IL LOGO!','#ffd84d',1.15,1100);this.sound('start');return;}
    const s=seq[i]; this.popup(s,s==='VIA!'?'#57ff9b':'#ffffff',s==='VIA!'?1.55:1.35,650); this.sound(s==='VIA!'?'go':'count');
    setTimeout(()=>this.countdownStep(i+1),s==='VIA!'?650:700);
  },

  spawnTarget(first){
    const h=this.head(),a=Math.random()*Math.PI*2,r=first?1.55:1.1+Math.random()*1.6;
    this.target.position.set(h.x+Math.sin(a)*r,.9+Math.random()*1.0,h.z+Math.cos(a)*r);
    this.target.visible=true; this.target.scale.setScalar(.02); this.setGoal(.9+Math.random()*2.0);
  },

  setGoal(minRadius){
    const h=this.head(),a=Math.random()*Math.PI*2,r=minRadius+Math.random()*1.2;
    this.goal.set(h.x+Math.sin(a)*r,.82+Math.random()*1.15,h.z+Math.cos(a)*r);
    this.nextGoal=performance.now()+650+Math.random()*1000;
  },

  popup(text,color,scale,duration){
    this.msg.setAttribute('value',text); this.msg.setAttribute('color',color); this.popupScale=.15; this.popupTargetScale=scale; this.popupLife=duration/1000;
    this.msg.object3D.scale.setScalar(.15);
  },

  updateHUD(){
    const acc=this.shots?Math.round(this.hits/this.shots*100):100;
    this.scoreEl.setAttribute('value',String(this.score).padStart(5,'0'));
    this.timerEl.setAttribute('value',String(Math.max(0,Math.ceil(this.timeLeft))));
    this.comboEl.setAttribute('value',this.combo>1?'COMBO x'+Math.min(this.combo,5):'');
    this.accuracyEl.setAttribute('value',acc+'%');
  },

  shoot(ray,hand){
    if(!this.running||!this.target.visible)return;
    const now=performance.now(); if(now-this.lastShot<110)return; this.lastShot=now; this.shots++;
    const origin=ray.origin.clone(),dir=ray.dir.clone().normalize(),center=this.target.getWorldPosition(this.tmp);
    const to=center.clone().sub(origin),t=to.dot(dir),closest=origin.clone().addScaledVector(dir,Math.max(0,t));
    const hit=t>0&&t<15&&closest.distanceTo(center)<.43;
    const end=origin.clone().addScaledVector(dir,hit?t:7); this.beam(origin,end,hit); this.fireGun(hand);
    if(hit){
      this.hits++;this.combo++;this.maxCombo=Math.max(this.maxCombo,this.combo);
      const pts=100*Math.min(this.combo,5);this.score+=pts;
      this.popup('+'+pts+'  CENTRO!',this.combo>=3?'#57ff9b':'#ffffff',1.0+Math.min(this.combo,5)*.07,700);
      this.explode(center);this.sound('hit');this.pulse(hand);this.flash(.16);
      this.setGoal(1.1);this.vel.multiplyScalar(.25);
    }else{
      this.combo=0;this.popup('MISS!','#ff6480',.78,420);this.sound('miss');
    }
    this.updateHUD();
  },

  fireGun(hand){
    const g=this.guns[hand];if(!g)return;g.g.position.z=.045;g.flash.material.opacity=1;this.recoil[hand]=.09;
  },
  pulse(hand){Arc.haptic(hand||'right',.75,55)},
  flash(seconds){this.flashTime=seconds;this.flashEl.setAttribute('material','opacity:.16')},

  beam(a,b,hit){
    const T=this.T,len=a.distanceTo(b);
    const m=new T.Mesh(new T.CylinderGeometry(hit?.018:.009,hit?.018:.009,len,8),new T.MeshBasicMaterial({color:hit?0x70fff0:0xff385f,transparent:true,opacity:.95,depthWrite:false}));
    m.position.copy(a).lerp(b,.5);m.lookAt(b);this.root.add(m);this.beams.push({m,life:.13});
  },

  explode(p){
    const T=this.T;
    for(let i=0;i<20;i++){
      const m=new T.Mesh(new T.SphereGeometry(.014+Math.random()*.025,7,7),new T.MeshBasicMaterial({color:i%2?0x29eaff:0xff3bd4,transparent:true,opacity:1,depthWrite:false}));
      m.position.copy(p);const v=new T.Vector3(Math.random()-.5,Math.random()-.45,Math.random()-.5).normalize().multiplyScalar(.7+Math.random()*1.3);this.root.add(m);this.fx.push({m,v,life:.45});
    }
  },

  sound(type){try{
    if(type==='hit'){Arc.beep(480,.06,'square',.08,1100);setTimeout(()=>Arc.beep(1250,.11,'sine',.05,1750),35)}
    else if(type==='miss')Arc.beep(120,.08,'sawtooth',.035,70);
    else if(type==='count')Arc.beep(520,.08,'sine',.045,700);
    else if(type==='go'){Arc.beep(720,.09,'square',.06,1100);setTimeout(()=>Arc.beep(1100,.13,'square',.05,1650),70)}
    else Arc.beep(330,.16,'sine',.05,880);
  }catch(e){}}
,
  finish(){
    if(this.finished)return;this.finished=true;this.running=false;
    const acc=this.shots?Math.round(this.hits/this.shots*100):0;
    this.popup('TEMPO SCADUTO!','#ffcf4a',1.25,2500);
    setTimeout(()=>this.popup(this.score+' PUNTI  •  '+acc+'% PRECISIONE','#ffffff',.8,2800),650);
    this.sound('go');
  },

  tick(time,dtms){
    const dt=Math.min(dtms/1000,.05),now=performance.now();
    if(this.running){
      this.timeLeft=Math.max(0,60-(now-this.startAt)/1000);this.updateHUD();if(this.timeLeft<=0){this.finish();return;}
    }
    if(this.popupLife>0){this.popupLife-=dt;this.popupScale+=(this.popupTargetScale-this.popupScale)*Math.min(1,dt*14);this.msg.object3D.scale.setScalar(this.popupScale);if(this.popupLife<=0)this.msg.setAttribute('value','');}
    if(this.flashTime>0){this.flashTime-=dt;if(this.flashTime<=0)this.flashEl.setAttribute('material','opacity:0');}
    for(const h of ['left','right']){if(this.recoil[h]>0){this.recoil[h]-=dt;const g=this.guns[h];if(g){g.g.position.z=Math.max(0,this.recoil[h]/.09*.045);g.flash.material.opacity=Math.max(0,this.recoil[h]/.09)}}}
    this.beams=this.beams.filter(b=>{b.life-=dt;b.m.material.opacity=Math.max(0,b.life/.13);if(b.life<=0){this.root.remove(b.m);b.m.geometry.dispose();b.m.material.dispose();return false}return true});
    this.fx=this.fx.filter(x=>{x.life-=dt;x.m.position.addScaledVector(x.v,dt);x.v.y-=1.5*dt;x.m.material.opacity=Math.max(0,x.life/.45);if(x.life<=0){this.root.remove(x.m);x.m.geometry.dispose();x.m.material.dispose();return false}return true});
    if(!this.running||!this.target.visible)return;
    const h=this.head();
    if(now>this.nextGoal)this.setGoal(1.0);
    this.tmp.copy(this.goal).sub(this.target.position);
    if(this.tmp.length()>.03){this.tmp.normalize();this.vel.lerp(this.tmp.multiplyScalar(.72),1-Math.exp(-dt*3.5));this.target.position.addScaledVector(this.vel,dt);}
    if(this.target.position.distanceTo(h)>3.8)this.setGoal(1.0);
    this.target.position.y=this.T.MathUtils.clamp(this.target.position.y,.72,2.05);
    this.target.lookAt(h.x,this.target.position.y,h.z);
    this.ring.rotation.z+=dt*2.5;this.ring2.rotation.z-=dt*1.5;
    const pulse=1+Math.sin(time/100)*.035;this.target.scale.lerp(this.tmp2.set(pulse,pulse,pulse),Math.min(1,dt*9));
  }
});
</script>
</head>
<body>
<a-scene webxr="referenceSpaceType: local-floor; optionalFeatures: hit-test, bounded-floor, plane-detection" xr-mode-ui="enabled:false" background="transparent:true" renderer="alpha:true;antialias:true" loading-screen="enabled:false">
  <a-entity id="rig">
    <a-entity id="cam" camera look-controls="touchEnabled:false" position="0 1.6 0">
      <a-text id="score" value="00000" align="center" width=".8" color="#ffffff" position="-.62 .48 -1.02"></a-text>
      <a-text id="timer" value="60" align="center" width=".48" color="#57ff9b" position=".62 .48 -1.02"></a-text>
      <a-text id="combo" value="" align="center" width="1.0" color="#ffcf4a" position="0 .58 -1.02"></a-text>
      <a-text id="accuracy" value="100%" align="center" width=".65" color="#9fe8ff" position="0 .39 -1.02"></a-text>
      <a-text id="hud" value="" align="center" width="1.3" color="#9fe8ff" position="0 .30 -1.02"></a-text>
      <a-ring id="reticle" radius-inner=".008" radius-outer=".014" color="#57ffea" position="0 0 -1" visible="false"></a-ring>
      <a-plane id="flash" width="3" height="3" position="0 0 -.3" material="color:#ff204d;opacity:0;transparent:true;depthTest:false;shader:flat"></a-plane>
    </a-entity>
    <a-entity id="lc" laser-controls="hand:left" raycaster="far:15;objects:.clickable"></a-entity>
    <a-entity id="rc" laser-controls="hand:right" raycaster="far:15;objects:.clickable"></a-entity>
  </a-entity>
  <a-entity arc-world id="world">
    <a-entity light="type:ambient;intensity:.8;color:#ffffff"></a-entity>
    <a-text id="msg" value="" align="center" width="3" color="#ffd400" position="0 1.7 -1.8"></a-text>
    <a-entity blaster-game></a-entity>
  </a-entity>
</a-scene>
</body>
</html>
