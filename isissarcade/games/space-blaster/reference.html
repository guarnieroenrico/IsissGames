<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ISISS Matese — Orientamento in realtà mista</title>
  <style>
    :root{--navy:#0d1630;--ink:#f4f6fb;--muted:#b4bfd6;--orange:#ff7a1a;--pink:#e6338f;--teal:#12b5c9;--green:#2fcf7a}
    html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--navy);color:var(--ink)}
    body{display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
    .panel{width:min(720px,100%);display:grid;grid-template-columns:minmax(120px,220px) 1fr;gap:28px;align-items:center;padding:28px;border-radius:28px;background:#131d3d;box-shadow:0 24px 70px rgba(0,0,0,.45)}
    .panel img{width:100%;height:auto;display:block}
    h1{margin:0 0 10px;font-size:clamp(26px,5vw,40px);line-height:1.1}
    p{margin:0 0 18px;color:var(--muted);line-height:1.55;max-width:46ch}
    button{border:0;border-radius:16px;padding:15px 22px;font-size:17px;font-weight:800;cursor:pointer;color:#0d1630;background:linear-gradient(100deg,var(--orange),var(--pink) 45%,var(--teal) 80%,var(--green))}
    button:focus-visible{outline:3px solid #fff;outline-offset:3px}
    button:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.6)}
    #status{margin-top:14px;font-size:14px;color:var(--muted);min-height:22px}
    .hidden{display:none}
    @media (max-width:560px){.panel{grid-template-columns:1fr;text-align:center}.panel img{max-width:180px;margin:0 auto}p{margin-inline:auto}}
  </style>
</head>
<body>
  <main class="panel" id="ui">
    <img src="./logo.png" alt="Logo ISISS Matese">
    <div>
      <h1>Il logo è già nella tua stanza</h1>
      <p>Entra nella realtà mista: il logo compare da solo, si muove nello spazio, evita pareti e mobili e reagisce quando ti avvicini o lo tocchi.</p>
      <button id="start" disabled>Controllo WebXR…</button>
      <div id="status" role="status">Sto verificando il supporto del visore…</div>
    </div>
  </main>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

    const startBtn = document.querySelector("#start");
    const statusEl = document.querySelector("#status");
    const ui = document.querySelector("#ui");
    const setStatus = t => statusEl.textContent = t;

    /* ---------- Parametri regolabili ---------- */
    const CFG = {
      size: 0.6,            // larghezza del logo in metri
      spawnDelay: 1.2,      // secondi prima che compaia
      spawnDistance: 1.6,   // distanza iniziale davanti a te
      minY: 0.45, maxY: 1.9,// altezza di volo
      speed: 0.35,          // velocità di crociera (m/s)
      fleeSpeed: 0.95,      // velocità quando si scansa
      roamRadius: 2.8,      // raggio massimo attorno a te
      fallbackRadius: 2.4,  // area se il visore non ha i confini
      avoidMargin: 0.38,    // distanza minima da pareti/mobili
      personalSpace: 0.8,   // distanza testa → si scansa
      handSpace: 0.45       // distanza controller → si scansa
    };

    /* ---------- Stato ---------- */
    let scene, camera, renderer, pivot, logo, shadow;
    let session = null, last = null, startTime = 0;
    const S = {
      spawned:false, spawnT:0, wp:new THREE.Vector3(), pause:0,
      vel:new THREE.Vector3(), flee:0, jumpT:-1, spinT:-1, yaw:0,
      center:new THREE.Vector3(), poly:[], planes:[]
    };
    const head = new THREE.Vector3(), fwd = new THREE.Vector3();
    const tmp = new THREE.Vector3(), tmp2 = new THREE.Vector3();
    const controllers = [];

    /* ---------- Utilità ---------- */
    const rand = (a,b) => a + Math.random()*(b-a);
    const easeOutBack = t => { const c=1.70158; return 1 + (c+1)*Math.pow(t-1,3) + c*Math.pow(t-1,2); };
    const angDiff = (a,b) => Math.atan2(Math.sin(b-a), Math.cos(b-a));

    function pointInPoly(x, z, poly){
      let inside = false;
      for (let i=0,j=poly.length-1;i<poly.length;j=i++){
        const a=poly[i], b=poly[j];
        if ((a.z>z)!==(b.z>z) && x < (b.x-a.x)*(z-a.z)/(b.z-a.z)+a.x) inside=!inside;
      }
      return inside;
    }
    function inArea(x, z){
      if (S.poly.length >= 3) return pointInPoly(x, z, S.poly);
      return Math.hypot(x-S.center.x, z-S.center.z) < CFG.fallbackRadius;
    }

    /* ---------- Piani rilevati nella stanza (pareti, tavoli, pavimento) ---------- */
    function updatePlanes(frame, refSpace){
      S.planes.length = 0;
      const set = frame.detectedPlanes;
      if (!set) return;
      for (const plane of set){
        const pose = frame.getPose(plane.planeSpace, refSpace);
        if (!pose) continue;
        const m = new THREE.Matrix4().fromArray(pose.transform.matrix);
        let minX=1e9,maxX=-1e9,minZ=1e9,maxZ=-1e9;
        for (const p of plane.polygon){
          if (p.x<minX) minX=p.x; if (p.x>maxX) maxX=p.x;
          if (p.z<minZ) minZ=p.z; if (p.z>maxZ) maxZ=p.z;
        }
        S.planes.push({
          inv: m.clone().invert(),
          normal: new THREE.Vector3(m.elements[4], m.elements[5], m.elements[6]).normalize(),
          minX, maxX, minZ, maxZ
        });
      }
    }
    // Se apply=true spinge fuori il logo e gli toglie la velocità verso il piano.
    function planeCollision(pos, vel, margin, apply){
      let hit = false;
      for (const pl of S.planes){
        tmp2.copy(pos).applyMatrix4(pl.inv);
        if (Math.abs(tmp2.y) < margin &&
            tmp2.x > pl.minX-margin && tmp2.x < pl.maxX+margin &&
            tmp2.z > pl.minZ-margin && tmp2.z < pl.maxZ+margin){
          hit = true;
          if (apply){
            const side = tmp2.y >= 0 ? 1 : -1;
            const n = tmp.copy(pl.normal).multiplyScalar(side);
            pos.addScaledVector(n, (margin - Math.abs(tmp2.y)) * 0.25);
            const into = vel.dot(n);
            if (into < 0) vel.addScaledVector(n, -into);
            S.pause = Math.min(S.pause, 0.2);
            S.wp.copy(pos).addScaledVector(n, 1.0); // si sposta lontano dall'ostacolo
            S.wp.y = THREE.MathUtils.clamp(S.wp.y, CFG.minY, CFG.maxY);
          }
        }
      }
      return hit;
    }

    /* ---------- Scelta della prossima meta ---------- */
    function pickWaypoint(){
      for (let i=0;i<40;i++){
        const a = rand(0, Math.PI*2), r = rand(0.8, CFG.roamRadius);
        const x = head.x + Math.cos(a)*r, z = head.z + Math.sin(a)*r, y = rand(CFG.minY+0.15, CFG.maxY-0.3);
        if (!inArea(x, z)) continue;
        tmp.set(x, y, z);
        if (planeCollision(tmp, S.vel, CFG.avoidMargin*1.6, false)) continue;
        S.wp.copy(tmp);
        return;
      }
      S.wp.set(head.x, 1.2, head.z).addScaledVector(fwd, 1.2); // piano B: davanti a te
    }

    /* ---------- Creazione scena ---------- */
    function init(){
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 30);

      renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
      renderer.setSize(innerWidth, innerHeight);
      renderer.setClearColor(0x000000, 0);
      renderer.xr.enabled = true;
      renderer.xr.setReferenceSpaceType("local-floor");
      document.body.appendChild(renderer.domElement);

      // Logo
      const tex = new THREE.TextureLoader().load("./logo.png", t => {
        logo.scale.y = t.image.height / t.image.width;
      });
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      logo = new THREE.Mesh(
        new THREE.PlaneGeometry(CFG.size, CFG.size),
        new THREE.MeshBasicMaterial({map:tex, transparent:true, alphaTest:0.04, side:THREE.DoubleSide})
      );
      pivot = new THREE.Group();
      pivot.add(logo);
      pivot.rotation.order = "YXZ";
      pivot.visible = false;
      scene.add(pivot);

      // Ombra morbida sul pavimento: dà l'impressione che il logo sia davvero nella stanza
      const c = document.createElement("canvas"); c.width = c.height = 128;
      const g = c.getContext("2d");
      const grad = g.createRadialGradient(64,64,4,64,64,64);
      grad.addColorStop(0,"rgba(0,0,0,.55)"); grad.addColorStop(1,"rgba(0,0,0,0)");
      g.fillStyle = grad; g.fillRect(0,0,128,128);
      shadow = new THREE.Mesh(
        new THREE.PlaneGeometry(1,1).rotateX(-Math.PI/2),
        new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c), transparent:true, depthWrite:false})
      );
      shadow.visible = false;
      scene.add(shadow);

      // Controller / mani: tocco = salto e giro
      for (let i=0;i<2;i++){
        const ctl = renderer.xr.getController(i);
        ctl.userData.connected = false;
        ctl.addEventListener("connected", () => ctl.userData.connected = true);
        ctl.addEventListener("disconnected", () => ctl.userData.connected = false);
        ctl.addEventListener("select", onSelect);
        scene.add(ctl);
        controllers.push(ctl);
      }

      renderer.setAnimationLoop(render);
      addEventListener("resize", () => {
        camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
    }

    function onSelect(){
      if (!S.spawned) return;
      S.jumpT = 0; S.spinT = 0;
    }

    /* ---------- Sessione AR ---------- */
    async function startAR(){
      if (!renderer) init();
      try {
        session = await navigator.xr.requestSession("immersive-ar", {
          optionalFeatures: ["local-floor","bounded-floor","plane-detection","mesh-detection","hit-test","anchors","hand-tracking"]
        });
      } catch (e) {
        setStatus("Impossibile avviare la sessione AR: " + e.message);
        return;
      }
      await renderer.xr.setSession(session);
      ui.classList.add("hidden");
      last = null; startTime = 0;
      Object.assign(S, {spawned:false, spawnT:0, pause:0, flee:0, jumpT:-1, spinT:-1, planes:[], poly:[]});
      S.vel.set(0,0,0);
      pivot.visible = false; shadow.visible = false;
      session.addEventListener("end", () => {
        session = null;
        ui.classList.remove("hidden");
        setStatus("Sessione terminata. Puoi rientrare quando vuoi.");
        startBtn.textContent = "Rientra nell'esperienza";
      }, {once:true});
    }

    /* ---------- Aggiornamento per frame ---------- */
    function update(dt, t, frame){
      const refSpace = renderer.xr.getReferenceSpace();
      const xrCam = renderer.xr.getCamera();
      head.setFromMatrixPosition(xrCam.matrixWorld);
      xrCam.getWorldDirection(fwd); fwd.y = 0;
      if (fwd.lengthSq() < 1e-4) fwd.set(0,0,-1);
      fwd.normalize();

      if (!startTime) startTime = t;

      // Confini della stanza (guardian / spazio configurato)
      if (!S.poly.length && refSpace && refSpace.boundsGeometry && refSpace.boundsGeometry.length >= 3){
        S.poly = Array.from(refSpace.boundsGeometry, p => ({x:p.x, z:p.z}));
      }
      updatePlanes(frame, refSpace);

      // Comparsa automatica, senza bisogno di controller
      if (!S.spawned){
        if (t - startTime < CFG.spawnDelay) return;
        S.center.copy(head);
        pivot.position.set(head.x + fwd.x*CFG.spawnDistance, 1.2, head.z + fwd.z*CFG.spawnDistance);
        S.yaw = Math.atan2(head.x - pivot.position.x, head.z - pivot.position.z);
        pickWaypoint();
        S.spawned = true; S.spawnT = 0;
        pivot.visible = true; shadow.visible = true;
        setStatus("");
      }

      // Animazione di entrata
      S.spawnT = Math.min(1, S.spawnT + dt/0.9);
      const grow = easeOutBack(S.spawnT);

      // Reazione a testa e mani
      const pos = pivot.position;
      let threat = null, threatDist = Infinity;
      const dHead = Math.hypot(pos.x-head.x, pos.z-head.z);
      if (dHead < CFG.personalSpace && Math.abs(pos.y-head.y) < 1.0){ threat = head; threatDist = dHead; }
      for (const ctl of controllers){
        if (!ctl.userData.connected) continue;
        tmp.setFromMatrixPosition(ctl.matrixWorld);
        const d = tmp.distanceTo(pos);
        if (d < CFG.handSpace && d < threatDist){ threat = tmp.clone(); threatDist = d; }
      }
      if (threat && S.flee <= 0){
        S.flee = 1.1;
        tmp.copy(pos).sub(threat); tmp.y = rand(-0.1, 0.25); tmp.normalize();
        S.wp.copy(pos).addScaledVector(tmp, 1.4);
        S.wp.y = THREE.MathUtils.clamp(S.wp.y, CFG.minY, CFG.maxY);
        if (!inArea(S.wp.x, S.wp.z)) S.wp.set(S.center.x, S.wp.y, S.center.z);
        S.pause = 0;
      }
      S.flee = Math.max(0, S.flee - dt);

      // Se ti allontani troppo, ti raggiunge
      if (dHead > CFG.roamRadius + 0.8 && S.flee <= 0){ pickWaypoint(); S.pause = 0; }

      // Movimento verso la meta
      const speed = S.flee > 0 ? CFG.fleeSpeed : CFG.speed;
      tmp.copy(S.wp).sub(pos);
      const dist = tmp.length();
      if (S.pause > 0){
        S.pause -= dt;
        S.vel.multiplyScalar(Math.exp(-dt*3));
      } else if (dist < 0.15){
        S.pause = rand(1.5, 3.5);
        pickWaypoint();
      } else {
        tmp.normalize().multiplyScalar(speed);
        S.vel.lerp(tmp, 1 - Math.exp(-dt*2.2));
      }
      pos.addScaledVector(S.vel, dt);

      // Interazione con la stanza
      planeCollision(pos, S.vel, CFG.avoidMargin, true);
      if (!inArea(pos.x, pos.z)){
        tmp.set(S.center.x - pos.x, 0, S.center.z - pos.z).normalize();
        S.vel.addScaledVector(tmp, dt*1.5);
        pos.addScaledVector(tmp, dt*0.3);
      }
      pos.y = THREE.MathUtils.clamp(pos.y, CFG.minY, CFG.maxY);

      // Orientamento: guarda sempre verso di te, con inclinazione dal movimento
      const targetYaw = Math.atan2(head.x - pos.x, head.z - pos.z);
      S.yaw += angDiff(S.yaw, targetYaw) * (1 - Math.exp(-dt*3));

      // Salto + giro al tocco
      let jump = 0, spin = 0;
      if (S.jumpT >= 0){
        S.jumpT += dt/0.8;
        jump = Math.sin(Math.min(S.jumpT,1)*Math.PI) * 0.25;
        if (S.jumpT >= 1) S.jumpT = -1;
      }
      if (S.spinT >= 0){
        S.spinT += dt/0.9;
        const e = Math.min(S.spinT,1);
        spin = (e*e*(3-2*e)) * Math.PI*2;
        if (S.spinT >= 1) S.spinT = -1;
      }

      // Fluttuazione
      const bob = Math.sin(t*1.6)*0.035 + jump;
      logo.position.y = bob;
      pivot.rotation.y = S.yaw + spin;
      pivot.rotation.x = THREE.MathUtils.clamp(-S.vel.y*0.5, -0.3, 0.3) + Math.sin(t*1.1)*0.03;
      pivot.rotation.z = THREE.MathUtils.clamp(
        -(S.vel.x*Math.cos(S.yaw) - S.vel.z*Math.sin(S.yaw))*0.6, -0.35, 0.35);
      pivot.scale.setScalar(Math.max(0.001, grow) * (1 + Math.sin(t*2.2)*0.012));

      // Ombra al suolo
      const h = Math.max(0, pos.y + bob);
      shadow.position.set(pos.x, 0.005, pos.z);
      const sw = CFG.size * (0.9 + h*0.25) * grow;
      shadow.scale.set(sw, 1, sw);
      shadow.material.opacity = THREE.MathUtils.clamp(0.75 - h*0.28, 0.12, 0.7);
    }

    function render(time, frame){
      const t = time/1000;
      if (last === null) last = t;
      const dt = Math.min(t - last, 0.05); last = t;
      if (frame && renderer.xr.isPresenting) update(dt, t, frame);
      renderer.render(scene, camera);
    }

    /* ---------- Avvio ---------- */
    async function checkXR(){
      if (!navigator.xr){
        setStatus("Questo browser non espone WebXR. Apri il sito nel browser del Meta Quest.");
        return;
      }
      const ok = await navigator.xr.isSessionSupported("immersive-ar").catch(() => false);
      startBtn.disabled = !ok;
      if (ok){
        startBtn.textContent = "Entra nella realtà mista";
        setStatus("Pronto. Guardati intorno: il logo compare da solo.");
      } else {
        startBtn.textContent = "Realtà mista non disponibile";
        setStatus("La modalità immersive-ar non è disponibile in questo browser.");
      }
    }
    startBtn.addEventListener("click", startAR);
    checkXR();
  </script>
</body>
</html>
