<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tandem Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;500;700&display=swap">
<style>
/* Layout: canvas 16:9 centrato nello stage, HUD sopra, due gruppi di tasti touch agli angoli bassi (uno per giocatore).
   Look unico e scuro per scelta: tramonto viola con orizzonte arancio, come i colori del logo. */
:root{
  --night:#14082e; --plum:#2a1b4d; --violet:#5b2d91; --sun:#ff7a59; --lime:#9be564;
  --gold:#ffc83d; --coral:#ff5a6e; --teal:#36e2c9; --fg:#f6efff; --dim:#b3a5d6;
  --display:'Bungee',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--fg);font-family:var(--body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font-family:inherit}
button:focus-visible{outline:3px solid var(--teal);outline-offset:3px}

#stage{position:relative;width:100%;height:100%;overflow:hidden;background:var(--night);touch-action:none}
#cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#1d1050;display:block}

#hud{position:absolute;inset:0;z-index:3;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 0;display:grid;grid-template-columns:1fr minmax(0,320px) 1fr;gap:12px;align-items:start;pointer-events:none}
.hl{display:grid;gap:4px;justify-items:start;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.big{font:400 clamp(1.5rem,5vw,2.4rem)/1 var(--display);font-variant-numeric:tabular-nums}
.big small{font-size:.5em;color:var(--dim);margin-left:4px}
.coins{font:700 clamp(.9rem,2.6vw,1.15rem)/1 var(--body);color:var(--gold);display:flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums}
.coins::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.en{display:grid;gap:4px;min-width:0}
.en span{font:700 10px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-align:center}
.bar{height:14px;border-radius:7px;background:rgba(20,8,46,.7);box-shadow:inset 0 0 0 2px rgba(246,239,255,.3);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--lime),var(--teal));transform-origin:left;transition:background .2s}
.bar.low i{background:linear-gradient(90deg,var(--coral),var(--sun))}
.bar.low{animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.55}}
.hr{display:grid;gap:6px;justify-items:end}
.chip{font:700 11px/1.2 var(--body);letter-spacing:.04em;padding:5px 9px;border-radius:6px;background:rgba(20,8,46,.7);box-shadow:inset 0 0 0 1px rgba(246,239,255,.25);white-space:nowrap}
.chip b{font-family:var(--display);font-weight:400;margin-right:6px}
.chip.p1 b{color:var(--teal)}.chip.p2 b{color:var(--sun)}
#pz{pointer-events:auto;width:38px;height:30px;border-radius:6px;border:1px solid rgba(246,239,255,.35);background:rgba(20,8,46,.7);color:var(--fg);font:700 12px var(--body);cursor:pointer}

#touch{position:absolute;left:0;right:0;bottom:0;z-index:4;pointer-events:none;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px))}
.cl{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:flex-end;pointer-events:none}
#clL{left:16px}#clR{right:16px}
.tb{pointer-events:auto;touch-action:none;width:78px;height:78px;border-radius:20px;border:0;background:rgba(246,239,255,.16);box-shadow:inset 0 0 0 2px rgba(246,239,255,.35);color:var(--fg);font:400 22px/1 var(--display);display:grid;place-content:center;gap:2px;text-align:center;cursor:pointer;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.tb small{font:700 10px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.tb.on{background:rgba(54,226,201,.4)}
.tb.big{width:96px;height:96px}
.tb.jump{background:rgba(255,122,89,.28);box-shadow:inset 0 0 0 2px rgba(255,122,89,.7)}
.tb.act{background:rgba(255,200,61,.2);box-shadow:inset 0 0 0 2px rgba(255,200,61,.6)}
.tb.mv{box-shadow:inset 0 0 0 2px rgba(54,226,201,.6)}

#overlay{position:absolute;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:radial-gradient(120% 90% at 50% 100%,rgba(255,122,89,.18),transparent 60%),rgba(20,8,46,.88);overflow:auto}
.panel{width:min(44rem,100%);display:grid;gap:18px;min-width:0;padding-block:8px}
.top{display:flex;gap:18px;align-items:center}
.logo{width:84px;height:84px;border-radius:50%;flex:none;animation:spin 8s linear infinite;box-shadow:0 0 0 4px rgba(246,239,255,.9),0 8px 30px rgba(0,0,0,.5)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.logo{animation:none}.bar.low{animation:none}}
.kicker{margin:0 0 6px;font:700 12px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}
h1{margin:0;font:400 clamp(2.2rem,9vw,3.8rem)/.95 var(--display);letter-spacing:-.01em}
h1 span{color:var(--sun)}
h2{margin:0;font:400 clamp(1.6rem,6vw,2.4rem)/1.05 var(--display);text-wrap:balance}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.roles{grid-template-columns:1fr}}
.card{display:grid;gap:8px;align-content:start;min-width:0;padding:14px;border-radius:14px;background:rgba(246,239,255,.07);box-shadow:inset 0 0 0 1px rgba(246,239,255,.16)}
.card.p1{box-shadow:inset 0 0 0 2px rgba(54,226,201,.7)}
.card.p2{box-shadow:inset 0 0 0 2px rgba(255,122,89,.8)}
.card .seat{font:700 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.card h3{margin:0;font:400 1.1rem/1.15 var(--display)}
.card.p1 h3{color:var(--teal)}.card.p2 h3{color:var(--sun)}
.card p{margin:0;font-size:.92rem;line-height:1.4;color:#d9ceef}
.keys{display:flex;flex-wrap:wrap;gap:6px}
kbd{font:700 .85rem/1 var(--body);padding:7px 10px;border-radius:7px;background:#f6efff;color:#2a1b4d;box-shadow:0 3px 0 #a99bd0}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:.92rem;line-height:1.4;color:var(--dim)}
.rules b{color:var(--fg);font-weight:700}
.btns{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.cta{font:400 1.05rem/1 var(--display);color:#2a1b4d;background:var(--lime);border:0;border-radius:12px;padding:16px 28px;cursor:pointer;box-shadow:0 6px 0 #5f9a2e}
.cta:active{transform:translateY(3px);box-shadow:0 3px 0 #5f9a2e}
.sec{font:700 .95rem/1 var(--body);color:var(--fg);background:transparent;border:2px solid rgba(246,239,255,.45);border-radius:12px;padding:14px 20px;cursor:pointer}
.sec:active{background:rgba(246,239,255,.12)}
.stat-grid{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px}
.stat-grid dt{font:700 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.stat-grid dd{margin:3px 0 0;font:400 1.7rem/1 var(--display);font-variant-numeric:tabular-nums}
.note{margin:0;font:500 .85rem var(--body);color:var(--dim)}
#portrait{display:none;position:absolute;left:0;right:0;bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:3;text-align:center;font:700 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);pointer-events:none}
@media (orientation:portrait){.touchmode #portrait{display:block}}
</style>

<div id="stage">
  <canvas id="cv" width="960" height="540" aria-label="Area di gioco"></canvas>
  <div id="hud" hidden>
    <div class="hl"><div class="big"><span id="m">0</span><small>m</small></div><div class="coins" id="cn">0</div></div>
    <div class="en"><div class="bar" id="bar"><i id="enf"></i></div><span>Energia</span></div>
    <div class="hr"><div class="chip p1" id="c1"></div><div class="chip p2" id="c2"></div><button id="pz" type="button" aria-label="Pausa">II</button></div>
  </div>
  <div id="portrait">Gira il telefono in orizzontale per giocare meglio</div>
  <div id="touch" hidden>
    <div class="cl" id="clL"></div>
    <div class="cl" id="clR"></div>
  </div>
  <div id="overlay"></div>
</div>

/* ---------- audio ---------- */
var ac=null,muted=false;
function beep(f,d,type,vol,f2){
  if(muted)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(vol||0.06,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}

/* ---------- input: due ruoli, due layout, tastiera e touch insieme ---------- */
/* Giocatore 1 = Movimento (left, right, slide). Giocatore 2 = Salto e azione (jump, act).
   Postazione sinistra: A D S per muoversi, W/Spazio e E/Q per salto e azione.
   Postazione destra: frecce per muoversi, Su/Spazio e Invio/Shift per salto e azione.
   "Inverti ruoli" scambia quale postazione fa cosa. */
function keyMap(){
  return swapped
    ?{ArrowLeft:'left',ArrowRight:'right',ArrowDown:'slide',KeyW:'jump',Space:'jump',KeyE:'act',KeyQ:'act',ShiftLeft:'act',KeyF:'act'}
    :{KeyA:'left',KeyD:'right',KeyS:'slide',ArrowUp:'jump',Space:'jump',Enter:'act',ShiftRight:'act',Slash:'act',KeyM:'act'};
}
var down=new Set(),touchDown={},jumpEdge=false,actEdge=false;
function held(ctrl){
  if(touchDown[ctrl]>0)return true;
  var map=keyMap(),ok=false;
  down.forEach(function(c){if(map[c]===ctrl)ok=true;});
  return ok;
}
window.addEventListener('keydown',function(e){
  var map=keyMap(),c=map[e.code];
  if(c||e.code==='Space'||e.code.indexOf('Arrow')===0)e.preventDefault();
  if(e.code==='Escape'||e.code==='KeyP'){if(!e.repeat)togglePause();return;}
  if(mode==='menu'||mode==='over'){
    if((e.code==='Enter'||e.code==='Space')&&!e.repeat){var b=overlay.querySelector('.cta');if(b)b.click();}
    return;
  }
  down.add(e.code);
  if(!e.repeat&&c==='jump')jumpEdge=true;
  if(!e.repeat&&c==='act')actEdge=true;
});
window.addEventListener('keyup',function(e){down.delete(e.code);});
window.addEventListener('blur',function(){down.clear();touchDown={};});

/* touch */
var tPtr={};
function setTouchMode(){
  if(isTouch)return;
  isTouch=true;document.body.classList.add('touchmode');
}
if(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches)setTouchMode();
function layoutTouch(){
  var mv='<button class="tb mv" data-k="left" type="button" aria-label="Rallenta">&#9664;<small>Frena</small></button>'+
        '<button class="tb mv" data-k="right" type="button" aria-label="Accelera">&#9654;<small>Corri</small></button>'+
        '<button class="tb mv big" data-k="slide" type="button" aria-label="Scivola">&#9660;<small>Scivola</small></button>';
  var ac2='<button class="tb act" data-k="act" type="button" aria-label="Azione">&#10022;<small>Azione</small></button>'+
        '<button class="tb jump big" data-k="jump" type="button" aria-label="Salta">&#9650;<small>Salta</small></button>';
  $('clL').innerHTML=swapped?ac2:mv;
  $('clR').innerHTML=swapped?mv:ac2;
}
$('touch').addEventListener('pointerdown',function(e){
  var b=e.target.closest('[data-k]');
  if(!b)return;
  e.preventDefault();setTouchMode();
  var k=b.getAttribute('data-k');
  try{b.setPointerCapture(e.pointerId);}catch(er){}
  tPtr[e.pointerId]=k;touchDown[k]=(touchDown[k]||0)+1;b.classList.add('on');
  if(k==='jump')jumpEdge=true;
  if(k==='act')actEdge=true;
});
function tEnd(e){
  var k=tPtr[e.pointerId];
  if(!k)return;
  delete tPtr[e.pointerId];
  touchDown[k]=Math.max(0,(touchDown[k]||1)-1);
  if(!touchDown[k]){var bs=document.querySelectorAll('[data-k="'+k+'"]');for(var i=0;i<bs.length;i++)bs[i].classList.remove('on');}
}
window.addEventListener('pointerup',tEnd);
window.addEventListener('pointercancel',tEnd);
window.addEventListener('contextmenu',function(e){if(isTouch)e.preventDefault();});
window.addEventListener('touchstart',function(){setTouchMode();},{passive:true,once:true});

/* ---------- terreno procedurale ---------- */
function groundAt(x){
  for(var i=0;i<segs.length;i++){
    var s=segs[i];
    if(s.x0>x)return null;
    if(x<=s.x1)return s.y0+(s.y1-s.y0)*(x-s.x0)/(s.x1-s.x0);
  }
  return null;
}
function addSeg(len,dy){segs.push({x0:gx,x1:gx+len,y0:gy,y1:gy+dy});gx+=len;gy+=dy;}
function clampDy(dy){if(gy+dy>455)return -Math.abs(dy);if(gy+dy<320)return Math.abs(dy);return dy;}
function flat(len,pat){var x0=gx,y=gy;addSeg(len,0);if(pat)pat(x0+80,x0+len-80,y);}

function oSpike(x,y,n){obs.push({t:'spike',x:x,y:y-24,w:28*n,h:24});}
function oRock(x,y){obs.push({t:'rock',x:x,y:y-34,w:46,h:34,br:true});}
function oLog(x,y){obs.push({t:'log',x:x,y:y-300,w:64,h:300-46});}
function oCeil(x,y){obs.push({t:'ceil',x:x,y:y-300,w:86,h:300-48});}
function oDrone(x,y){var by=y-70;obs.push({t:'drone',x:x,y:by,by:by,w:48,h:24,vx:-30,ph:Math.random()*6});}
function eWalker(x,y){ens.push({t:'walker',x:x,y:y-38,w:38,h:38,vx:-70,dead:0});}
function eFlyer(x,y,h){ens.push({t:'flyer',x:x,y:y-h,by:y-h,w:42,h:28,vx:-85,ph:Math.random()*6,dead:0});}
function coinArc(x,y,w){
  for(var i=0;i<5;i++){var t=i/4;coins.push({x:x+(t-0.5)*(w+140),y:y-30-Math.sin(t*Math.PI)*92,f:0});}
}
function coinLine(x,y,n){
  for(var i=0;i<n;i++)coins.push({x:x+i*36,y:y-22,f:0});
}
function place(kind,x,y){
  if(kind==='spike2'){oSpike(x,y,2);coinArc(x+28,y,56);}
  else if(kind==='spike3'){oSpike(x,y,3);coinArc(x+42,y,84);}
  else if(kind==='rock'){oRock(x,y);coinArc(x+23,y,46);}
  else if(kind==='log'){oLog(x,y);coinLine(x-40,y,4);}
  else if(kind==='ceil'){oCeil(x,y);coinLine(x-40,y,4);}
  else if(kind==='drone'){oDrone(x,y);}
  else if(kind==='walker'){eWalker(x,y);}
  else if(kind==='flyerLow'){eFlyer(x,y,78);}
  else if(kind==='flyerHigh'){eFlyer(x,y,125);}
}
var COMBOS=[
  [['spike2',0],['log',300]],
  [['walker',0],['log',330]],
  [['rock',0],['ceil',290],['spike2',580]],
  [['flyerLow',0],['spike3',270]],
  [['drone',0],['rock',300]],
  [['log',0],['spike2',300],['log',640]],
  [['walker',0],['flyerLow',240],['spike2',500]]
];
function singlePiece(d){
  var space=420-d*140,n=1+Math.floor(d*2+Math.random()*1.4);
  var len=Math.round(220+n*space);
  flat(len,function(a,b,y){
    var x=a+40;
    var pool=['spike2','spike3','rock','log','ceil','drone','walker','flyerLow','flyerHigh'];
    for(var i=0;i<n;i++){place(pick(pool),x,y);x+=space;}
    if(Math.random()<0.5)coinLine(a+20,y,6);
    if(Math.random()<0.2)coins.push({x:a+120,y:y-40,f:1});
  });
}
function comboPiece(d){
  var cb=pick(COMBOS),last=cb[cb.length-1][1];
  flat(last+420,function(a,b,y){
    for(var i=0;i<cb.length;i++)place(cb[i][0],a+40+cb[i][1],y);
    if(Math.random()<0.4)coins.push({x:a+60,y:y-40,f:1});
  });
}
function gapPiece(d){
  flat(220,null);
  var w=Math.round(110+d*80+rnd(0,35)),x0=gx,y=gy;
  gx+=w;
  if(Math.random()<0.55){plats.push({x0:x0-30,x1:x0+w+30,y:y-135});coinLine(x0-10,y-135+22,Math.ceil((w+20)/36));}
  coinArc(x0+w/2,y,w-60);
  flat(260,null);
}
function valleyPiece(d){
  var dy=Math.round(rnd(50,80));
  if(gy+dy>455)dy=Math.max(30,455-gy);
  addSeg(130,dy);
  flat(Math.round(rnd(260,380)),function(a,b,y){
    var r=Math.random();
    if(r<0.5)place(pick(['spike2','rock','walker','log']),(a+b)/2,y);
    coinLine(a,y,5);
  });
  addSeg(130,-dy);
}
function rampPiece(){
  var dy=pick([-1,1])*Math.round(rnd(40,90));
  dy=clampDy(dy);
  var x0=gx,y0=gy;
  addSeg(Math.round(rnd(190,260)),dy);
  for(var i=1;i<5;i++)coins.push({x:x0+i*45,y:y0+dy*(i*45/220)-26,f:0});
  flat(160,null);
}
function platPiece(d){
  flat(560,function(a,b,y){
    var py=y-rnd(125,150);
    plats.push({x0:a+20,x1:a+250,y:py});
    plats.push({x0:a+310,x1:a+500,y:py-rnd(0,25)});
    coinLine(a+40,py+22,6);
    coinLine(a+330,py+22,5);
    if(d>0.15)oSpike(a+270,y,1);
  });
}
function addPiece(){
  var m=gx/40,d=Math.min(1,m/900),r=Math.random();
  if(r<0.20)gapPiece(d);
  else if(r<0.31)valleyPiece(d);
  else if(r<0.43)rampPiece();
  else if(r<0.55)platPiece(d);
  else if(r<0.80&&m>90)comboPiece(d);
  else singlePiece(d);
}
function genUntil(x){while(gx<x)addPiece();}

/* ---------- partita ---------- */
function newGame(){
  segs=[];obs=[];ens=[];coins=[];plats=[];parts=[];
  gx=0;gy=GY0;
  P={x:0,y:GY0,vy:0,on:true,surf:null,jumps:0,coy:0,jbuf:0,low:false,pound:false,spin:0,spinCD:0,V:240,anim:0,rot:0,cut:false,tilt:0};
  energy=100;coinsN=0;kills=0;shake=0;time=0;camX=-PX;
  addSeg(1100,0);
  coinLine(500,GY0,8);
  genUntil(2600);
  jumpEdge=actEdge=false;
}
function meters(){return Math.max(0,Math.floor(P.x/40));}
function scoreNow(){return meters()+coinsN*10+kills*25;}

function boxP(){var w=P.low?SLIDE_W:STAND_W,h=P.low?SLIDE_H:STAND_H;return {x:P.x-w/2+3,y:P.y-h+3,w:w-6,h:h-3};}
function ov(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function blockedStanding(){
  var b={x:P.x-STAND_W/2+3,y:P.y-STAND_H+3,w:STAND_W-6,h:STAND_H-3};
  for(var i=0;i<obs.length;i++){
    var o=obs[i];
    if((o.t==='log'||o.t==='ceil'||o.t==='drone')&&ov(b,{x:o.x+3,y:o.y,w:o.w-6,h:o.h}))return true;
  }
  for(i=0;i<ens.length;i++){var e=ens[i];if(e.t==='flyer'&&!e.dead&&ov(b,e))return true;}
  return false;
}
function burst(x,y,col,n,sp){
  for(var i=0;i<n;i++){var a=Math.random()*6.28,s=rnd(0.3,1)*(sp||160);parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,l:rnd(0.3,0.7),m:0.7,c:col,s:rnd(2,5)});}
}
function die(reason){
  if(mode!=='play')return;
  mode='over';shake=14;
  burst(P.x,P.y-30,'#ffffff',26,260);burst(P.x,P.y-30,'#ff7a59',18,200);
  beep(300,0.5,'sawtooth',0.07,60);
  var sc=scoreNow(),isBest=sc>best;
  if(isBest){best=sc;try{localStorage.setItem('tandem-best',String(best));}catch(e){}}
  hud.hidden=true;$('touch').hidden=true;
  setTimeout(function(){
    if(mode!=='over')return;
    panel('<p class="kicker">Fine della corsa</p><h2>'+reason+'</h2>'+
      '<dl class="stat-grid"><div><dt>Metri</dt><dd>'+meters()+'</dd></div><div><dt>Monete</dt><dd>'+coinsN+'</dd></div>'+
      '<div><dt>Punteggio</dt><dd>'+sc+'</dd></div><div><dt>Record</dt><dd>'+best+'</dd></div></dl>'+
      (isBest?'<p class="note">Nuovo record di coppia.</p>':'')+
      '<div class="btns"><button class="cta" data-act="start" type="button">Rigioca</button><button class="sec" data-act="menu" type="button">Ruoli</button></div>');
  },650);
}

function doJump(v,n){
  P.vy=-v;P.on=false;P.surf=null;P.coy=0;P.jumps=n;P.jbuf=0;P.cut=false;
  burst(P.x,P.y,'rgba(255,255,255,.7)',6,90);
  beep(n===1?420:560,0.12,'square',0.04,n===1?760:900);
}
function land(y,surf,impact){
  P.y=y;P.on=true;P.surf=surf;P.vy=0;P.jumps=0;P.cut=false;
  if(P.pound&&impact>520){
    shake=9;beep(120,0.25,'sawtooth',0.08,50);
    burst(P.x,P.y,'#ffc83d',16,240);
    parts.push({ring:1,x:P.x,y:P.y,l:0.3,m:0.3,r:110});
    for(var i=0;i<ens.length;i++){var e=ens[i];if(!e.dead&&e.t==='walker'&&Math.abs(e.x+e.w/2-P.x)<115)killEnemy(e);}
    for(i=0;i<obs.length;i++){var o=obs[i];if(o.br&&Math.abs(o.x+o.w/2-P.x)<95){obs.splice(i,1);i--;burst(o.x+o.w/2,o.y+o.h/2,'#8a7fb0',10,160);}}
  }else if(impact>300){burst(P.x,P.y,'rgba(255,255,255,.6)',5,80);}
}
function killEnemy(e){
  if(e.dead)return;
  e.dead=0.4;kills++;
  burst(e.x+e.w/2,e.y+e.h/2,e.t==='walker'?'#ff7a59':'#c58bff',12,180);
  beep(660,0.1,'triangle',0.05,990);
}

function update(dt){
  time+=dt;
  var hl=held('left'),hr=held('right'),hs=held('slide'),hj=held('jump');
  var m=P.x/40,cruise=240+Math.min(200,m*0.7);
  var vmax=cruise+170,vmin=Math.max(110,cruise-120);
  if(hr)P.V=Math.min(vmax,P.V+420*dt);
  else if(hl)P.V=Math.max(vmin,P.V-560*dt);
  else P.V+=(cruise-P.V)*Math.min(1,dt*1.6);

  /* postura: scivolata a terra o scivolata in aria (hitbox bassa), in aria con S premuto cadi più veloce */
  if(hs)P.low=true;
  else if(P.low&&!blockedStanding())P.low=false;
  P.pound=hs&&!P.on;

  /* salto, doppio salto, altezza variabile */
  P.jbuf-=dt;if(jumpEdge){P.jbuf=0.12;jumpEdge=false;}
  if(P.jbuf>0){
    if(P.on||P.coy>0)doJump(JV,1);
    else if(P.jumps<2)doJump(JV2,2);
  }
  if(!P.on&&!hj&&P.vy<-240&&!P.cut){P.vy*=0.5;P.cut=true;}

  /* azione: spirale scudo */
  P.spinCD-=dt;
  if(actEdge){
    actEdge=false;
    if(P.spinCD<=0&&energy>=5){P.spin=0.38;P.spinCD=0.9;energy-=5;beep(240,0.25,'sawtooth',0.05,520);}
  }
  if(P.spin>0)P.spin-=dt;

  /* movimento orizzontale e verticale */
  var vEff=P.V*(P.low&&P.on?1.1:1);
  P.x+=vEff*dt;
  var g=groundAt(P.x),prevY=P.y,impact=0;
  if(P.on){
    if(P.surf){
      if(P.x<P.surf.x0-8||P.x>P.surf.x1+8){P.on=false;P.surf=null;P.coy=0.08;P.vy=0;}
      else P.y=P.surf.y;
    }else if(g!==null&&g-P.y<20){P.y=g;}
    else{P.on=false;P.coy=0.08;P.vy=0;}
  }
  if(!P.on){
    P.coy-=dt;
    if(P.coy<=0&&P.jumps===0)P.jumps=1;
    P.vy+=GRAV*dt*(P.pound?1.9:1);
    if(P.pound&&P.vy<560)P.vy=560;
    if(P.vy>1100)P.vy=1100;
    P.y+=P.vy*dt;
    impact=P.vy;
    if(g!==null&&P.vy>=0&&P.y>=g&&prevY<=g+12)land(g,null,impact);
    else{
      for(var i=0;i<plats.length;i++){
        var p=plats[i];
        if(P.vy>=0&&P.x>=p.x0-6&&P.x<=p.x1+6&&prevY<=p.y+2&&P.y>=p.y){land(p.y,p,impact);break;}
      }
    }
  }
  P.anim+=dt*(P.V/22);
  if(P.low||P.spin>0)P.rot+=(P.spin>0?20:P.V/17)*dt;else P.rot=0;
  if(P.low&&P.on&&Math.random()<0.5)parts.push({x:P.x-10,y:P.y-2,vx:-rnd(40,120),vy:-rnd(20,70),l:0.35,m:0.35,c:'rgba(255,255,255,.55)',s:rnd(2,4)});

  /* energia: si consuma correndo, più veloce = più consumo */
  energy-=(2.4+P.V/170)*dt;
  if(energy<=0){energy=0;die('Energia esaurita');return;}
  if(P.y>H+160){die('Sei caduto nel baratro');return;}

  /* generazione e pulizia */
  genUntil(P.x+2600);
  cleanT+=dt;
  if(cleanT>0.5){
    cleanT=0;var lim=P.x-PX-400;
    while(segs.length>1&&segs[0].x1<lim)segs.shift();
    obs=obs.filter(function(o){return o.x+o.w>lim;});
    ens=ens.filter(function(e){return e.x+e.w>lim&&e.y<H+200;});
    coins=coins.filter(function(c){return c.x>lim&&!c.got;});
    plats=plats.filter(function(p){return p.x1>lim;});
  }

  /* nemici e ostacoli in movimento */
  var i2;
  for(i2=0;i2<obs.length;i2++){var o=obs[i2];if(o.t==='drone'){o.x+=o.vx*dt;o.y=o.by+Math.sin(time*3+o.ph)*8;}}
  for(i2=0;i2<ens.length;i2++){
    var e=ens[i2];
    if(e.dead){e.dead-=dt;continue;}
    e.x+=e.vx*dt;
    if(e.t==='walker'){var gg=groundAt(e.x+e.w/2);if(gg===null)e.y+=320*dt;else e.y=gg-e.h;}
    else e.y=e.by+Math.sin(time*3+e.ph)*18;
  }
  ens=ens.filter(function(e){return !(e.dead&&e.dead<=0);});

  /* spirale: colpisce nemici e rocce entro il raggio */
  if(P.spin>0){
    var cx=P.x,cy=P.y-34;
    for(i2=0;i2<ens.length;i2++){
      e=ens[i2];
      if(!e.dead&&Math.hypot(e.x+e.w/2-cx,e.y+e.h/2-cy)<95)killEnemy(e);
    }
    for(i2=0;i2<obs.length;i2++){
      o=obs[i2];
      if(o.br&&Math.hypot(o.x+o.w/2-cx,o.y+o.h/2-cy)<95){obs.splice(i2,1);i2--;kills++;burst(o.x+o.w/2,o.y+o.h/2,'#8a7fb0',10,170);beep(180,0.1,'square',0.05);}
    }
  }

  /* collisioni */
  var b=boxP();
  for(i2=0;i2<obs.length;i2++){
    o=obs[i2];
    if(o.x>P.x+120||o.x+o.w<P.x-120)continue;
    if(ov(b,{x:o.x+4,y:o.y+(o.t==='spike'?4:0),w:o.w-8,h:o.h-(o.t==='spike'?4:0)})){
      var why={spike:'Spine non evitate',rock:'Roccia non evitata',log:'Tronco: serviva la scivolata',ceil:'Trappola a soffitto: serviva la scivolata',drone:'Drone: serviva la scivolata'}[o.t];
      die(why);return;
    }
  }
  for(i2=0;i2<ens.length;i2++){
    e=ens[i2];
    if(e.dead)continue;
    if(ov(b,{x:e.x+3,y:e.y+3,w:e.w-6,h:e.h-6})){
      if(!P.on&&P.vy>60&&prevY<=e.y+14){killEnemy(e);P.vy=-430;P.jumps=1;P.cut=true;beep(520,0.1,'square',0.05,880);}
      else if(P.spin>0){killEnemy(e);}
      else{die(e.t==='walker'?'Nemico a terra: serviva un salto o un attacco':'Nemico volante: serviva un attacco o la scivolata');return;}
    }
  }
  /* monete e cibo */
  for(i2=0;i2<coins.length;i2++){
    var c=coins[i2];
    if(c.got)continue;
    var dx=P.x-c.x,dy=(P.y-34)-c.y;
    if(dx*dx+dy*dy<34*34){
      c.got=true;
      if(c.f){energy=Math.min(100,energy+22);beep(500,0.15,'triangle',0.06,900);burst(c.x,c.y,'#ff5a6e',10,140);}
      else{coinsN++;energy=Math.min(100,energy+2.5);beep(980,0.07,'triangle',0.04,1500);burst(c.x,c.y,'#ffc83d',5,110);}
    }
  }
  /* particelle */
  for(i2=0;i2<parts.length;i2++){
    var q=parts[i2];q.l-=dt;
    if(!q.ring){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=500*dt;}
  }
  parts=parts.filter(function(q){return q.l>0;});
  if(shake>0)shake=Math.max(0,shake-dt*30);
}

/* ---------- disegno ---------- */
var STARS=[];for(var si=0;si<50;si++)STARS.push([Math.random()*W,Math.random()*210,Math.random()*1.6+0.4,Math.random()*6]);
function mountains(f,baseY,amp,col,seed){
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,H);
  for(var x=0;x<=W+12;x+=12){
    var wx=x+camX*f;
    var y=baseY-(Math.sin(wx*0.004+seed)*0.5+0.5)*amp-(Math.sin(wx*0.011+seed*2)*0.5+0.5)*amp*0.4;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,H);ctx.closePath();ctx.fill();
}
function drawBG(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1d1050');g.addColorStop(0.45,'#5b2d91');g.addColorStop(0.75,'#ff7a59');g.addColorStop(1,'#ffb36b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(var i=0;i<STARS.length;i++){var s=STARS[i];ctx.globalAlpha=0.35+0.4*Math.abs(Math.sin(time*1.5+s[3]));ctx.fillStyle='#fff';ctx.fillRect(s[0],s[1],s[2],s[2]);}
  ctx.globalAlpha=1;
  var sg=ctx.createRadialGradient(690,330,10,690,330,120);
  sg.addColorStop(0,'rgba(255,230,160,.95)');sg.addColorStop(1,'rgba(255,122,89,0)');
  ctx.fillStyle=sg;ctx.beginPath();ctx.arc(690,330,120,0,6.283);ctx.fill();
  mountains(0.08,330,120,'#4b2582',1.3);
  mountains(0.2,380,110,'#3a1c6b',4.1);
  mountains(0.38,430,90,'#2a1250',7.7);
}
function drawTerrain(){
  var i,s;
  /* abisso nei baratri */
  for(i=0;i<segs.length-1;i++){
    var a=segs[i],b=segs[i+1];
    if(b.x0>a.x1+1){
      var x0=a.x1-camX,x1=b.x0-camX;
      if(x1<-10||x0>W+10)continue;
      var top=Math.min(a.y1,b.y0)+4,gr=ctx.createLinearGradient(0,top,0,H);
      gr.addColorStop(0,'#1a0a35');gr.addColorStop(1,'#05010f');
      ctx.fillStyle=gr;ctx.fillRect(x0,top,x1-x0,H-top);
    }
  }
  for(i=0;i<segs.length;i++){
    s=segs[i];
    if(s.x1-camX<-20||s.x0-camX>W+20)continue;
    var X0=s.x0-camX,X1=s.x1-camX;
    ctx.fillStyle='#9be564';
    ctx.beginPath();ctx.moveTo(X0,s.y0);ctx.lineTo(X1,s.y1);ctx.lineTo(X1,H+30);ctx.lineTo(X0,H+30);ctx.closePath();ctx.fill();
    ctx.fillStyle='#2a1b4d';
    ctx.beginPath();ctx.moveTo(X0,s.y0+12);ctx.lineTo(X1,s.y1+12);ctx.lineTo(X1,H+30);ctx.lineTo(X0,H+30);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(155,229,100,.18)';ctx.lineWidth=2;
    for(var k=0;k<4;k++){
      ctx.beginPath();ctx.moveTo(X0,s.y0+34+k*28);ctx.lineTo(X1,s.y1+34+k*28);ctx.stroke();
    }
  }
}
function drawPlats(){
  for(var i=0;i<plats.length;i++){
    var p=plats[i],x=p.x0-camX,w=p.x1-p.x0;
    if(x>W+20||x+w<-20)continue;
    ctx.fillStyle='#36e2c9';ctx.fillRect(x,p.y,w,6);
    ctx.fillStyle='#2a8fa8';ctx.fillRect(x,p.y+6,w,10);
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(x+4,p.y+1,w-8,2);
  }
}
function drawObs(){
  var i,o,x;
  for(i=0;i<obs.length;i++){
    o=obs[i];x=o.x-camX;
    if(x>W+100||x+o.w<-100)continue;
    if(o.t==='spike'){
      ctx.fillStyle='#ff5a6e';
      var n=Math.round(o.w/28);
      for(var k=0;k<n;k++){ctx.beginPath();ctx.moveTo(x+k*28,o.y+o.h);ctx.lineTo(x+k*28+14,o.y);ctx.lineTo(x+k*28+28,o.y+o.h);ctx.closePath();ctx.fill();}
    }else if(o.t==='rock'){
      ctx.fillStyle='#8a7fb0';ctx.beginPath();ctx.moveTo(x,o.y+o.h);ctx.lineTo(x+6,o.y+12);ctx.lineTo(x+18,o.y);ctx.lineTo(x+34,o.y+4);ctx.lineTo(x+o.w,o.y+16);ctx.lineTo(x+o.w,o.y+o.h);ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.25)';ctx.beginPath();ctx.moveTo(x+18,o.y);ctx.lineTo(x+34,o.y+4);ctx.lineTo(x+24,o.y+14);ctx.closePath();ctx.fill();
    }else if(o.t==='log'){
      ctx.strokeStyle='#d9c2a0';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(x+12,-10);ctx.lineTo(x+12,o.y+o.h-6);ctx.moveTo(x+o.w-12,-10);ctx.lineTo(x+o.w-12,o.y+o.h-6);ctx.stroke();
      ctx.fillStyle='#a8693a';ctx.fillRect(x,o.y+o.h-34,o.w,34);
      ctx.fillStyle='#7b4a22';ctx.beginPath();ctx.ellipse(x+o.w,o.y+o.h-17,6,17,0,0,6.283);ctx.fill();
      ctx.strokeStyle='#7b4a22';ctx.lineWidth=2;for(var r=1;r<4;r++){ctx.beginPath();ctx.moveTo(x+r*14,o.y+o.h-34);ctx.lineTo(x+r*14,o.y+o.h);ctx.stroke();}
    }else if(o.t==='ceil'){
      ctx.fillStyle='#3d2a6b';ctx.fillRect(x,-10,o.w,o.y+o.h-24+10);
      ctx.fillStyle='#ff5a6e';
      for(var s2=0;s2<3;s2++){ctx.beginPath();ctx.moveTo(x+s2*28+2,o.y+o.h-24);ctx.lineTo(x+s2*28+16,o.y+o.h);ctx.lineTo(x+s2*28+30,o.y+o.h-24);ctx.closePath();ctx.fill();}
    }else if(o.t==='drone'){
      ctx.fillStyle='#36e2c9';ctx.beginPath();ctx.ellipse(x+o.w/2,o.y+14,o.w/2,10,0,0,6.283);ctx.fill();
      ctx.fillStyle='#14082e';ctx.beginPath();ctx.arc(x+o.w/2,o.y+14,4,0,6.283);ctx.fill();
      var rw=Math.abs(Math.cos(time*30))*22+4;
      ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillRect(x+o.w/2-rw,o.y+2,rw*2,3);
      ctx.fillRect(x+o.w/2-2,o.y+3,4,6);
    }
  }
}
function drawEnemies(){
  for(var i=0;i<ens.length;i++){
    var e=ens[i],x=e.x-camX;
    if(x>W+60||x+e.w<-60)continue;
    ctx.save();
    if(e.dead){ctx.globalAlpha=Math.max(0,e.dead/0.4);ctx.translate(x+e.w/2,e.y+e.h);ctx.scale(1.2,0.4);ctx.translate(-(x+e.w/2),-(e.y+e.h));}
    if(e.t==='walker'){
      ctx.fillStyle='#ff7a59';ctx.beginPath();ctx.moveTo(x,e.y+e.h);ctx.quadraticCurveTo(x,e.y,x+e.w/2,e.y);ctx.quadraticCurveTo(x+e.w,e.y,x+e.w,e.y+e.h);ctx.closePath();ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+11,e.y+16,6,0,6.283);ctx.arc(x+27,e.y+16,6,0,6.283);ctx.fill();
      ctx.fillStyle='#14082e';ctx.beginPath();ctx.arc(x+9,e.y+17,3,0,6.283);ctx.arc(x+25,e.y+17,3,0,6.283);ctx.fill();
      ctx.strokeStyle='#14082e';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x+4,e.y+7);ctx.lineTo(x+15,e.y+11);ctx.moveTo(x+34,e.y+7);ctx.lineTo(x+23,e.y+11);ctx.stroke();
      var st=Math.sin(time*12+e.ph)*3;ctx.fillStyle='#14082e';ctx.fillRect(x+6+st,e.y+e.h-3,10,4);ctx.fillRect(x+22-st,e.y+e.h-3,10,4);
    }else{
      var fl=Math.sin(time*18+e.ph);
      ctx.fillStyle='#c58bff';
      ctx.beginPath();ctx.moveTo(x+e.w/2,e.y+8);ctx.lineTo(x-6,e.y+6-fl*10);ctx.lineTo(x+8,e.y+16);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(x+e.w/2,e.y+8);ctx.lineTo(x+e.w+6,e.y+6-fl*10);ctx.lineTo(x+e.w-8,e.y+16);ctx.closePath();ctx.fill();
      ctx.fillStyle='#7a3fc0';ctx.beginPath();ctx.ellipse(x+e.w/2,e.y+16,12,11,0,0,6.283);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+e.w/2-5,e.y+14,3.5,0,6.283);ctx.arc(x+e.w/2+5,e.y+14,3.5,0,6.283);ctx.fill();
      ctx.fillStyle='#14082e';ctx.fillRect(x+e.w/2-6,e.y+14,2,3);ctx.fillRect(x+e.w/2+4,e.y+14,2,3);
    }
    ctx.restore();
  }
}
function drawCoins(){
  for(var i=0;i<coins.length;i++){
    var c=coins[i];if(c.got)continue;
    var x=c.x-camX;if(x<-20||x>W+20)continue;
    var y=c.y+Math.sin(time*4+c.x*0.02)*2.5;
    if(c.f){
      ctx.fillStyle='#ff5a6e';ctx.beginPath();ctx.arc(x,y,10,0,6.283);ctx.fill();
      ctx.fillStyle='#9be564';ctx.beginPath();ctx.ellipse(x+4,y-11,6,3,-0.5,0,6.283);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.arc(x-3,y-3,3,0,6.283);ctx.fill();
    }else{
      var sw=Math.abs(Math.cos(time*4+c.x*0.01));
      ctx.fillStyle='#ffc83d';ctx.beginPath();ctx.ellipse(x,y,9*sw+1.5,9,0,0,6.283);ctx.fill();
      ctx.fillStyle='#fff3b0';ctx.beginPath();ctx.ellipse(x,y,4*sw+0.5,5,0,0,6.283);ctx.fill();
    }
  }
}
function drawPlayer(){
  var x=P.x-camX,low=P.low,r=low?17:30;
  ctx.save();ctx.translate(x,P.y);
  /* ombra */
  if(P.on){ctx.fillStyle='rgba(20,8,46,.35)';ctx.beginPath();ctx.ellipse(0,1,22,5,0,0,6.283);ctx.fill();}
  var bob=(P.on&&!low)?Math.abs(Math.sin(P.anim))*3:0;
  if(!low){
    var sw=P.on?Math.sin(P.anim)*11:5;
    ctx.lineCap='round';
    for(var s=-1;s<=1;s+=2){
      var lx=s*9,off=P.on?sw*s:(s>0?8:-4);
      ctx.strokeStyle='#2a1b4d';ctx.lineWidth=7;
      ctx.beginPath();ctx.moveTo(lx,-9-bob);ctx.lineTo(lx+off,P.on?0:-2);ctx.stroke();
      ctx.fillStyle='#ffc83d';ctx.beginPath();ctx.ellipse(lx+off+3,P.on?-1:-3,7,4,0,0,6.283);ctx.fill();
    }
    ctx.strokeStyle='#2a1b4d';ctx.lineWidth=6;
    for(s=-1;s<=1;s+=2){
      var asw=P.on?-Math.sin(P.anim)*12*s:(s>0?-10:10);
      ctx.beginPath();ctx.moveTo(s*28,-36-bob);ctx.lineTo(s*36,-30-bob+asw*0.5);ctx.stroke();
      ctx.fillStyle='#ffd9b0';ctx.beginPath();ctx.arc(s*36,-30-bob+asw*0.5,5,0,6.283);ctx.fill();
    }
  }
  var cy=low?-r:-36-bob;
  ctx.translate(0,cy);
  /* scudo a spirale */
  if(P.spin>0){
    var k=P.spin/0.38;
    var sg=ctx.createRadialGradient(0,0,r,0,0,r+34);
    sg.addColorStop(0,'rgba(54,226,201,.55)');sg.addColorStop(1,'rgba(54,226,201,0)');
    ctx.fillStyle=sg;ctx.beginPath();ctx.arc(0,0,r+34,0,6.283);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,'+(0.4+0.5*k)+')';ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(0,0,r+22,P.rot,P.rot+4.2);ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,r+12,P.rot+3,P.rot+6.5);ctx.stroke();
  }
  ctx.save();
  ctx.rotate(P.rot||0);
  ctx.beginPath();ctx.arc(0,0,r,0,6.283);ctx.closePath();
  ctx.fillStyle='#fff';ctx.fill();
  ctx.clip();
  if(logoOK){var ir=r*1.02;ctx.drawImage(logoImg,-ir,-ir,ir*2,ir*2);}
  else{ctx.fillStyle='#ff7a59';ctx.fillRect(-r,-r,r*2,r*2);}
  ctx.restore();
  ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.beginPath();ctx.arc(0,0,r,0,6.283);ctx.stroke();
  ctx.lineWidth=1.5;ctx.strokeStyle='#2a1b4d';ctx.beginPath();ctx.arc(0,0,r+1.8,0,6.283);ctx.stroke();
  ctx.restore();
  /* linee di velocità della schiacciata */
  if(P.pound){ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2;for(var j=-1;j<=1;j++){ctx.beginPath();ctx.moveTo(x+j*14,P.y-70);ctx.lineTo(x+j*14,P.y-48);ctx.stroke();}}
}
function drawParts(){
  for(var i=0;i<parts.length;i++){
    var q=parts[i],a=Math.max(0,q.l/q.m);
    if(q.ring){
      ctx.strokeStyle='rgba(255,200,61,'+a+')';ctx.lineWidth=5;
      ctx.beginPath();ctx.ellipse(q.x-camX,q.y,q.r*(1-a)+10,(q.r*(1-a)+10)*0.25,0,0,6.283);ctx.stroke();
    }else{
      ctx.globalAlpha=a;ctx.fillStyle=q.c;ctx.fillRect(q.x-camX-q.s/2,q.y-q.s/2,q.s,q.s);ctx.globalAlpha=1;
    }
  }
}
function render(){
  var sx=shake>0?(Math.random()-0.5)*shake:0,sy=shake>0?(Math.random()-0.5)*shake:0;
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  ctx.save();ctx.translate(sx,sy);
  drawBG();drawTerrain();drawPlats();drawCoins();drawObs();drawEnemies();
  if(P&&(mode!=='over'||true))drawPlayer();
  drawParts();
  ctx.restore();
}

/* ---------- interfaccia ---------- */
function keyLabels(){
  return {
    move:swapped?['←','→','↓']:['A','D','S'],
    act:swapped?['W','Spazio','E']:['↑','Spazio','Invio']
  };
}
function kbd(arr){return arr.map(function(k){return '<kbd>'+k+'</kbd>';}).join('');}
function panel(html){overlay.innerHTML='<div class="panel">'+html+'</div>';overlay.hidden=false;var b=overlay.querySelector('.cta');if(b)setTimeout(function(){b.focus({preventScroll:true});},30);}
function closePanel(){overlay.hidden=true;overlay.innerHTML='';}
function menu(){
  mode='menu';hud.hidden=true;$('touch').hidden=true;
  var kl=keyLabels();
  var seatMove=swapped?'Postazione destra':'Postazione sinistra',seatAct=swapped?'Postazione sinistra':'Postazione destra';
  panel('<div class="top"><img class="logo" alt="" src="'+LOGO+'"><div><p class="kicker">Corsa cooperativa · 2 giocatori</p><h1>Tandem<br><span>Run</span></h1></div></div>'+
    '<div class="roles">'+
    '<div class="card p1"><span class="seat">'+seatMove+'</span><h3>Giocatore 1<br>Movimento e postura</h3>'+
    '<p>Accelera e frena, scivola sotto tronchi e droni. In aria, tieni premuto per cadere veloce e schiacciare a terra.</p><div class="keys">'+kbd(kl.move)+'</div></div>'+
    '<div class="card p2"><span class="seat">'+seatAct+'</span><h3>Giocatore 2<br>Salto e azione</h3>'+
    '<p>Salta (due volte in aria, più tieni premuto più sale) e attiva la spirale scudo che abbatte nemici e rocce.</p><div class="keys">'+kbd(kl.act)+'</div></div></div>'+
    '<ul class="rules"><li><b>Obiettivo</b> corri più lontano che puoi, raccogliendo monete e cibo.</li>'+
    '<li><b>Fine</b> cadi in un baratro, urti un ostacolo o finisci l’energia. Correre la consuma, monete e cibo la ricaricano.</li></ul>'+
    '<div class="btns"><button class="cta" data-act="start" type="button">Inizia</button><button class="sec" data-act="swap" type="button">Inverti ruoli</button></div>'+
    (best?'<p class="note">Record di coppia: '+best+' punti</p>':'')+
    (isTouch?'<p class="note">Su telefono i tasti compaiono ai due lati dello schermo: uno per giocatore.</p>':''));
}
function startGame(){
  newGame();mode='play';closePanel();
  hud.hidden=false;
  layoutTouch();$('touch').hidden=!isTouch;
  var kl=keyLabels();
  $('c1').innerHTML='<b>P1</b>'+(isTouch?'Movimento':kl.move.join(' '));
  $('c2').innerHTML='<b>P2</b>'+(isTouch?'Salto e azione':kl.act.join(' '));
  beep(520,0.1,'triangle');
}
function togglePause(){
  if(mode==='play'){
    mode='pause';
    panel('<p class="kicker">Pausa</p><h2>Respirate un attimo</h2><div class="btns"><button class="cta" data-act="resume" type="button">Riprendi</button><button class="sec" data-act="menu" type="button">Esci ai ruoli</button></div>');
  }else if(mode==='pause'){mode='play';closePanel();}
}
overlay.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act');
  if(a==='start')startGame();
  else if(a==='swap'){swapped=!swapped;menu();}
  else if(a==='menu')menu();
  else if(a==='resume')togglePause();
});
$('pz').addEventListener('click',togglePause);

/* ---------- ciclo principale ---------- */
function resize(){
  var sw=stage.clientWidth,sh=stage.clientHeight,s=Math.min(sw/W,sh/H),dpr=Math.min(window.devicePixelRatio||1,2);
  cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';
  cv.width=Math.round(W*s*dpr);cv.height=Math.round(H*s*dpr);
}
window.addEventListener('resize',resize);
var last=0;
function loop(t){
  var dt=Math.min(0.033,(t-last)/1000||0.016);last=t;
  if(mode==='play'){
    update(dt);
    camX+=((P.x-PX)-camX)*Math.min(1,dt*12);
    hudT+=dt;
    if(hudT>0.1){
      hudT=0;
      $('m').textContent=meters();$('cn').textContent=coinsN;
      $('enf').style.transform='scaleX('+Math.max(0,energy/100)+')';
      $('bar').classList.toggle('low',energy<25);
    }
  }else if(mode==='menu'){
    /* demo di sfondo nel menu: il personaggio corre da solo su terreno fresco */
    menuT+=dt;
    if(!P||P.x>6000)newGame();
    time+=dt;P.V=250;P.x+=250*dt;P.anim+=dt*11;P.y=GY0;P.on=true;
    var gg=groundAt(P.x);if(gg!==null)P.y=gg;
    genUntil(P.x+2600);
    camX=P.x-PX;
    var lim=P.x-PX-400;while(segs.length>1&&segs[0].x1<lim)segs.shift();
    obs.length=0;ens.length=0;
  }else if(mode==='over'){
    for(var i=0;i<parts.length;i++){var q=parts[i];q.l-=dt;if(!q.ring){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=500*dt;}}
    parts=parts.filter(function(q){return q.l>0;});
    if(shake>0)shake=Math.max(0,shake-dt*30);
    time+=dt;
  }
  if(P)render();
  requestAnimationFrame(loop);
}
window.__run={get:function(){return P&&{x:P.x,y:P.y,V:P.V,on:P.on,low:P.low,pound:P.pound,spin:P.spin,jumps:P.jumps,energy:energy,mode:mode,m:meters(),coins:coinsN,nObs:obs.length,nEns:ens.length,swapped:swapped};},
  setX:function(x){P.x=x;},god:function(v){window.__god=v;}};
resize();newGame();menu();
requestAnimationFrame(loop);
})();
</script>
